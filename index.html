    <script>
    (function () {
        document.addEventListener("contextmenu", function (e) {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
            e.preventDefault();
            return false;
        });

        document.addEventListener("keydown", function (e) {
            if (
                e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
    })();

    <!-- ================= 2. CRASH-PROOF POST SANITIZER & MULTI-COLLECTION PRE-FETCHER ================= -->
    <script>
    (function () {
        if ("caches" in window) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
        }

        const PROJECT_ID = "nexus-community-bf99c";
        const BASE_REST_URL = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";

        function getDeletedIdsSet() {
            try {
                return new Set(JSON.parse(localStorage.getItem("nx_deleted_post_ids_v1") || "[]"));
            } catch (e) {
                return new Set();
            }
        }

        // CRITICAL FIX FOR 1000076971.jpg: Sanitizes every post object so `home.js` NEVER crashes mid-render!
        window.__nxSanitizePost = function (p, fallbackId) {
            if (!p || typeof p !== "object") return null;
            const copy = Object.assign({}, p);
            copy.id = String(copy.id || fallbackId || "post_" + Math.random().toString(36).slice(2, 8));
            copy.username = String(copy.username || copy.user || copy.author || "member").toLowerCase().replace(/^@/, "").trim() || "member";
            copy.author = String(copy.author || copy.name || copy.username || "Member").trim();
            copy.bio = String(copy.bio || "Nexus Member").trim();
            copy.dp = String(copy.dp || copy.authorDp || copy.userDp || "");

            const rawText = String(copy.content !== undefined ? copy.content : copy.text !== undefined ? copy.text : copy.caption || "");
            copy.content = rawText;
            copy.text = rawText;

            const rawImg = String(copy.image || copy.img || copy.photo || copy.mediaUrl || copy.videoUrl || "");
            // Prevent broken `NX_VIDEO_STREAM:` from crashing `home.js` image tags
            copy.image = rawImg;

            // Normalize timestamp from ANY field (`createdAt`, `timestamp`, `time`, `date`) so NO user post is ever lost!
            let ts = Number(copy.createdAt || copy.timestamp || copy.time || copy.date || 0);
            if (!ts || isNaN(ts) || ts < 1000000000) {
                ts = Date.now() - 3600000;
            }
            copy.createdAt = ts;
            copy.timestamp = ts;

            // Guarantee `likedBy`, `viewedBy` and `comments` are ALWAYS valid Arrays so `home.js` never throws TypeError!
            if (!Array.isArray(copy.likedBy)) {
                copy.likedBy = [];
            } else {
                copy.likedBy = copy.likedBy.filter((x) => typeof x === "string" && x.trim());
            }

            if (!Array.isArray(copy.viewedBy)) {
                copy.viewedBy = [];
            }

            if (!Array.isArray(copy.comments)) {
                copy.comments = [];
            } else {
                copy.comments = copy.comments
                    .filter((c) => c && typeof c === "object")
                    .map((c) => ({
                        username: String(c.username || c.author || "member"),
                        author: String(c.author || c.username || "Member"),
                        dp: String(c.dp || ""),
                        text: String(c.text || c.content || ""),
                        createdAt: Number(c.createdAt || c.time || Date.now())
                    }));
            }

            copy.likes = Math.max(copy.likedBy.length, Number(copy.likes || 0) || 0);
            copy.views = Math.max(copy.viewedBy.length, Number(copy.views || 1) || 1, copy.likes);
            copy.pinned = Boolean(copy.pinned === true);
            return copy;
        };

        window.__nxMarkPostDeletedLocally = function (postId) {
            if (!postId) return;
            try {
                const set = getDeletedIdsSet();
                set.add(String(postId));
                localStorage.setItem("nx_deleted_post_ids_v1", JSON.stringify(Array.from(set).slice(-250)));

                ["nx_light_posts_v1", "nx_posts", "nexus_posts"].forEach((k) => {
                    const raw = localStorage.getItem(k);
                    if (raw) {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr)) {
                            localStorage.setItem(k, JSON.stringify(arr.filter((p) => p && p.id !== postId)));
                        }
                    }
                });
            } catch (e) {}

            if (window.__NX_INSTANT_POSTS__) {
                window.__NX_INSTANT_POSTS__ = window.__NX_INSTANT_POSTS__.filter((p) => p && p.id !== postId);
            }
            if (window.Nexus && Array.isArray(Nexus.posts)) {
                Nexus.posts = Nexus.posts.filter((p) => p && p.id !== postId);
                Nexus.notifyAll && Nexus.notifyAll();
            }
        };

        function parseFirestoreValue(v) {
            if (!v || typeof v !== "object") return "";
            if ("stringValue" in v) return v.stringValue;
            if ("integerValue" in v) return Number(v.integerValue);
            if ("doubleValue" in v) return Number(v.doubleValue);
            if ("booleanValue" in v) return Boolean(v.booleanValue);
            if ("timestampValue" in v) return new Date(v.timestampValue).getTime();
            if ("arrayValue" in v) return (v.arrayValue.values || []).map(parseFirestoreValue);
            if ("mapValue" in v) return parseFirestoreFields(v.mapValue.fields || {});
            return "";
        }

        function parseFirestoreFields(fields) {
            if (!fields) return {};
            const out = {};
            for (const k in fields) out[k] = parseFirestoreValue(fields[k]);
            return out;
        }

        window.__nxIsRefreshSpamPost = function (postObj) {
            if (!postObj) return true;
            const deletedSet = getDeletedIdsSet();
            if (postObj.id && deletedSet.has(String(postObj.id))) return true;

            const raw = String(postObj.content || postObj.text || "")
                .toLowerCase()
                .replace(/\s+/g, " ");
            const uName = String(postObj.username || postObj.author || "").toLowerCase();

            if (
                raw.includes("website ko refresh") ||
                raw.includes("ek bar website ko refresh") ||
                raw.includes("ek baar refresh") ||
                (raw.includes("refresh") && raw.includes("updates properly dikh")) ||
                (raw.includes("refresh") && raw.includes("kar lena"))
            ) {
                return true;
            }

            if (
                (uName === "nexus" || uName === "nexus_official") &&
                postObj.pinned &&
                postObj.image &&
                raw.trim().length < 5
            ) {
                return true;
            }

            return false;
        };

        window.__nxPreloadPromise = (async function () {
            try {
                const lightMask =
                    "?pageSize=100&mask.fieldPaths=username&mask.fieldPaths=name&mask.fieldPaths=bio&mask.fieldPaths=isOnlineNow&mask.fieldPaths=lastOnline&mask.fieldPaths=lastSeenAt&mask.fieldPaths=verified&mask.fieldPaths=googleVerified&mask.fieldPaths=email&mask.fieldPaths=followersList&mask.fieldPaths=followingList&mask.fieldPaths=profileSongJson";

                // Fetch up to 150 posts from BOTH `nexus_real_posts` AND `nexus_posts` so NO user's post is ever missed!
                const [uLightRes, pRes1, pRes2] = await Promise.allSettled([
                    fetch(BASE_REST_URL + "/nexus_accounts" + lightMask, { cache: "no-store" }),
                    fetch(BASE_REST_URL + "/nexus_real_posts?pageSize=150", { cache: "no-store" }),
                    fetch(BASE_REST_URL + "/nexus_posts?pageSize=100", { cache: "no-store" })
                ]);

                if (uLightRes.status === "fulfilled" && uLightRes.value.ok) {
                    const uJson = await uLightRes.value.json();
                    if (uJson.documents && uJson.documents.length) {
                        const users = uJson.documents
                            .map((d) => parseFirestoreFields(d.fields))
                            .filter((u) => u && u.username);

                        if (users.length) {
                            window.__NX_INSTANT_USERS__ = users;
                            try { localStorage.setItem("nx_master_users_v1", JSON.stringify(users)); } catch (e) {}
                            if (window.Nexus) {
                                Nexus.cloudAccounts = users;
                                Nexus.rebuildAllUsersMasterList && Nexus.rebuildAllUsersMasterList();
                                Nexus.notifyAll && Nexus.notifyAll();
                            }
                        }
                    }
                }

                const combinedDocs = [];
                if (pRes1.status === "fulfilled" && pRes1.value.ok) {
                    const j1 = await pRes1.value.json();
                    if (j1.documents) combinedDocs.push(...j1.documents);
                }
                if (pRes2.status === "fulfilled" && pRes2.value.ok) {
                    const j2 = await pRes2.value.json();
                    if (j2.documents) combinedDocs.push(...j2.documents);
                }

                if (combinedDocs.length > 0) {
                    const postMap = new Map();
                    combinedDocs.forEach((d) => {
                        const docId = d.name.split("/").pop();
                        const rawObj = parseFirestoreFields(d.fields);
                        if (rawObj.createdAt && typeof rawObj.createdAt === "string") {
                            rawObj.createdAt = new Date(rawObj.createdAt).getTime() || Date.now();
                        } else if (!rawObj.createdAt && d.createTime) {
                            rawObj.createdAt = new Date(d.createTime).getTime() || Date.now();
                        }
                        const cleanPost = window.__nxSanitizePost(rawObj, docId);
                        if (cleanPost && !window.__nxIsRefreshSpamPost(cleanPost)) {
                            postMap.set(docId, cleanPost);
                        }
                    });

                    const posts = Array.from(postMap.values()).sort(
                        (a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0)
                    );

                    window.__NX_INSTANT_POSTS__ = posts;
                    try { localStorage.setItem("nx_light_posts_v1", JSON.stringify(posts.slice(0, 20))); } catch (e) {}
                    if (window.Nexus) {
                        Nexus.posts = posts;
                        Nexus.rebuildAllUsersMasterList && Nexus.rebuildAllUsersMasterList();
                        Nexus.notifyAll && Nexus.notifyAll();
                    }
                }

                fetch(BASE_REST_URL + "/nexus_accounts?pageSize=80", { cache: "no-store" })
                    .then((r) => (r.ok ? r.json() : null))
                    .then((fullJson) => {
                        if (fullJson && fullJson.documents && window.Nexus) {
                            const fullUsers = fullJson.documents
                                .map((d) => parseFirestoreFields(d.fields))
                                .filter((u) => u && u.username);
                            if (fullUsers.length) {
                                window.__NX_INSTANT_USERS__ = fullUsers;
                                Nexus.cloudAccounts = fullUsers;
                                Nexus.rebuildAllUsersMasterList && Nexus.rebuildAllUsersMasterList();
                                Nexus.notifyAll && Nexus.notifyAll();
                            }
                        }
                    })
                    .catch(() => {});
            } catch (e) {}
        })();
    })();
    </script>

    <!-- 3. TAILWIND CSS ENGINE + 0.01s LIVE DELETE / HOT-RELOAD LISTENER -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                corePlugins: { preflight: false },
                theme: {
                    extend: {
                        colors: {
                            nexusDark: '#090d16',
                            nexusCard: '#0f172a',
                            nexusGreen: '#10b981',
                            nexusCyan: '#38bdf8'
                        }
                    }
                }
            };
        }

        (function() {
            let currentAppVersion = null;

            document.addEventListener('input', function(e) {
                if (e.target && (e.target.id === 'nx-dm-input' || e.target.id === 'nx-chat-msg-in')) {
                    try { sessionStorage.setItem('nx_draft_' + e.target.id, e.target.value); } catch (err) {}
                }
            }, { passive: true });

            window.hotReloadNexusModule = function(fileName) {
                const oldScript = document.querySelector(`script[src^="${fileName}"]`);
                const newScript = document.createElement('script');
                newScript.src = `${fileName}?v=${Date.now()}`;
                newScript.charset = 'UTF-8';
                document.body.appendChild(newScript);
                if (oldScript) setTimeout(() => oldScript.remove(), 1500);
            };

            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.Nexus || !Nexus.db) return;
                    Nexus.db.collection("nexus_config").doc("live_version").onSnapshot(function(doc) {
                        if (!doc.exists) return;
                        let data = doc.data();
                        if (!data) return;

                        if (data.lastDeletedPostId && window.__nxMarkPostDeletedLocally) {
                            window.__nxMarkPostDeletedLocally(data.lastDeletedPostId);
                        }
                        if (Array.isArray(data.deletedPostIds) && window.__nxMarkPostDeletedLocally) {
                            data.deletedPostIds.forEach(id => window.__nxMarkPostDeletedLocally(id));
                        }
                        if (data.wipePostCacheAt) {
                            localStorage.removeItem("nx_light_posts_v1");
                            localStorage.removeItem("nx_posts");
                        }

                        if (!currentAppVersion) {
                            currentAppVersion = data.versionId;
                            return;
                        }
                        if (data.versionId && data.versionId !== currentAppVersion) {
                            currentAppVersion = data.versionId;
                            let targetFiles = Array.isArray(data.files) && data.files.length
                                ? data.files
                                : ['core.js', 'home.js', 'profile.js', 'post.js', 'settings.js'];
                            targetFiles.forEach(function(f) { window.hotReloadNexusModule(f); });
                        }
                    });
                }, 1000);
            });
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
            });
        }

        function safeSetLocalCache(key, dataObj) {
            try {
                localStorage.setItem(key, JSON.stringify(dataObj));
            } catch (e) {
                let me = localStorage.getItem('nx_active_account');
                let sv = localStorage.getItem('nx_saved_posts');
                let del = localStorage.getItem('nx_deleted_post_ids_v1');
                localStorage.clear();
                if (me) localStorage.setItem('nx_active_account', me);
                if (sv) localStorage.setItem('nx_saved_posts', sv);
                if (del) localStorage.setItem('nx_deleted_post_ids_v1', del);
            }
        }

        function cleanUniqueList(arr) {
            if (!Array.isArray(arr)) return [];
            let seen = new Set();
            let out = [];
            arr.forEach(item => {
                let s = String(item || '').trim().toLowerCase();
                if (s && !seen.has(s)) {
                    seen.add(s);
                    out.push(s);
                }
            });
            return out;
        }

        function loadInitialUsersCache() {
            if (window.__NX_INSTANT_USERS__ && window.__NX_INSTANT_USERS__.length) return window.__NX_INSTANT_USERS__;
            try { return JSON.parse(localStorage.getItem('nx_master_users_v1') || '[]'); } catch(e) { return []; }
        }

        function loadInitialPostsCache() {
            if (window.__NX_INSTANT_POSTS__ && window.__NX_INSTANT_POSTS__.length) return window.__NX_INSTANT_POSTS__;
            try {
                const raw = JSON.parse(localStorage.getItem('nx_light_posts_v1') || '[]');
                return raw
                    .map(p => window.__nxSanitizePost ? window.__nxSanitizePost(p) : p)
                    .filter(p => p && !window.__nxIsRefreshSpamPost(p));
            } catch(e) { return []; }
        }

        let lastUsersProfileHash = '';

        const NEXUS_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCKMUVSgImQ39LRuREmhqyd7NTyE-TNyrQ",
            authDomain: "nexus-community-bf99c.firebaseapp.com",
            projectId: "nexus-community-bf99c",
            storageBucket: "nexus-community-bf99c.firebasestorage.app",
            messagingSenderId: "605136574793",
            appId: "1:605136574793:web:c4c640af6b2f204eb0c296"
        };
        try {
            if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                firebase.initializeApp(NEXUS_FIREBASE_CONFIG);
            }
        } catch (e) {}

        window.Nexus = {
            config: NEXUS_FIREBASE_CONFIG,
            db: null,
            initialized: false,
            cloudReady: false,
            cloudAccounts: loadInitialUsersCache(),
            users: loadInitialUsersCache(),
            posts: loadInitialPostsCache(),
            rooms: {},
            pdfs: [],
            listeners: { onUsers: [], onPosts: [], onRooms: [] },

            rebuildAllUsersMasterList: function() {
                let map = {};

                (this.users || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let copy = Object.assign({}, u);
                        delete copy.pin;
                        copy.dp = copy.dp || '';
                        copy.lastOnline = Number(copy.lastOnline || copy.lastSeenAt || copy.lastSeen || copy.createdAt || 0);
                        copy.followersList = cleanUniqueList(copy.followersList);
                        copy.followingList = cleanUniqueList(copy.followingList);
                        map[key] = copy;
                    }
                });

                let rawMe = localStorage.getItem('nx_active_account');
                let myActiveKey = '';
                let myLocalDp = '';
                if (rawMe) {
                    try {
                        let me = JSON.parse(rawMe);
                        if (me && me.username) {
                            myActiveKey = me.username.toLowerCase().trim();
                            myLocalDp = me.dp || '';
                            map[myActiveKey] = Object.assign({}, map[myActiveKey] || {}, me, {
                                isOnlineNow: true,
                                lastOnline: Date.now(),
                                lastSeenAt: Date.now()
                            });
                        }
                    } catch(e) {}
                }

                (this.cloudAccounts || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let prevDp = (map[key] && map[key].dp) ? map[key].dp : '';
                        let prevOnline = (map[key] && map[key].lastOnline) ? Number(map[key].lastOnline) : 0;
                        let copy = Object.assign({}, map[key] || {}, u);
                        delete copy.pin;
                        copy.dp = u.dp || prevDp || (key === myActiveKey ? myLocalDp : '');
                        copy.lastOnline = Math.max(prevOnline, Number(u.lastOnline || u.lastSeenAt || u.lastSeen || u.createdAt || 0));
                        copy.lastSeenAt = copy.lastOnline;
                        copy.followersList = cleanUniqueList(u.followersList);
                        copy.followingList = cleanUniqueList(u.followingList);
                        map[key] = copy;

                        if (key === myActiveKey && rawMe) {
                            try {
                                let meParsed = JSON.parse(rawMe);
                                let syncedMe = Object.assign({}, meParsed, u, {
                                    dp: copy.dp,
                                    isOnlineNow: true,
                                    lastOnline: Date.now(),
                                    lastSeenAt: Date.now()
                                });
                                if (meParsed.googleVerified) {
                                    syncedMe.googleVerified = true;
                                    syncedMe.email = meParsed.email || u.email || '';
                                }
                                syncedMe.followersList = copy.followersList;
                                syncedMe.followingList = copy.followingList;
                                safeSetLocalCache('nx_active_account', syncedMe);
                            } catch (e) {}
                        }
                    }
                });

                (this.posts || []).forEach(p => {
                    if (!p || p.username === 'nexus_official' || (p.author || '').toLowerCase() === 'nexus') return;
                    let rawUname = (p.username || p.author || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
                    if (!rawUname) return;

                    let postTime = Number(p.createdAt || p.timestamp || 0);
                    let postDp = p.dp || p.authorDp || p.userDp || '';

                    let targetKey = rawUname;
                    let authorDisplay = (p.author || p.name || p.username || '').toLowerCase().trim();
                    for (let k in map) {
                        let m = map[k];
                        if (k === rawUname || (m && (m.name || '').toLowerCase().trim() === authorDisplay)) {
                            targetKey = k;
                            break;
                        }
                    }

                    if (!map[targetKey]) {
                        map[targetKey] = {
                            username: p.username || rawUname,
                            name: p.author || p.name || p.username || 'Member',
                            bio: p.bio || 'IIT-JEE Aspirant',
                            dp: postDp,
                            isOnlineNow: (Date.now() - postTime) < 90000,
                            lastOnline: postTime,
                            lastSeenAt: postTime,
                            followersList: [],
                            followingList: []
                        };
                    } else {
                        if (!map[targetKey].dp && postDp) map[targetKey].dp = postDp;
                        if (postTime > Number(map[targetKey].lastOnline || 0)) {
                            map[targetKey].lastOnline = postTime;
                            map[targetKey].lastSeenAt = postTime;
                        }
                    }
                });

                let byNameMap = {};
                let finalUsers = [];
                Object.values(map).forEach(u => {
                    if (!u || !u.username) return;
                    let ageMs = u.lastOnline > 1000000000000 ? (Date.now() - u.lastOnline) : 999999999;
                    u.isOnlineNow = Boolean((ageMs >= 0 && ageMs <= 90000) || u.username === myActiveKey);

                    let nameKey = (u.name || u.username).toLowerCase().trim();
                    if (!byNameMap[nameKey]) {
                        byNameMap[nameKey] = u;
                        finalUsers.push(u);
                    } else {
                        let existing = byNameMap[nameKey];
                        let existingScore = (existing.dp ? 10 : 0) + ((existing.followersList || []).length * 2) + (existing.lastOnline ? 1 : 0);
                        let currentScore = (u.dp ? 10 : 0) + ((u.followersList || []).length * 2) + (u.lastOnline ? 1 : 0);

                        if (currentScore > existingScore) {
                            u.dp = u.dp || existing.dp || '';
                            u.lastOnline = Math.max(Number(u.lastOnline || 0), Number(existing.lastOnline || 0));
                            u.lastSeenAt = u.lastOnline;
                            u.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            u.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                            let idx = finalUsers.indexOf(existing);
                            if (idx !== -1) finalUsers[idx] = u;
                            byNameMap[nameKey] = u;
                        } else {
                            existing.dp = existing.dp || u.dp || '';
                            existing.lastOnline = Math.max(Number(existing.lastOnline || 0), Number(u.lastOnline || 0));
                            existing.lastSeenAt = existing.lastOnline;
                            existing.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            existing.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                        }
                    }
                });

                finalUsers.sort((a, b) => {
                    if (a.username === myActiveKey) return -1;
                    if (b.username === myActiveKey) return 1;
                    if (a.isOnlineNow && !b.isOnlineNow) return -1;
                    if (!a.isOnlineNow && b.isOnlineNow) return 1;
                    return Number(b.lastOnline || 0) - Number(a.lastOnline || 0);
                });

                this.users = finalUsers;
                let lightUsers = this.users.map(u => ({
                    username: u.username,
                    name: u.name,
                    bio: u.bio,
                    dp: (u.dp && u.dp.length < 75000) ? u.dp : '',
                    moodNote: u.moodNote || '',
                    profileSongJson: u.profileSongJson || '',
                    isOnlineNow: u.isOnlineNow,
                    lastOnline: u.lastOnline,
                    lastSeenAt: u.lastOnline,
                    verified: u.verified,
                    followersList: u.followersList || [],
                    followingList: u.followingList || []
                }));
                safeSetLocalCache('nx_master_users_v1', lightUsers);
            },

            init: function() {
                if (this.initialized) return;
                this.initialized = true;
                this.rebuildAllUsersMasterList();
                this.connectCloud();
                this.notifyAll();
            },

            connectCloud: function() {
                if (this.db) return;
                try {
                    if (!firebase.apps.length) firebase.initializeApp(this.config);
                    this.db = firebase.firestore();
                } catch (e) {
                    return;
                }

                let rawMe = localStorage.getItem('nx_active_account');
                if (rawMe) {
                    try {
                        let meObj = JSON.parse(rawMe);
                        if (meObj && meObj.username) {
                            let updatePayload = {
                                isOnlineNow: true,
                                lastOnline: Date.now(),
                                lastSeenAt: Date.now()
                            };
                            if (meObj.dp) updatePayload.dp = meObj.dp;
                            this.db.collection("nexus_accounts").doc(meObj.username).set(updatePayload, { merge: true });
                        }
                    } catch(e) {}
                }

                this.db.collection("nexus_accounts").limit(85).onSnapshot(snap => {
                    this.cloudAccounts = [];
                    snap.forEach(d => this.cloudAccounts.push(d.data()));
                    this.cloudReady = true;
                    this.rebuildAllUsersMasterList();

                    let currentHash = this.users.map(u =>
                        `${u.username}:${u.name}:${(u.dp || '').length}:${u.isOnlineNow ? 1 : 0}:${u.lastOnline || 0}:${(u.followersList || []).length}`
                    ).join('|');

                    if (currentHash !== lastUsersProfileHash) {
                        lastUsersProfileHash = currentHash;
                        this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                    }
                });

                // FIXED: Queries `nexus_real_posts` AND `nexus_posts` WITHOUT `.orderBy("createdAt")` filter
                // so posts by ANY user (even with `timestamp` or missing `createdAt`) are 100% included and sorted!
                const realPostsMap = new Map();
                const legacyPostsMap = new Map();

                const mergeAndPublishAllPosts = () => {
                    const combinedMap = new Map([...legacyPostsMap, ...realPostsMap]);
                    const allCleanPosts = Array.from(combinedMap.values()).sort(
                        (a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0)
                    );

                    this.posts = allCleanPosts;
                    window.__NX_INSTANT_POSTS__ = allCleanPosts;
                    let ultraLightPosts = this.posts.slice(0, 18).map(p => Object.assign({}, p, {
                        image: (p.image && p.image.length > 55000) ? '' : p.image
                    }));
                    safeSetLocalCache('nx_light_posts_v1', ultraLightPosts);
                    this.rebuildAllUsersMasterList();
                    this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                    this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });
                };

                this.db.collection("nexus_real_posts").limit(120).onSnapshot(snap => {
                    snap.docChanges().forEach(change => {
                        if (change.type === "removed") {
                            realPostsMap.delete(change.doc.id);
                            if (window.__nxMarkPostDeletedLocally) window.__nxMarkPostDeletedLocally(change.doc.id);
                        }
                    });
                    realPostsMap.clear();
                    snap.forEach(d => {
                        let p = window.__nxSanitizePost(d.data(), d.id);
                        if (!p) return;
                        if (window.__nxIsRefreshSpamPost(p)) {
                            this.db.collection("nexus_real_posts").doc(d.id).delete().catch(() => {});
                        } else {
                            realPostsMap.set(d.id, p);
                        }
                    });
                    mergeAndPublishAllPosts();
                });

                this.db.collection("nexus_posts").limit(80).onSnapshot(snap => {
                    legacyPostsMap.clear();
                    snap.forEach(d => {
                        let p = window.__nxSanitizePost(d.data(), d.id);
                        if (p && !window.__nxIsRefreshSpamPost(p)) {
                            legacyPostsMap.set(d.id, p);
                        }
                    });
                    mergeAndPublishAllPosts();
                });
            },

            notifyAll: function() {
                this.rebuildAllUsersMasterList();
                this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });
            },

            getCurrentUser: function() {
                let raw = localStorage.getItem('nx_active_account');
                if (!raw) return null;
                try {
                    let acc = JSON.parse(raw);
                    if (!acc || !acc.username || !acc.name) return null;
                    let cloudMatch = this.cloudAccounts.find(u => u.username && u.username.toLowerCase() === acc.username.toLowerCase());
                    if (cloudMatch) {
                        let merged = Object.assign({}, acc, cloudMatch, {
                            dp: cloudMatch.dp || acc.dp || '',
                            isOnlineNow: true,
                            googleVerified: Boolean(acc.googleVerified || cloudMatch.googleVerified),
                            email: acc.email || cloudMatch.email || ''
                        });
                        merged.followersList = cleanUniqueList(cloudMatch.followersList);
                        merged.followingList = cleanUniqueList(cloudMatch.followingList);
                        return merged;
                    }
                    return acc;
                } catch(e) { return null; }
            },

            switchTab: function(tabId, btnEl) {
                if (tabId === 'tab-settings' && typeof window.__nxIsUserVerified === 'function' && !window.__nxIsUserVerified()) {
                    tabId = 'tab-profile';
                    btnEl = document.querySelector('.nx-nav-item[data-tab="tab-profile"]');
                    if (this.toast) this.toast('🔒 Settings Locked! Create or Verify Your Account First');
                }

                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';

                document.querySelectorAll('.nx-tab-screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(tabId);
                if (target) target.classList.add('active');

                document.querySelectorAll('.nx-nav-item').forEach(b => b.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
                else {
                    const navBtn = document.querySelector(`.nx-nav-item[data-tab="${tabId}"]`);
                    if (navBtn) navBtn.classList.add('active');
                }
                window.scrollTo(0, 0);
            },

            toast: function(msg) {
                const t = document.getElementById('nx-toast');
                if (!t) return;
                t.innerText = msg;
                t.style.display = 'block';

                if (file.type && file.type.startsWith('video/') && typeof window.__nxUploadVideoForPost === 'function') {
                    window.__nxUploadVideoForPost(file, callback);
                    return;

                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = Math.min(maxW || 760, 760);
                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL('image/webp', quality || 0.68);
                        if (!out || out.length < 50 || out.length > 140000) {
                            out = canvas.toDataURL('image/jpeg', 0.62);
                        }
                        callback(out);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        function attachSwipeToReplyOnBubble(wrapperEl, msgObj) {
            if (!wrapperEl || wrapperEl.dataset.swipeBound) return;
            wrapperEl.dataset.swipeBound = "1";

            let startX = 0;
            let startY = 0;
            let currentDX = 0;

            wrapperEl.addEventListener(
                "touchstart",
                (e) => {
                    if (!e.touches || e.touches.length !== 1) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    currentDX = 0;
                    wrapperEl.style.transition = "none";
                },
                { passive: true }
            );

            wrapperEl.addEventListener(
                "touchmove",
                (e) => {
                    if (!startX || !e.touches || e.touches.length !== 1) return;
                    const dx = e.touches[0].clientX - startX;
                    const dy = Math.abs(e.touches[0].clientY - startY);
                    if (dy > 35 && Math.abs(dx) < dy) return;

                    if (Math.abs(dx) > 12) {
                        currentDX = Math.max(-72, Math.min(72, dx));
                        wrapperEl.style.transform = `translateX(${currentDX}px)`;
                    }
                },
                { passive: true }
            );

            const finishSwipe = () => {
                wrapperEl.style.transition = "transform 0.18s ease-out";
                wrapperEl.style.transform = "translateX(0px)";
                if (Math.abs(currentDX) >= 44) {
                    triggerMediaReplyBanner(msgObj);
                }
                startX = 0;
                currentDX = 0;
            };

            wrapperEl.addEventListener("touchend", finishSwipe, { passive: true });
            wrapperEl.addEventListener("touchcancel", finishSwipe, { passive: true });
        }

                    y: Math.round((clientY - rect.top) * (canvas.height / rect.height))

                ctx.stroke();
                allStrokes.push({ x: p.x, y: p.y, color: currentColor, start: 0 });

                                ctx.stroke();
                            }
                        });
                    }
                });

        function getStrictOpenChatMessagesBox() {
            const msgInput =
                document.getElementById("nx-dm-input") ||
                document.getElementById("nx-chat-msg-in") ||
                document.querySelector('input[placeholder*="Message"], input[placeholder*="🔒"]');

            if (!isElementVisible(msgInput)) return null;

            const exactIds = ["nx-dm-messages", "nx-chat-messages", "chat-messages", "dm-messages"];
            for (const id of exactIds) {
                const el = document.getElementById(id);
                if (isElementVisible(el) && !el.innerText.includes("Chat →")) {
                    installZeroBlinkWhatsAppPatch(el);
                    return el;
                }
            }

            const inputRect = msgInput.getBoundingClientRect();
            let parent = msgInput.parentElement;
            while (parent && parent !== document.body) {
                const candidates = parent.querySelectorAll("div, section, main");
                for (let i = 0; i < candidates.length; i++) {
                    const child = candidates[i];
                    if (child.contains(msgInput)) continue;
                    if (!isElementVisible(child)) continue;
                    const st = window.getComputedStyle(child);
                    if (
                        (st.overflowY === "auto" || st.overflowY === "scroll") &&
                        child.clientHeight > 90 &&
                        !child.innerText.includes("Chat →")
                    ) {
                        const cRect = child.getBoundingClientRect();
                        if (cRect.bottom <= inputRect.top + 45) {
                            installZeroBlinkWhatsAppPatch(child);
                            return child;
                        }
                    }
                }
                parent = parent.parentElement;
            }
            return null;
        }

        function unicodeSafeSlug(str) {
            const s = String(str || "").trim().toLowerCase();
            const ascii = s.replace(/[^a-z0-9]/g, "");
            if (ascii.length >= 3) return ascii.slice(0, 16);
            let hash = 0;
            for (let i = 0; i < s.length; i++) {
                hash = (hash << 5) - hash + s.charCodeAt(i);
                hash |= 0;
            }
            return "u_" + Math.abs(hash).toString(36);
        }

        function getExactPartnerOrRoomTitle() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox) return "";

            const chatRoot = chatBox.parentElement || document.body;
            const boxRect = chatBox.getBoundingClientRect();

            const imgs = chatRoot.querySelectorAll("img");
            for (const img of imgs) {
                if (chatBox.contains(img)) continue;
                const r = img.getBoundingClientRect();
                if (r.bottom <= boxRect.top + 25 && r.width >= 24 && r.width <= 64) {
                    const src = img.getAttribute("src") || "";
                    if (src && src.length > 25 && window.Nexus && Array.isArray(Nexus.users)) {
                        const dpMatch = Nexus.users.find((u) => u && u.dp && u.dp.slice(0, 120) === src.slice(0, 120));
                        if (dpMatch && dpMatch.username) return dpMatch.username;
                    }
                }
            }

            const allEls = chatRoot.querySelectorAll("div, span, p, strong, b, h1, h2, h3, h4");
            for (const el of allEls) {
                if (chatBox.contains(el)) continue;
                const r = el.getBoundingClientRect();
                if (r.bottom <= boxRect.top + 25 && r.width > 30) {
                    const rawLines = (el.innerText || "")
                        .split("\n")
                        .map((l) => l.replace(/🔐\s*E2EE/g, "").replace(/🚫/g, "").trim())
                        .filter(
                            (l) =>
                                l.length > 1 &&
                                l !== "←" &&
                                l !== "⋮" &&
                                l !== "•••" &&
                                !l.includes("Online Now") &&
                                !l.includes("Last seen") &&
                                !l.includes("Offline") &&
                                !l.includes("Live Room") &&
                                !l.includes("Nexus") &&
                                !l.includes("Chat →")
                        );
                    if (rawLines.length > 0 && rawLines[0].length < 48) {
                        return rawLines[0];
                    }
                }
            }

            return window.currentChatUser || window.currentRoomId || "saved_messages";
        }

        function getPartnerIdentityTokens() {
            const title = getExactPartnerOrRoomTitle() || "saved_messages";
            const myUname = getMyUsername() || "guest";
            const lower = title.toLowerCase().trim();

            if (lower.includes("saved messages") || lower === "saved_messages") {
                return { roomKey: "dm_saved_" + myUname, partnerUname: myUname, partnerAlpha: "saved" };
            }

            if (
                lower.includes("student chat") ||
                lower.includes("live room") ||
                lower.includes("group") ||
                lower.includes("club") ||
                lower.includes("arena") ||
                lower.includes("lounge") ||
                lower.includes("doubt")
            ) {
                const gSlug = "grp_" + unicodeSafeSlug(lower);
                return { roomKey: gSlug, partnerUname: gSlug, partnerAlpha: gSlug };
            }

            const cleanLookup = lower.replace(/^@/, "").replace(/\.+$/, "").trim();
            const alphaLookup = cleanLookup.replace(/[^a-z0-9]/g, "");
            let partnerUname = "";
            let partnerAlpha = alphaLookup.slice(0, 8) || unicodeSafeSlug(cleanLookup);

            if (window.Nexus && Array.isArray(Nexus.users)) {
                const matched = Nexus.users.find((u) => {
                    if (!u) return false;
                    const uName = (u.username || "").toLowerCase().trim();
                    const dName = (u.name || "").toLowerCase().trim();
                    const uAlpha = uName.replace(/[^a-z0-9]/g, "");
                    const dAlpha = dName.replace(/[^a-z0-9]/g, "");
                    return (
                        uName === cleanLookup ||
                        dName === cleanLookup ||
                        (alphaLookup.length >= 3 &&
                            (uAlpha.startsWith(alphaLookup) ||
                                alphaLookup.startsWith(uAlpha) ||
                                dAlpha.startsWith(alphaLookup) ||
                                alphaLookup.startsWith(dAlpha)))
                    );
                });
                if (matched && matched.username) {
                    partnerUname = matched.username.toLowerCase().trim();
                    const mAlpha = ((matched.name || "") + matched.username).toLowerCase().replace(/[^a-z0-9]/g, "");
                    if (mAlpha.length >= 3) partnerAlpha = mAlpha.slice(0, 8);
                }
            }

            if (!partnerUname) partnerUname = partnerAlpha;
            return {
                roomKey: "dm_v6_" + [myUname, partnerUname].sort().join("__"),
                partnerUname: partnerUname,
                partnerAlpha: partnerAlpha
            };
        }

        function getSharedRoomKey() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox) return null;
            return getPartnerIdentityTokens().roomKey;
        }

        function doesMediaDocBelongToCurrentOpenChat(docData) {
            if (!docData) return false;
            const tokens = getPartnerIdentityTokens();
            if (docData.roomKey === tokens.roomKey) return true;

            const myUname = getMyUsername();
            const myAlpha = myUname.replace(/[^a-z0-9]/g, "").slice(0, 6);
            const docRk = String(docData.roomKey || "").toLowerCase();
            const docSender = String(docData.sender || "").toLowerCase();
            const docTarget = String(docData.targetPartner || "").toLowerCase();

            if (!myUname || tokens.partnerAlpha === "saved" || tokens.roomKey.startsWith("grp_")) return false;

            const iAmInvolved =
                docSender === myUname ||
                docTarget === myUname ||
                (myAlpha.length >= 3 && docRk.includes(myAlpha));

            const partnerIsInvolved =
                docSender === tokens.partnerUname ||
                docTarget === tokens.partnerUname ||
                (tokens.partnerAlpha.length >= 3 &&
                    (docRk.includes(tokens.partnerAlpha.slice(0, 6)) ||
                        docSender.includes(tokens.partnerAlpha.slice(0, 6)) ||
                        docTarget.includes(tokens.partnerAlpha.slice(0, 6))));

            return Boolean(iAmInvolved && partnerIsInvolved);
        }

        function getMediaMinuteScore(mb) {
            const d = new Date(Number(mb.dataset.msgTs || Date.now()));
            return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 100;
        }

        function sortChatMessagesChronologically(chatBox, currentRoomKey) {
            if (!chatBox) return;

            chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                if (b.dataset.roomKey && currentRoomKey && b.dataset.roomKey !== currentRoomKey) {
                    b.remove();
                }
            });

            const nativeKids = Array.from(chatBox.children).filter(
                (el) => !el.classList.contains("nx-ig-media-bubble")
            );

            let todayStartIndex = 0;
            let prevMins = -1;
            nativeKids.forEach((kid, idx) => {
                const rawTxt = (kid.innerText || "").trim();
                if (rawTxt === "Today" || rawTxt === "TODAY") {
                    todayStartIndex = idx + 1;
                    prevMins = -1;
                    return;
                }
                const matches = rawTxt.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g);
                if (matches && matches.length > 0) {
                    const parts = matches[matches.length - 1].split(":");
                    const mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                    if (prevMins !== -1 && mins < prevMins - 240) {
                        todayStartIndex = idx;
                    }
                    prevMins = mins;
                }
            });

            let runningMinuteScore = 0;
            const nativeScoreMap = new Map();
            nativeKids.forEach((kid, idx) => {
                if (idx < todayStartIndex) {
                    nativeScoreMap.set(kid, -10000 + idx);
                    return;
                }
                const txt = kid.innerText || "";
                const matches = txt.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g);
                if (matches && matches.length > 0) {
                    const parts = matches[matches.length - 1].split(":");
                    runningMinuteScore = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + (idx % 50) / 1000;
                }
                nativeScoreMap.set(kid, runningMinuteScore);
            });

            const mediaBubbles = Array.from(chatBox.querySelectorAll(".nx-ig-media-bubble"));
            mediaBubbles.sort((a, b) => Number(a.dataset.msgTs || 0) - Number(b.dataset.msgTs || 0));

            mediaBubbles.forEach((mb) => {
                if (mb.dataset.nativeAnchorCount) {
                    const anchorIdx = parseInt(mb.dataset.nativeAnchorCount, 10);
                    if (!isNaN(anchorIdx)) {
                        if (anchorIdx < nativeKids.length) {
                            chatBox.insertBefore(mb, nativeKids[anchorIdx]);
                        } else {
                            chatBox.appendChild(mb);
                        }
                        return;
                    }
                }

                const mTs = Number(mb.dataset.msgTs || Date.now());
                const isFromToday = new Date(mTs).toDateString() === new Date().toDateString();

                if (!isFromToday) {
                    if (todayStartIndex > 0 && nativeKids[todayStartIndex - 1]) {
                        chatBox.insertBefore(mb, nativeKids[todayStartIndex - 1]);
                    } else {
                        chatBox.appendChild(mb);
                    }
                    return;
                }

                const mScore = getMediaMinuteScore(mb);
                let placed = false;

                for (let i = todayStartIndex; i < nativeKids.length; i++) {
                    const nKid = nativeKids[i];
                    const nScore = nativeScoreMap.get(nKid) || 0;
                    if (nScore > mScore + 0.9) {
                        chatBox.insertBefore(mb, nKid);
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    chatBox.appendChild(mb);
                }
            });
        }

        function installZeroBlinkWhatsAppPatch(chatBox) {
            if (!chatBox || chatBox.__nxV29ZeroBlink) return;
            chatBox.__nxV29ZeroBlink = true;

            const nativeDesc = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
            if (!nativeDesc || !nativeDesc.set) return;

            Object.defineProperty(chatBox, "innerHTML", {
                configurable: true,
                get: function () {
                    return nativeDesc.get.call(this);
                },
                set: function (newHtml) {
                    const rk = getSharedRoomKey() || this.dataset.nxRoom || "default";
                    const prevRk = this.dataset.nxRoom || "";

                    if (!newHtml || !newHtml.trim() || (prevRk && prevRk !== rk)) {
                        this.dataset.nxRoom = rk;
                        nativeDesc.set.call(this, newHtml);
                        const combined = getCombinedRoomMedia(rk);
                        combined.forEach((m) => renderChatMediaBubble(m, m.localUrl));
                        sortChatMessagesChronologically(this, rk);
                        this.scrollTop = this.scrollHeight;
                        return;
                    }

                    this.dataset.nxRoom = rk;
                    const temp = document.createElement("div");
                    nativeDesc.set.call(temp, newHtml);

                    const incNodes = Array.from(temp.children);
                    const curNodes = Array.from(this.children).filter(
                        (el) => !el.classList.contains("nx-ig-media-bubble")
                    );

                    const nearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 180;

                    incNodes.forEach((inc, i) => {
                        const cur = curNodes[i];
                        if (!cur) {
                            this.appendChild(inc);
                        } else if (cur.innerHTML !== inc.innerHTML) {
                            nativeDesc.set.call(cur, inc.innerHTML);
                            cur.className = inc.className;
                        }
                    });

                    if (curNodes.length > incNodes.length) {
                        for (let j = incNodes.length; j < curNodes.length; j++) {
                            curNodes[j].remove();
                        }
                    }

                    const combined = getCombinedRoomMedia(rk);
                    combined.forEach((m) => renderChatMediaBubble(m, m.localUrl));
                    sortChatMessagesChronologically(this, rk);
                    if (nearBottom) {
                        this.scrollTop = this.scrollHeight;
                    }
                }
            });
        }

        function getCombinedRoomMedia(rk) {
            if (!rk) return [];
            const matchedCloud = allCloudMediaList.filter((m) => doesMediaDocBelongToCurrentOpenChat(m));
            const pendingList = pendingUploadsMap[rk] || [];
            const map = new Map();
            matchedCloud.forEach((item) => map.set(item.id, Object.assign({}, item, { roomKey: rk })));
            pendingList.forEach((item) => {
                if (!map.has(item.id)) map.set(item.id, item);
                else {
                    const merged = Object.assign({}, map.get(item.id), {
                        roomKey: rk,
                        localUrl: item.localUrl || map.get(item.id).localUrl,
                        nativeAnchorCount: item.nativeAnchorCount
                    });
                    map.set(item.id, merged);
                }
            });
            return Array.from(map.values()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }

        // =========================================================================
        // 8. ULTRA-FAST UPLOAD ENGINE
        // =========================================================================
        function compressImageToFastWebP(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX = 680;
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > MAX) {
                            h = Math.round((h * MAX) / w);
                            w = MAX;
                        } else if (h > MAX) {
                            w = Math.round((w * MAX) / h);
                            h = MAX;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL("image/webp", 0.62);
                        if (!out || out.length < 50 || out.length > 95000) {
                            out = canvas.toDataURL("image/jpeg", 0.56);
                        }
                        resolve(out);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function uploadUpTo50MB(file, onProgress) {
            return new Promise((resolve, reject) => {
                if (file.size <= 12 * 1024 * 1024 && window.Nexus && Nexus.db) {
                    chunkFallback(file, onProgress).then(resolve).catch(reject);
                    return;
                }
                const xhr = new XMLHttpRequest();
                const fd = new FormData();
                fd.append("reqtype", "fileupload");
                fd.append("time", "72h");
                fd.append("fileToUpload", file, file.name || "media.mp4");

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText && xhr.responseText.startsWith("http")) {
                        onProgress && onProgress(100);
                        resolve({ mode: "url", url: xhr.responseText.trim() });
                    } else {
                        chunkFallback(file, onProgress).then(resolve).catch(reject);
                    }
                };
                xhr.onerror = () => chunkFallback(file, onProgress).then(resolve).catch(reject);
                xhr.open("POST", "https://litterbox.catbox.moe/resources/internals/api.php", true);
                xhr.send(fd);
            });
        }

        function chunkFallback(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const b64 = e.target.result;
                        const total = Math.ceil(b64.length / CHUNK_CHAR_SIZE);
                        const sid = "str_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
                        if (total === 1) {
                            onProgress && onProgress(100);
                            resolve({ mode: "inline", url: b64 });
                            return;
                        }
                        for (let i = 0; i < total; i++) {
                            await Nexus.db
                                .collection("nexus_media_chunks")
                                .doc(`${sid}_${i}`)
                                .set({ streamId: sid, index: i, data: b64.slice(i * CHUNK_CHAR_SIZE, (i + 1) * CHUNK_CHAR_SIZE) });
                            onProgress && onProgress(Math.round(((i + 1) / total) * 100));
                        }
                        resolve({ mode: "chunked", streamId: sid, totalChunks: total });
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function loadChunkedMedia(msg) {
            if (msg.mediaUrl) return msg.mediaUrl;
            if (msg.mode !== "chunked" || !msg.streamId || !window.Nexus || !Nexus.db) return "";
            const parts = [];
            for (let i = 0; i < msg.totalChunks; i++) {
                const d = await Nexus.db.collection("nexus_media_chunks").doc(`${msg.streamId}_${i}`).get();
                if (d.exists) parts.push(d.data().data);
            }
            return parts.join("");
        }

        async function sendSingleOrMultipleFiles(fileList, forcedType, isViewOnce) {
            if (!fileList || !fileList.length) return;
            const files = Array.from(fileList);
            const chatBox = getStrictOpenChatMessagesBox();
            const currentNativeCount = chatBox
                ? Array.from(chatBox.children).filter((el) => !el.classList.contains("nx-ig-media-bubble")).length
                : 9999;

            const tokens = getPartnerIdentityTokens();
            const rk = tokens.roomKey || "dm_saved_" + (getMyUsername() || "user");
            const sender = getMyUsername() || "user";

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.size > MAX_VIDEO_BYTES) {
                    alert(`⚠️ ${file.name} 50MB se badi hai!`);
                    continue;
                }

                const msgId = "nxm_" + Date.now() + "_" + i + "_" + Math.random().toString(36).slice(2, 5);
                const mime = (file.type || "").toLowerCase();
                const mediaType =
                    forcedType ||
                    (mime.startsWith("video")
                        ? "video"
                        : mime.startsWith("audio")
                        ? "audio"
                        : mime.includes("pdf")
                        ? "pdf"
                        : "image");

                const nowTs = Date.now() + i;
                const localUrl = URL.createObjectURL(file);

                const tempDoc = {
                    id: msgId,
                    roomKey: rk,
                    sender: sender,
                    targetPartner: tokens.partnerUname,
                    partnerAlpha: tokens.partnerAlpha,
                    mediaType: mediaType,
                    viewOnce: Boolean(isViewOnce),
                    opened: false,
                    fileName: file.name || "file",
                    statusText: "📤 1%",
                    localUrl: localUrl,
                    nativeAnchorCount: currentNativeCount,
                    createdAt: nowTs
                };

                if (!pendingUploadsMap[rk]) pendingUploadsMap[rk] = [];
                pendingUploadsMap[rk].push(tempDoc);

                renderChatMediaBubble(tempDoc, localUrl);

                try {
                    const finalDoc = {
                        id: msgId,
                        roomKey: rk,
                        sender: sender,
                        targetPartner: tokens.partnerUname,
                        partnerAlpha: tokens.partnerAlpha,
                        mediaType: mediaType,
                        viewOnce: Boolean(isViewOnce),
                        opened: false,
                        fileName: file.name || "file",
                        createdAt: nowTs,
                        statusText: "✓✓"
                    };

                    if (mediaType === "image") {
                        finalDoc.mode = "inline";
                        finalDoc.mediaUrl = await compressImageToFastWebP(file);
                    } else {
                        const res = await uploadUpTo50MB(file, (pct) => {
                            const el = document.getElementById(msgId);
                            const st = el && el.querySelector(".nx-media-status");
                            if (st) st.textContent = `📤 ${pct}%`;
                        });
                        if (res.mode === "chunked") {
                            finalDoc.mode = "chunked";
                            finalDoc.streamId = res.streamId;
                            finalDoc.totalChunks = res.totalChunks;
                        } else {
                            finalDoc.mode = res.mode;
                            finalDoc.mediaUrl = res.url;
                        }
                    }

                    const withLocal = Object.assign({}, finalDoc, {
                        localUrl,
                        nativeAnchorCount: currentNativeCount
                    });
                    allCloudMediaList.push(withLocal);
                    pendingUploadsMap[rk] = (pendingUploadsMap[rk] || []).map((p) => (p.id === msgId ? withLocal : p));

                    if (window.Nexus && Nexus.db) {
                        await Nexus.db.collection(MEDIA_COLLECTION).doc(msgId).set(finalDoc);
                    }

                    const el = document.getElementById(msgId);
                    if (el) {
                        if (!isViewOnce) el.dataset.rawUrl = finalDoc.mediaUrl || localUrl;
                        const vo = el.querySelector(".nx-open-viewonce");
                        if (vo) vo.dataset.url = finalDoc.mediaUrl || localUrl;
                        const st = el.querySelector(".nx-media-status");
                        if (st) st.textContent = "✓✓";
                    }
                } catch (err) {
                    const el = document.getElementById(msgId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "✓";
                }
            }
            if (window.Nexus && Nexus.toast) {
                Nexus.toast(isViewOnce ? "1️⃣ Protected View-Once Sent!" : files.length > 1 ? `✅ ${files.length} Photos Sent!` : "✅ Photo/Media Sent!");
            }
        }

        async function toggleVoiceNote() {
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) voiceChunks.push(e.data);
                    };
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: "audio/webm" });
                        const file = new File([blob], "voicenote.webm", { type: "audio/webm" });
                        sendSingleOrMultipleFiles([file], "audio", false);
                        stream.getTracks().forEach((t) => t.stop());
                    };
                    voiceRecorder.start();
                    isRecordingVoice = true;
                    if (window.Nexus && Nexus.toast) Nexus.toast("🎤 Recording HD Voice... Tap '+' Again to Send!");
                } catch (e) {
                    alert("Microphone permission Allow kijiye!");
                }
            } else {
                voiceRecorder.stop();
                isRecordingVoice = false;
            }
        }

                menu.innerHTML = `

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px;">

                            <span>🖼️</span> <span>Photos (Multi)</span>
                        </label>
                        <label for="nx-inp-viewonce" style="padding:10px; border-radius:12px; background:linear-gradient(135deg,#0c4a6e,#1e3a8a); border:1px solid #38bdf8; color:#e0f2fe; font-weight:800; display:flex; align-items:center; gap:7px; cursor:pointer; margin:0;">
                            <span style="width:16px; height:16px; border-radius:50%; background:#38bdf8; color:#020617; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:900;">1</span>
                            <span>View Once</span>
                        </label>
                        <label for="nx-inp-bypass" style="grid-column:span 2; padding:10px; border-radius:12px; background:rgba(16,185,129,0.14); border:1px dashed #10b981; color:#34d399; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; margin:0;">

        // =========================================================================
        // 9. GLOBAL CLOUD MEDIA STREAM

        function startGlobalMediaListener() {
            if (unsubMedia || !window.Nexus || !Nexus.db) return;
            unsubMedia = Nexus.db
                .collection(MEDIA_COLLECTION)
                .orderBy("createdAt", "desc")
                .limit(60)
                .onSnapshot((snap) => {
                    const list = [];
                    snap.forEach((d) => {
                        const obj = d.data();
                        obj.id = d.id;
                        list.push(obj);
                    });
                    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    allCloudMediaList = list;
                });
        }

        function syncActiveRoomStreams() {
            startGlobalMediaListener();

            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox || !window.Nexus || !Nexus.db) return;

            const rk = getSharedRoomKey();
            if (!rk) return;

            if (rk !== activeRoomKey) {
                activeRoomKey = rk;
                activeMediaReplyContext = null;
                document.getElementById("nx-media-reply-preview-bar")?.remove();

                chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                    if (b.dataset.roomKey && b.dataset.roomKey !== rk) b.remove();
                });

                if (unsubSync) unsubSync();
                unsubSync = Nexus.db
                    .collection("nexus_watch_sync")
                    .doc(rk)
                    .onSnapshot((doc) => {
                        if (!doc.exists) return;
                        const data = doc.data();
                        if (!data || !data.updatedAt || Date.now() - data.updatedAt > 10000) return;
                        if ((data.sender || "").toLowerCase() === getMyUsername() && Date.now() - lastBroadcastTime < 1200) {
                            return;
                        }
                        isPartnerSyncing = true;
                        const target = Number(data.currentTime) || 0;
                        currentMovieTime = target;
                        sendYtCmd("seekTo", [target, true]);
                        sendYtCmd(data.action === "pause" ? "pauseVideo" : "playVideo", []);
                        setTimeout(() => {
                            isPartnerSyncing = false;
                        }, 900);
                    });
            }

            const combined = getCombinedRoomMedia(rk);
            const validIds = new Set(combined.map((m) => m.id));
            chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                if (!validIds.has(b.id)) b.remove();
            });

            combined.forEach((m) => renderChatMediaBubble(m, m.localUrl));
            sortChatMessagesChronologically(chatBox, rk);
        }
        setInterval(syncActiveRoomStreams, 450);

        function sendYtCmd(func, args = []) {
            document.querySelectorAll('iframe[src*="youtube"]').forEach((f) => {
                const src = f.getAttribute("src") || "";
                if (!src.includes("enablejsapi=1")) {
                    f.setAttribute("src", src + (src.includes("?") ? "&" : "?") + "enablejsapi=1&playsinline=1");
                }
                try {
                    f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args }), "*");
                } catch (e) {}
            });
        }
