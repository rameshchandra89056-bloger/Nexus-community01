      <!-- 5. 100% SUPABASE-POWERED NEXUS CORE ENGINE (ZERO FIREBASE QUOTA LIMITS!) -->
    <script>
        (function () {
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" })
                        .then((reg) => reg.update())
                        .catch(() => {});
                });
            }

            function safeSetLocalCache(key, dataObj) {
                try {
                    localStorage.setItem(key, JSON.stringify(dataObj));
                } catch (e) {
                    const me = localStorage.getItem("nx_active_account");
                    const sv = localStorage.getItem("nx_saved_posts");
                    const del = localStorage.getItem("nx_deleted_post_ids_v1");
                    localStorage.clear();
                    if (me) localStorage.setItem("nx_active_account", me);
                    if (sv) localStorage.setItem("nx_saved_posts", sv);
                    if (del) localStorage.setItem("nx_deleted_post_ids_v1", del);
                }
            }

            function cleanUniqueList(arr) {
                if (!Array.isArray(arr)) return [];
                const seen = new Set();
                const out = [];
                arr.forEach((item) => {
                    const s = String(item || "").trim().toLowerCase();
                    if (s && s !== "member" && !seen.has(s)) {
                        seen.add(s);
                        out.push(s);
                    }
                });
                return out;
            }

            function getDeletedIdsSet() {
                try {
                    return new Set(JSON.parse(localStorage.getItem("nx_deleted_post_ids_v1") || "[]"));
                } catch (e) {
                    return new Set();
                }
            }

            window.__nxValidateAndCleanRealPost = function (p) {
                if (!p || typeof p !== "object") return null;
                const uname = String(p.username || "").toLowerCase().replace(/^@/, "").trim();
                if (!uname || uname === "member") return null;
                return p;
            };

            window.__nxIsRefreshSpamPost = function (postObj) {
                if (!postObj) return true;
                const deletedSet = getDeletedIdsSet();
                if (postObj.id && deletedSet.has(String(postObj.id))) return true;
                return false;
            };

            window.__nxMarkPostDeletedLocally = function (postId) {
                if (!postId) return;
                try {
                    const set = getDeletedIdsSet();
                    set.add(String(postId));
                    localStorage.setItem("nx_deleted_post_ids_v1", JSON.stringify(Array.from(set).slice(-250)));
                } catch (e) {}
                if (window.Nexus && Array.isArray(Nexus.posts)) {
                    Nexus.posts = Nexus.posts.filter((p) => p && p.id !== postId);
                    Nexus.notifyAll();
                }
            };

            function mapProfileRow(r) {
                const lastMs = r.last_online ? new Date(r.last_online).getTime() : 0;
                return {
                    id: r.id,
                    uid: r.id,
                    firebase_uid: r.firebase_uid || r.username,
                    username: r.username,
                    name: r.display_name || r.username,
                    dp: r.avatar_url || "",
                    bio: r.bio || "",
                    moodNote: r.mood_note || "",
                    profileSong: r.profile_song || null,
                    website: r.website || "",
                    verified: Boolean(r.is_verified),
                    googleVerified: true,
                    role: r.role || "user",
                    e2ee_public_key: r.e2ee_public_key || null,
                    followersList: cleanUniqueList(r.followers_list),
                    followingList: cleanUniqueList(r.following_list),
                    lastOnline: lastMs,
                    lastSeenAt: lastMs,
                    isOnlineNow: lastMs > 0 && (Date.now() - lastMs) < 120000
                };
            }

            function mapPostRow(r, profileById) {
                const prof = profileById[r.author_id] || {};
                const createdMs = r.created_at ? new Date(r.created_at).getTime() : Date.now();
                const mUrl = r.media_url || "";
                const mType = r.media_type || (mUrl ? "image" : "text");
                const likedBy = cleanUniqueList(r.liked_by);
                const viewedBy = cleanUniqueList(r.viewed_by);
                const comments = Array.isArray(r.comments) ? r.comments : [];

                return {
                    id: r.id,
                    author_id: r.author_id,
                    username: prof.username || "nexus_member",
                    author: prof.name || prof.username || "Member",
                    dp: prof.dp || "",
                    bio: prof.bio || "",
                    verified: Boolean(prof.verified),
                    content: r.caption || "",
                    text: r.caption || "",
                    image: mUrl,
                    videoUrl: mType === "video" ? mUrl : "",
                    mediaType: mType,
                    likes: Math.max(Number(r.likes_count || 0), likedBy.length),
                    likedBy: likedBy,
                    viewedBy: viewedBy,
                    views: Math.max(viewedBy.length, Number(r.likes_count || 0), 1),
                    comments: comments,
                    poll: r.poll || null,
                    cardTheme: r.card_theme || "default",
                    pinned: Boolean(r.is_pinned),
                    createdAt: createdMs
                };
            }

            function loadCachedArr(key) {
                try {
                    const parsed = JSON.parse(localStorage.getItem(key) || "[]");
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            }

            window.Nexus = {
                db: null,
                sb: null,
                initialized: false,
                cloudReady: false,
                cloudAccounts: loadCachedArr("nx_master_users_v2"),
                users: loadCachedArr("nx_master_users_v2"),
                posts: loadCachedArr("nx_light_posts_v2"),
                rooms: {},
                pdfs: [],
                listeners: { onUsers: [], onPosts: [], onRooms: [] },

                init: function () {
                    if (this.initialized) return;
                    this.initialized = true;
                    const boot = () => this.connectSupabase();
                    if (window.NexusSecurity) boot();
                    else window.addEventListener("nexus-security-ready", boot, { once: true });
                    this.notifyAll();
                },

                connectSupabase: async function () {
                    const sec = window.NexusSecurity;
                    if (!sec || !sec.sb) return;
                    this.sb = sec.sb;

                    try {
                        await sec.syncCurrentUserProfile();
                    } catch (e) {}

                    sec.sb.auth.onAuthStateChange(async (event, session) => {
                        if (event === "SIGNED_IN" && session) {
                            await sec.syncCurrentUserProfile();
                            await this.refreshCloudData();
                            document.getElementById("nx-sb-auth-modal")?.remove();
                            document.getElementById("nx-google-auth-hub")?.remove();
                            if (window.renderMyInstagramProfileTab) window.renderMyInstagramProfileTab();
                        } else if (event === "SIGNED_OUT") {
                            localStorage.removeItem("nx_active_account");
                            this.notifyAll();
                        }
                    });

                    await this.refreshCloudData();
                    this.cloudReady = true;

                    sec.sb
                        .channel("nx_core_realtime")
                        .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, () => {
                            this.refreshCloudData();
                        })
                        .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => {
                            this.refreshCloudData();
                        })
                        .subscribe();

                    setInterval(async () => {
                        const me = this.getCurrentUser();
                        if (me && me.id) {
                            await sec.verifyCurrentSessionNotRevoked(me.id);
                            sec.sb
                                .from("profiles")
                                .update({ last_online: new Date().toISOString() })
                                .eq("id", me.id)
                                .then(() => {});
                        }
                    }, 45000);
                },

                refreshCloudData: async function () {
                    if (!this.sb) return;
                    try {
                        const [profRes, postRes] = await Promise.all([
                            this.sb.from("profiles").select("*").limit(300),
                            this.sb.from("posts").select("*").order("created_at", { ascending: false }).limit(120)
                        ]);

                        const profById = {};
                        if (Array.isArray(profRes.data)) {
                            const mappedUsers = profRes.data.map(mapProfileRow);
                            mappedUsers.forEach((u) => { profById[u.id] = u; });
                            this.cloudAccounts = mappedUsers;
                            this.users = mappedUsers;
                            safeSetLocalCache("nx_master_users_v2", mappedUsers.slice(0, 150));
                        }

                        if (Array.isArray(postRes.data)) {
                            const deletedSet = getDeletedIdsSet();
                            const mappedPosts = postRes.data
                                .map((r) => mapPostRow(r, profById))
                                .filter((p) => p && !deletedSet.has(String(p.id)));
                            this.posts = mappedPosts;
                            window.__NX_INSTANT_POSTS__ = mappedPosts;
                            safeSetLocalCache("nx_light_posts_v2", mappedPosts.slice(0, 25));
                        }

                        this.notifyAll();
                    } catch (err) {
                        console.warn("Supabase refresh note:", err);
                    }
                },

                rebuildAllUsersMasterList: function () {
                    const me = this.getCurrentUser();
                    const myKey = me && me.username ? me.username.toLowerCase() : "";
                    this.users.sort((a, b) => {
                        const aU = (a.username || "").toLowerCase();
                        const bU = (b.username || "").toLowerCase();
                        if (aU === myKey) return -1;
                        if (bU === myKey) return 1;
                        if (a.isOnlineNow && !b.isOnlineNow) return -1;
                        if (!a.isOnlineNow && b.isOnlineNow) return 1;
                        return Number(b.lastOnline || 0) - Number(a.lastOnline || 0);
                    });
                },

                notifyAll: function () {
                    this.rebuildAllUsersMasterList();
                    this.listeners.onUsers.forEach((fn) => { try { fn(this.users); } catch (e) {} });
                    this.listeners.onPosts.forEach((fn) => { try { fn(this.posts); } catch (e) {} });
                },

                getCurrentUser: function () {
                    try {
                        const raw = localStorage.getItem("nx_active_account");
                        if (!raw) return null;
                        const acc = JSON.parse(raw);
                        if (!acc || !acc.username || !acc.id) return null;
                        const liveMatch = (this.cloudAccounts || []).find((u) => u.id === acc.id);
                        return liveMatch ? Object.assign({}, acc, liveMatch, { isOnlineNow: true }) : acc;
                    } catch (e) {
                        return null;
                    }
                },

                switchTab: function (tabId, btnEl) {
                    if (tabId === "tab-settings" && !this.getCurrentUser()) {
                        tabId = "tab-profile";
                        btnEl = document.querySelector('.nx-nav-item[data-tab="tab-profile"]');
                        this.toast("🔒 Pehle Login ya Account Create karein!");
                    }
                    document.documentElement.style.overflow = "";
                    document.body.style.overflow = "";

                    document.querySelectorAll(".nx-tab-screen").forEach((s) => s.classList.remove("active"));
                    const target = document.getElementById(tabId);
                    if (target) target.classList.add("active");

                    document.querySelectorAll(".nx-nav-item").forEach((b) => b.classList.remove("active"));
                    if (btnEl) btnEl.classList.add("active");
                    else {
                        const navBtn = document.querySelector(`.nx-nav-item[data-tab="${tabId}"]`);
                        if (navBtn) navBtn.classList.add("active");
                    }

                    if (tabId === "tab-profile") {
                        this.notifyAll();
                        if (typeof window.__nxForceRenderProfileTab === "function") {
                            window.__nxForceRenderProfileTab();
                        }
                    }
                    window.scrollTo(0, 0);
                },

                openPostModal: function () {
                    if (!this.getCurrentUser()) {
                        this.toast("🔒 Post karne ke liye pehle Login karein!");
                        if (window.openNexusSupabaseAuthModal) window.openNexusSupabaseAuthModal("signin");
                        return;
                    }
                    if (typeof window.openOfficialNexusCreatorStudio === "function") {
                        window.openOfficialNexusCreatorStudio();
                    }
                },

                openNotifications: function () {
                    if (window.openNexusRealNotificationsModal) window.openNexusRealNotificationsModal();
                },

                openSearch: function () {
                    if (window.openNexusRealSearchModal) window.openNexusRealSearchModal();
                },

                toast: function (msg) {
                    const t = document.getElementById("nx-toast");
                    if (!t) return;
                    t.innerText = msg;
                    t.style.display = "block";
                    clearTimeout(t.__tm);
                    t.__tm = setTimeout(() => { t.style.display = "none"; }, 2500);
                },

                compressImage: function (file, maxW, quality, callback) {
                    if (!file) return;
                    if (file.type && file.type.startsWith("video/") && typeof window.__nxUploadVideoForPost === "function") {
                        window.__nxUploadVideoForPost(file, callback);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement("canvas");
                            let w = img.width, h = img.height;
                            const maxDim = Math.min(maxW || 820, 820);
                            if (w > h && w > maxDim) {
                                h = Math.round((h * maxDim) / w);
                                w = maxDim;
                            } else if (h > maxDim) {
                                w = Math.round((w * maxDim) / h);
                                h = maxDim;
                            }
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                            let out = canvas.toDataURL("image/webp", quality || 0.72);
                            if (!out || out.length < 50) out = canvas.toDataURL("image/jpeg", 0.68);
                            callback(out);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Track & Release Chrome Mic/Camera Streams on Call End
            window.__NX_ALL_HARDWARE_STREAMS__ = [];
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !navigator.mediaDevices.__nxHooked) {
                navigator.mediaDevices.__nxHooked = true;
                const origGum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
                navigator.mediaDevices.getUserMedia = async function (c) {
                    const s = await origGum(c);
                    window.__NX_ALL_HARDWARE_STREAMS__.push(s);
                    return s;
                };
            }
            window.forceReleaseAllMicAndCamera = function () {
                (window.__NX_ALL_HARDWARE_STREAMS__ || []).forEach((s) => {
                    if (s && s.getTracks) s.getTracks().forEach((t) => { try { t.enabled = false; t.stop(); } catch (e) {} });
                });
                window.__NX_ALL_HARDWARE_STREAMS__ = [];
            };

            Nexus.init();
        })();
    </script>

    <script>
    (function () {

        const NEXUS_OFFICIAL_LOGO_SVG =

        let deferredPwaPrompt = null;
        let wbChannel = null;

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPwaPrompt = e;
        });

        function getMe() {
            return window.Nexus && Nexus.getCurrentUser ? Nexus.getCurrentUser() : null;
        }

        function getMyUname() {
            const me = getMe();
            return me && me.username ? me.username.toLowerCase().trim() : "";
        }

        window.__nxIsUserVerified = function () {
            return Boolean(getMe());
        };

        // ==================== A. MASTER SUPABASE AUTH MODAL ====================
        window.openNexusSupabaseAuthModal = function (initialMode) {
            document.getElementById("nx-sb-auth-modal")?.remove();
            document.getElementById("nx-instant-auth-modal")?.remove();
            let mode = initialMode === "signup" ? "signup" : "signin";
            const isLocal = ["localhost", "127.0.0.1", ""].includes(window.location.hostname);

            const modal = document.createElement("div");
            modal.id = "nx-sb-auth-modal";
            modal.style.cssText =
                "position:fixed; inset:0; background:rgba(2,6,23,0.92); z-index:295000; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(6px);";

            const renderUI = () => {
                const isSignup = mode === "signup";
                modal.innerHTML = `
                    <div style="background:linear-gradient(155deg,#0f172a,#090d16); border:1.5px solid #10b981; border-radius:22px; width:100%; max-width:390px; padding:20px 18px; color:#fff; box-shadow:0 22px 55px rgba(0,0,0,0.95);">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <h3 style="font-size:17px; font-weight:900; color:#34d399;">
                                ${isSignup ? "✨ Create Nexus v2 Account" : "🔐 Login to Nexus v2"}
                            </h3>
                            <button type="button" id="nx-sb-x" style="width:30px; height:30px; border-radius:50%; background:#1e293b; border:none; color:#cbd5e1; font-weight:900; cursor:pointer;">✕</button>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#050811; padding:4px; border-radius:12px; margin-bottom:14px;">
                            <button type="button" id="nx-sb-tab-in" style="padding:9px; border-radius:9px; border:none; background:${!isSignup ? "#10b981" : "transparent"}; color:${!isSignup ? "#020617" : "#94a3b8"}; font-weight:900; font-size:12.5px; cursor:pointer;">Login</button>
                            <button type="button" id="nx-sb-tab-up" style="padding:9px; border-radius:9px; border:none; background:${isSignup ? "#10b981" : "transparent"}; color:${isSignup ? "#020617" : "#94a3b8"}; font-weight:900; font-size:12.5px; cursor:pointer;">New Account</button>
                        </div>

                        <div id="nx-sb-err" style="display:none; background:rgba(244,63,94,0.16); border:1px solid #f43f5e; color:#fda4af; padding:8px 10px; border-radius:10px; font-size:12px; font-weight:700; margin-bottom:10px;"></div>

                        <button type="button" id="nx-sb-google" style="width:100%; padding:12px; border-radius:12px; background:#ffffff; color:#0f172a; font-weight:900; font-size:13px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:10px;">
                            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            <span>Continue with Google (1-Click)</span>
                        </button>

                        <div style="text-align:center; font-size:11px; color:#64748b; margin-bottom:10px;">— OR EMAIL &amp; PASSWORD —</div>

                        <div style="display:flex; flex-direction:column; gap:9px;">
                            ${isSignup ? `
                                <input type="text" id="nx-sb-name" placeholder="Full Name (e.g. Mohit Kumar)" style="width:100%; padding:11px 12px; border-radius:11px; background:#090d16; border:1px solid #334155; color:#fff; font-size:13.5px; outline:none;" />

                                <input type="text" id="nx-sb-bio" placeholder="Short Bio (e.g. IIT-JEE 2027)" style="width:100%; padding:10px 12px; border-radius:11px; background:#090d16; border:1px solid #334155; color:#fff; font-size:13px; outline:none;" />
                            ` : ""}
                            <input type="email" id="nx-sb-email" placeholder="Gmail / Email address" autocapitalize="none" style="width:100%; padding:11px 12px; border-radius:11px; background:#090d16; border:1px solid #334155; color:#fff; font-size:13.5px; outline:none;" />
                            <input type="password" id="nx-sb-pass" placeholder="Password (min 6 characters)" style="width:100%; padding:11px 12px; border-radius:11px; background:#090d16; border:1px solid #334155; color:#fff; font-size:13.5px; outline:none;" />

                    if (!window.NexusSecurity) return showErr("⏳ Security module load ho raha hai, 2 second ruk kar tap karein.");

                modal.querySelector("#nx-sb-submit").onclick = async function () {
                    if (!window.NexusSecurity) return showErr("⏳ Security module load ho raha hai, 2 second ruk kar tap karein.");

        function compressImageToBlobFile(file) {
            return new Promise((resolve) => {
                if (!file.type || !file.type.startsWith("image/") || file.size < 180000) {
                    resolve(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX = 1080;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
                        else if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        canvas.toBlob(
                            (blob) => {
                                if (!blob) return resolve(file);
                                resolve(new File([blob], (file.name || "photo").replace(/\.[^.]+$/, "") + ".webp", { type: "image/webp" }));
                            },
                            "image/webp",
                            0.78
                        );
                    };
                    img.onerror = () => resolve(file);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(file);
                reader.readAsDataURL(file);

        function attachSwipe(wrapperEl, sender, mediaType, isViewOnce) {
            if (!wrapperEl || wrapperEl.dataset.swipeBound) return;
            wrapperEl.dataset.swipeBound = "1";
            let sx = 0, sy = 0, dx = 0;
            wrapperEl.addEventListener("touchstart", (e) => {
                if (e.touches.length !== 1) return;
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
                dx = 0;
                wrapperEl.style.transition = "none";
            }, { passive: true });
            wrapperEl.addEventListener("touchmove", (e) => {
                if (!sx || e.touches.length !== 1) return;
                const moveX = e.touches[0].clientX - sx;
                const moveY = Math.abs(e.touches[0].clientY - sy);
                if (moveY > 35 && Math.abs(moveX) < moveY) return;
                if (Math.abs(moveX) > 12) {
                    dx = Math.max(-70, Math.min(70, moveX));
                    wrapperEl.style.transform = `translateX(${dx}px)`;
                }
            }, { passive: true });
            const endSwipe = () => {
                wrapperEl.style.transition = "transform 0.18s ease-out";
                wrapperEl.style.transform = "translateX(0px)";
                if (Math.abs(dx) >= 44) triggerMediaReplyBanner(sender, mediaType, isViewOnce);
                sx = 0; dx = 0;
            };
            wrapperEl.addEventListener("touchend", endSwipe, { passive: true });
            wrapperEl.addEventListener("touchcancel", endSwipe, { passive: true });
        }

        // ==================== E. REAL 50MB SUPABASE STORAGE UPLOAD ENGINE ====================
        window.__nxSendSupabaseMediaFiles = async function (fileList, forcedType, isViewOnce) {
            const files = Array.from(fileList || []);
            if (!files.length) return;

            const me = getMe();
            if (!me || !me.id || !window.NexusSecurity) {
                Nexus.toast("🔒 Pehle Login karein!");
                if (window.openNexusSupabaseAuthModal) window.openNexusSupabaseAuthModal("signin");
                return;
            }

            const peer = await resolveActiveDmPeer();
            if (!peer || !peer.id) {
                return Nexus.toast("⚠️ Pehle kisi member ki 1:1 Chat kholein!");
            }

            const convId = await window.NexusSecurity.getOrCreateConversation(me.id, peer.id);
            activeConvId = convId;
            activePeerProfile = peer;
            window.__nxActiveConversationId = convId;

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                if (file.size > MAX_MEDIA_BYTES) {
                    Nexus.toast(`⚠️ ${file.name} 50MB se badi hai!`);
                    continue;
                }

                const mime = (file.type || "").toLowerCase();
                const mediaType =
                    forcedType ||
                    (mime.startsWith("video") ? "video" : mime.startsWith("audio") ? "audio" : mime.includes("pdf") ? "file" : "image");

                const tempId = "tmp_" + Date.now() + "_" + i;
                const localUrl = URL.createObjectURL(file);

                await renderSupabaseMediaBubble(
                    {
                        id: tempId,
                        sender_id: me.id,
                        msg_type: mediaType,
                        is_view_once: Boolean(isViewOnce),
                        view_once_opened: false,
                        created_at: new Date().toISOString(),
                        _uploading: "📤 Uploading..."
                    },
                    { mediaType, fileName: file.name, viewOnce: Boolean(isViewOnce) },
                    localUrl
                );

                try {
                    if (mediaType === "image") {
                        file = await compressImageToBlobFile(file);
                    }
                    const uploaded = await window.NexusSecurity.uploadPrivateChatMedia(file, convId);
                    const savedRow = await window.NexusSecurity.sendChatMessage({
                        conversationId: convId,
                        myUserId: me.id,
                        peerUserId: peer.id,
                        peerPublicKeyJson: peer.e2ee_public_key || null,
                        mediaPath: uploaded.path,
                        mediaType: mediaType,
                        fileName: uploaded.fileName,
                        isViewOnce: Boolean(isViewOnce),
                        replyTo: activeMediaReplyContext || null
                    });

                    // Remove temporary uploading bubble & render real synced Supabase row
                    document.getElementById("nx_sbm_" + tempId)?.remove();
                    const dec = await window.NexusSecurity.decryptMessageRow(savedRow, me.id, peer.e2ee_public_key);
                    await renderSupabaseMediaBubble(savedRow, dec, localUrl);
                } catch (err) {
                    console.error("Supabase media upload error:", err);
                    const el = document.getElementById("nx_sbm_" + tempId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "❌ Failed";
                    Nexus.toast("❌ Upload failed: " + (err.message || "Check Storage policy"));
                }
            }
            Nexus.toast(isViewOnce ? "1️⃣ Protected View-Once Sent!" : "✅ Real Media Sent & Synced!");
        };

            if (!ctx || !ctx.isDm || !me || !me.id || !window.NexusSecurity) return;

            const peer = await resolveActiveDmPeer();
            if (!peer || !peer.id) return;

            const convId = await window.NexusSecurity.getOrCreateConversation(me.id, peer.id);
            if (convId === activeConvId) return;

            activeConvId = convId;
            activePeerProfile = peer;
            window.__nxActiveConversationId = convId;
            mediaRowsCache.clear();

            if (unsubConvRealtime) { unsubConvRealtime(); unsubConvRealtime = null; }

            // 1. Load existing media messages for this conversation
            const { data: rows } = await window.NexusSecurity.sb
                .from("messages")
                .select("*")
                .eq("conversation_id", convId)
                .order("created_at", { ascending: true })
                .limit(120);

            if (Array.isArray(rows)) {
                for (const row of rows) {
                    if (row.media_path || row.is_view_once || ["image", "video", "audio", "file"].includes(row.msg_type)) {
                        mediaRowsCache.set(row.id, row);
                        const dec = await window.NexusSecurity.decryptMessageRow(row, me.id, peer.e2ee_public_key);
                        await renderSupabaseMediaBubble(row, dec, "");
                    }
                }
            }

            // 2. Subscribe to real-time INSERT/UPDATE (so receiver sees photos, videos, reactions & View-Once burns instantly!)
            unsubConvRealtime = window.NexusSecurity.subscribeToConversation(convId, async (payload) => {
                const row = payload && payload.new;
                if (!row || !row.id) return;
                if (row.media_path || row.is_view_once || row.is_deleted_everyone || ["image", "video", "audio", "file"].includes(row.msg_type)) {
                    mediaRowsCache.set(row.id, row);
                    const dec = await window.NexusSecurity.decryptMessageRow(row, me.id, peer.e2ee_public_key);
                    await renderSupabaseMediaBubble(row, dec, "");
                }
            });
        }
        setInterval(syncActiveConversationMedia, 700);

        // ==================== G. PLUS (+) CHAT TOOLS MENU & VOICE RECORDER ====================
        async function toggleVoiceNote() {
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) voiceChunks.push(e.data); };
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: "audio/webm" });
                        const file = new File([blob], "voicenote.webm", { type: "audio/webm" });
                        window.__nxSendSupabaseMediaFiles([file], "audio", false);
                        stream.getTracks().forEach((t) => t.stop());
                    };
                    voiceRecorder.start();
                    isRecordingVoice = true;
                    Nexus.toast("🎤 Recording HD Voice... Tap '+' Again to Send!");
                } catch (e) {
                    alert("Microphone permission Allow kijiye!");
                }
            } else {
                voiceRecorder.stop();
                isRecordingVoice = false;
            }
        }

        function togglePlusToolsSheet() {
            if (isRecordingVoice) return toggleVoiceNote();

            if (!document.getElementById("nx-sb-inputs-wrap")) {
                const wrap = document.createElement("div");
                wrap.id = "nx-sb-inputs-wrap";
                wrap.style.cssText = "position:fixed; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden;";
                wrap.innerHTML = `
                    <input type="file" id="nx-sb-multi" accept="image/*" multiple />
                    <input type="file" id="nx-sb-viewonce" accept="image/*,video/*" />
                    <input type="file" id="nx-sb-video" accept="video/mp4,video/webm,video/*" />
                    <input type="file" id="nx-sb-pdf" accept="application/pdf,*/*" />
                `;
                document.body.appendChild(wrap);

                const bind = (id, mType, vo) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener("change", (e) => {
                        const sheet = document.getElementById("nx-whatsapp-plus-sheet");
                        if (sheet) sheet.style.display = "none";
                        if (e.target.files && e.target.files.length) {
                            window.__nxSendSupabaseMediaFiles(e.target.files, mType, vo);
                        }
                        e.target.value = "";
                    });
                };
                bind("nx-sb-multi", "image", false);
                bind("nx-sb-viewonce", null, true);
                bind("nx-sb-video", "video", false);
                bind("nx-sb-pdf", "file", false);
            }

            let menu = document.getElementById("nx-whatsapp-plus-sheet");
            if (!menu) {
                menu = document.createElement("div");
                menu.id = "nx-whatsapp-plus-sheet";
                menu.style.cssText =
                    "display:none; position:fixed; bottom:70px; right:16px; width:280px; background:#0f172a; border:1.5px solid #10b981; border-radius:20px; padding:10px; z-index:280000; box-shadow:0 18px 45px rgba(0,0,0,0.92); color:#fff;";
                menu.innerHTML = `
                    <div style="font-size:10px; font-weight:900; color:#34d399; padding:2px 6px 6px; text-transform:uppercase;">⚡ Nexus v2 Chat Tools</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px;">
                        <label for="nx-sb-multi" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fff; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; margin:0;"><span>🖼️</span><span>Photos</span></label>
                        <label for="nx-sb-viewonce" style="padding:10px; border-radius:12px; background:linear-gradient(135deg,#0c4a6e,#1e3a8a); border:1px solid #38bdf8; color:#e0f2fe; font-weight:800; display:flex; align-items:center; gap:7px; cursor:pointer; margin:0;"><span style="width:16px;height:16px;border-radius:50%;background:#38bdf8;color:#020617;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;">1</span><span>View Once</span></label>
                        <label for="nx-sb-video" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#38bdf8; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; margin:0;"><span>🎬</span><span>Video 50MB</span></label>
                        <label for="nx-sb-pdf" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fbbf24; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; margin:0;"><span>📄</span><span>Send PDF</span></label>
                        <button type="button" data-act="voice" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fb7185; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;"><span>🎤</span><span>Voice Note</span></button>
                        <button type="button" data-act="whiteboard" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #10b981; color:#34d399; font-weight:800; display:flex; align-items:center; gap:7px; cursor:pointer;"><span>✏️</span><span>Whiteboard</span></button>
                        <button type="button" data-act="e2ee" style="grid-column:span 2; padding:9px; border-radius:12px; background:rgba(16,185,129,0.14); border:1px solid rgba(16,185,129,0.4); color:#34d399; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;"><span>🔐</span><span>Verify E2EE Security Code</span></button>
                    </div>
                `;
                document.body.appendChild(menu);

                menu.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    const b = ev.target.closest("button[data-act]");
                    if (!b) return;
                    menu.style.display = "none";
                    const act = b.getAttribute("data-act");
                    if (act === "voice") toggleVoiceNote();
                    else if (act === "whiteboard") window.openSharedWhiteboardModal();
                    else if (act === "e2ee") window.openE2EEVerificationModal(activePeerProfile ? activePeerProfile.username : "Partner");
                });
                document.addEventListener("click", () => { menu.style.display = "none"; });
            }
            menu.style.display = menu.style.display === "none" ? "block" : "none";
        }

        // Intercept '+' button in open chat & native file input (#nx-dm-file-in)
        document.addEventListener("click", (e) => {
            if (!getMe()) return;
            const btn = e.target.closest("button, span, div");
            if (!btn || btn.classList.contains("nx-fab-post")) return;
            const t = (btn.innerText || "").trim();
            if ((t === "+" || t === "＋") && getOpenChatContainer()) {
                const r = btn.getBoundingClientRect();
                if (r.top > window.innerHeight - 150) {
                    e.stopPropagation();
                    e.preventDefault();
                    togglePlusToolsSheet();
                }
            }
        }, true);

        document.addEventListener("change", (e) => {
            const inp = e.target;
            if (!inp || inp.id !== "nx-dm-file-in" || !inp.files || !inp.files.length) return;
            e.stopPropagation();
            e.preventDefault();
            window.__nxSendSupabaseMediaFiles(inp.files, null, false);
            inp.value = "";
        }, true);

        // ==================== H. SUPABASE OFFICIAL STORY VIEWER ====================
        const LOGO = "data:image/svg+xml,%3Csvg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='30' fill='%23090d16'/%3E%3Cpath d='M30 88V32h15l30 38V32h15v56H75L45 50v38z' fill='%2310b981'/%3E%3C/svg%3E";
        let liveStories = [];

        async function fetchSupabaseStories() {
            if (!window.NexusSecurity || !NexusSecurity.sb) return;
            try {
                const { data } = await NexusSecurity.sb
                    .from("stories")
                    .select("*")
                    .order("created_at", { ascending: false })
                    .limit(20);
                if (Array.isArray(data)) liveStories = data;
            } catch (e) {}
        }

        window.openNexusOfficialStory = function () {
            document.getElementById("nx-real-video-story-modal")?.remove();
            if (!liveStories.length) return Nexus.toast("📢 No active official stories right now.");
            let idx = 0;
            const modal = document.createElement("div");
            modal.id = "nx-real-video-story-modal";
            modal.style.cssText = "position:fixed;inset:0;background:#000;z-index:999999;display:flex;flex-direction:column;justify-content:space-between;color:#fff;";
            modal.innerHTML = `
                <div id="nxsv-stage" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;"></div>
                <div style="position:relative;z-index:5;padding:14px;background:linear-gradient(#000c,transparent);">
                    <div style="display:flex;gap:4px;margin-bottom:12px;">${liveStories.map((_, i) => `<span style="flex:1;height:3px;background:#fff4;border-radius:4px;overflow:hidden;"><i id="nxsv-p-${i}" style="display:block;height:100%;width:0%;background:#10b981;"></i></span>`).join("")}</div>
                    <div style="display:flex;align-items:center;justify-content:space-between;">
                        <div style="display:flex;align-items:center;gap:8px;"><img src="${LOGO}" style="width:36px;height:36px;border-radius:50%;border:2px solid #10b981;"/><b>Nexus Official ✓</b></div>
                        <button id="nxsv-close" style="background:#fff2;border:0;color:#fff;border-radius:20px;padding:6px 12px;font-weight:900;cursor:pointer;">✕</button>
                    </div>
                </div>
                <div id="nxsv-cap" style="position:relative;z-index:5;padding:24px 16px;text-align:center;background:linear-gradient(transparent,#000d);font-weight:800;"></div>
            `;
            document.body.appendChild(modal);
            modal.querySelector("#nxsv-close").onclick = () => modal.remove();

            function show(i) {
                if (i >= liveStories.length) { modal.remove(); return; }
                idx = Math.max(0, i);
                const s = liveStories[idx];
                liveStories.forEach((_, j) => { const b = modal.querySelector(`#nxsv-p-${j}`); if (b) b.style.width = j < idx ? "100%" : "0%"; });
                modal.querySelector("#nxsv-cap").textContent = s.caption || "";
                const stage = modal.querySelector("#nxsv-stage");
                stage.innerHTML = "";
                const url = s.media_url || "";
                const prog = modal.querySelector(`#nxsv-p-${idx}`);
                if (s.media_type === "video" && url) {
                    const v = document.createElement("video");
                    v.src = url; v.autoplay = true; v.playsInline = true;
                    v.style.cssText = "width:100%;height:100%;object-fit:contain;";
                    stage.appendChild(v);
                    v.ontimeupdate = () => { if (v.duration && prog) prog.style.width = ((v.currentTime / v.duration) * 100) + "%"; };
                    v.onended = () => show(idx + 1);
                    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
                } else if (url) {
                    const im = document.createElement("img");
                    im.src = url; im.style.cssText = "width:100%;height:100%;object-fit:contain;";
                    stage.appendChild(im);
                    if (prog) prog.style.width = "100%";
                    setTimeout(() => { if (modal.isConnected) show(idx + 1); }, 6000);
                }
            }
            modal.querySelector("#nxsv-stage").onclick = (e) => show(e.clientX < window.innerWidth / 2 ? idx - 1 : idx + 1);
            show(0);
        };

        window.addEventListener("nexus-security-ready", fetchSupabaseStories);
        setTimeout(fetchSupabaseStories, 1200);
    })();
    </script>
</body>
