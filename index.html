    <!-- ================= 0.01s COLD-START REST PRE-FETCHER FOR BRAND NEW VISITORS ================= -->
    <script>
    (function () {
        if ("caches" in window) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
        }

        const PROJECT_ID = "nexus-community-bf99c";
        const BASE_REST_URL = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";

        function parseFirestoreFields(fields) {
            if (!fields) return {};
            const out = {};
            for (const k in fields) {
                const v = fields[k];
                if ("stringValue" in v) out[k] = v.stringValue;
                else if ("integerValue" in v) out[k] = Number(v.integerValue);
                else if ("doubleValue" in v) out[k] = Number(v.doubleValue);
                else if ("booleanValue" in v) out[k] = Boolean(v.booleanValue);
                else if ("arrayValue" in v) {
                    out[k] = (v.arrayValue.values || []).map((item) => item.stringValue || item.integerValue || "");
                }
            }
            return out;
        }

        async function preloadRealDatabaseForNewVisitor() {
            try {
                const [pRes, uRes] = await Promise.all([
                    fetch(BASE_REST_URL + "/nexus_real_posts?pageSize=25"),
                    fetch(BASE_REST_URL + "/nexus_accounts?pageSize=60")
                ]);

                if (pRes.ok) {
                    const pJson = await pRes.json();
                    if (pJson.documents && pJson.documents.length) {
                        const posts = pJson.documents
                            .map((d) => {
                                const obj = parseFirestoreFields(d.fields);
                                obj.id = d.name.split("/").pop();
                                return obj;
                            })
                            .filter((p) => {
                                const t = String(p.content || p.text || "").toLowerCase();
                                return !t.includes("website ko refresh kar lain") && !t.includes("ek baar refresh");
                            })
                            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                        if (posts.length) {
                            try { localStorage.setItem("nx_light_posts_v1", JSON.stringify(posts.slice(0, 25))); } catch (e) {}
                            if (window.Nexus) {
                                Nexus.posts = posts;
                                Nexus.listeners.onPosts.forEach((fn) => { try { fn(Nexus.posts); } catch (e) {} });
                            }
                        }
                    }
                }

                if (uRes.ok) {
                    const uJson = await uRes.json();
                    if (uJson.documents && uJson.documents.length) {
                        const users = uJson.documents
                            .map((d) => parseFirestoreFields(d.fields))
                            .filter((u) => u && u.username);

                        if (users.length) {
                            try { localStorage.setItem("nx_master_users_v1", JSON.stringify(users)); } catch (e) {}
                            if (window.Nexus) {
                                Nexus.cloudAccounts = users;
                                if (typeof Nexus.rebuildAllUsersMasterList === "function") Nexus.rebuildAllUsersMasterList();
                                Nexus.listeners.onUsers.forEach((fn) => { try { fn(Nexus.users); } catch (e) {} });
                            }
                        }
                    }
                }
            } catch (e) {}
        }
        preloadRealDatabaseForNewVisitor();
    })();
    </script>

    <script>
        if (window.tailwind) {
            tailwind.config = {
                corePlugins: {
                    preflight: false
                },
                theme: {
                    extend: {
                        colors: {
                            nexusDark: '#090d16',
                            nexusCard: '#0f172a',
                            nexusGreen: '#10b981',
                            nexusCyan: '#38bdf8'
                        }
                    }
                }
            };
        }

        // 2. SILENT LIVE HOT-RELOAD & TYPING DRAFT PROTECTOR
        (function() {
            let currentAppVersion = null;

            document.addEventListener('input', function(e) {
                if (e.target && (e.target.id === 'nx-dm-input' || e.target.id === 'nx-chat-msg-in')) {
                    try { sessionStorage.setItem('nx_draft_' + e.target.id, e.target.value); } catch (err) {}
                }
            }, { passive: true });

            window.hotReloadNexusModule = function(fileName) {
                const oldScript = document.querySelector(`script[src^="${fileName}"]`);
                const newScript = document.createElement('script');
                newScript.src = `${fileName}?v=${Date.now()}`;
                newScript.charset = 'UTF-8';
                document.body.appendChild(newScript);
                if (oldScript) setTimeout(() => oldScript.remove(), 1500);
            };

            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.Nexus || !Nexus.db) return;
                    Nexus.db.collection("nexus_config").doc("live_version").onSnapshot(function(doc) {
                        if (!doc.exists) return;
                        let data = doc.data();
                        if (!currentAppVersion) {
                            currentAppVersion = data.versionId;
                            return;
                        }
                        if (data.versionId && data.versionId !== currentAppVersion) {
                            currentAppVersion = data.versionId;
                            let targetFiles = Array.isArray(data.files) && data.files.length
                                ? data.files
                                : ['core.js', 'home.js', 'chat.js', 'dm.js'];
                            targetFiles.forEach(function(f) { window.hotReloadNexusModule(f); });
                        }
                    });
                }, 2500);
            });
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
            });
        }

        function safeSetLocalCache(key, dataObj) {
            try {
                localStorage.setItem(key, JSON.stringify(dataObj));
            } catch (e) {
                let me = localStorage.getItem('nx_active_account');
                let sv = localStorage.getItem('nx_saved_posts');
                localStorage.clear();
                if (me) localStorage.setItem('nx_active_account', me);
                if (sv) localStorage.setItem('nx_saved_posts', sv);
            }
        }

        function cleanUniqueList(arr) {
            if (!Array.isArray(arr)) return [];
            let seen = new Set();
            let out = [];
            arr.forEach(item => {
                let s = String(item || '').trim().toLowerCase();
                if (s && !seen.has(s)) {
                    seen.add(s);
                    out.push(s);
                }
            });
            return out;

            compressImage: function(file, maxW, quality, callback) {
                if (!file) return;
                if (file.type && file.type.startsWith('video/') && typeof window.__nxUploadVideoForPost === 'function') {
                    window.__nxUploadVideoForPost(file, callback);
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = Math.min(maxW || 780, 780);
                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL('image/webp', quality || 0.7);
                        if (!out || out.length < 50 || out.length > 150000) {
                            out = canvas.toDataURL('image/jpeg', 0.64);
                        }
                        callback(out);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

        function getStrictOpenChatMessagesBox() {
            const msgInput =

            if (!msgInput || msgInput.offsetParent === null) return null;

            for (const id of exactIds) {
                const el = document.getElementById(id);
                if (el && el.offsetParent !== null && !el.innerText.includes("Chat →")) {
                    installZeroBlinkWhatsAppPatch(el);
                    return el;
                }
            }

            let parent = msgInput.parentElement;
            while (parent && parent !== document.body) {
                for (let i = 0; i < parent.children.length; i++) {
                    const child = parent.children[i];
                    if (child.contains(msgInput)) continue;
                    const st = window.getComputedStyle(child);
                    if (
                        (st.overflowY === "auto" || st.overflowY === "scroll") &&
                        child.clientHeight > 120 &&
                        !child.innerText.includes("Chat →") &&
                        !child.innerText.includes("Save private notes")
                    ) {
                        installZeroBlinkWhatsAppPatch(child);
                        return child;
                    }
                }
                parent = parent.parentElement;
            }
            return null;
        }

        function unicodeSafeSlug(str) {
            const s = String(str || "").trim().toLowerCase();
            const ascii = s.replace(/[^a-z0-9]/g, "");
            let hash = 0;
            for (let i = 0; i < s.length; i++) {
                hash = (hash << 5) - hash + s.charCodeAt(i);
                hash |= 0;
            }
            return (ascii ? ascii + "_" : "u_") + Math.abs(hash).toString(36);
        }

        function getExactPartnerOrRoomTitle() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox) return "";

            let chatScreen = chatBox.parentElement;
            while (
                chatScreen &&
                chatScreen.parentElement &&
                chatScreen.parentElement !== document.body &&
                chatScreen.id !== "tab-community" &&
                chatScreen.id !== "nx-global-modal"
            ) {
                chatScreen = chatScreen.parentElement;
            }
            const root = chatScreen || document.body;

            const allEls = root.querySelectorAll("div, span, p, small");
            for (const el of allEls) {
                const r = el.getBoundingClientRect();
                if (r.top >= 15 && r.top <= 75 && r.left >= 50) {
                    const txt = (el.innerText || "").trim();
                    if (
                        (txt.includes("Online Now") ||
                            txt.includes("Last seen") ||
                            txt.includes("Offline") ||
                            txt.includes("Live Room")) &&
                        txt.length < 45
                    ) {
                        const prev = el.previousElementSibling;
                        if (prev && prev.innerText && prev.innerText.trim().length > 1) {
                            return prev.innerText.trim();
                        }
                        if (el.parentElement) {
                            const lines = (el.parentElement.innerText || "")
                                .split("\n")
                                .map((l) => l.trim())
                                .filter(Boolean);
                            if (lines.length >= 2) return lines[0];
                        }
                    }
                }
            }

            const topEl = document.elementFromPoint(135, 22);
            if (topEl && !topEl.closest(".nx-header")) {
                const t = (topEl.innerText || "").split("\n")[0].trim();
                if (t.length > 1 && t.length < 40 && !t.includes("Nexus")) return t;
            }

            return window.currentChatUser || window.currentRoomId || "";
        }

        function getSharedRoomKey() {
            const title = getExactPartnerOrRoomTitle();
            if (!title) return null;

            const myUname = getMyUsername() || "guest";
            const lower = title.toLowerCase().trim();

            if (lower.includes("saved messages")) return "dm_saved_" + myUname;

            if (
                lower.includes("student chat") ||
                lower.includes("live room") ||
                lower.includes("group") ||
                lower.includes("club") ||
                lower.includes("arena") ||
                lower.includes("doubt")
            ) {
                return "grp_" + unicodeSafeSlug(lower);
            }

            let partnerKey = "";
            const cleanLookup = lower.replace(/^@/, "").replace(/\.\.\.$/, "").trim();
            if (window.Nexus && Array.isArray(Nexus.users)) {
                const matched = Nexus.users.find((u) => {
                    if (!u) return false;
                    const uName = (u.username || "").toLowerCase().trim();
                    const dName = (u.name || "").toLowerCase().trim();
                    return (
                        uName === cleanLookup ||
                        dName === cleanLookup ||
                        (cleanLookup.length >= 4 && (dName.startsWith(cleanLookup) || cleanLookup.startsWith(dName)))
                    );
                });
                if (matched && matched.username) {
                    partnerKey = matched.username.toLowerCase().trim();
                }
            }

            if (!partnerKey) partnerKey = unicodeSafeSlug(cleanLookup);
            return "dm_v6_" + [myUname, partnerKey].sort().join("__");
        }

        function getBubbleMinuteScore(el) {
            if (el.classList && el.classList.contains("nx-ig-media-bubble") && el.dataset.msgTs) {
                const d = new Date(Number(el.dataset.msgTs));
                return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 100;
            }
            const txt = el.innerText || "";
            const matches = txt.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g);
            if (matches && matches.length > 0) {
                const lastTime = matches[matches.length - 1];
                const parts = lastTime.split(":");
                const mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                if (!nativeNodeOrderMap.has(el)) {
                    nativeNodeOrderMap.set(el, (++seqCounter % 90) / 100);
                }
                return mins + nativeNodeOrderMap.get(el);
            }
            return 9999;
        }

        function sortChatMessagesChronologically(chatBox, currentRoomKey) {
            if (!chatBox) return;

            chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                if (b.dataset.roomKey !== currentRoomKey || b.querySelector('button[data-react="❤️"]')) {
                    b.remove();
                }
            });

            const hasWatchPartyOpen = document.querySelector('iframe[src*="youtube"]') !== null;
            chatBox.style.paddingTop = hasWatchPartyOpen ? "18px" : "";

            const mediaBubbles = Array.from(chatBox.querySelectorAll(".nx-ig-media-bubble"));
            mediaBubbles.forEach((mb) => {
                const mScore = getBubbleMinuteScore(mb);
                const allKids = Array.from(chatBox.children);
                let placed = false;

                for (let i = 0; i < allKids.length; i++) {
                    const kid = allKids[i];
                    if (kid === mb) continue;
                    const kScore = getBubbleMinuteScore(kid);
                    if (kScore > mScore) {
                        chatBox.insertBefore(mb, kid);
                        placed = true;
                        break;
                    }
                }
                if (!placed && chatBox.lastElementChild !== mb) {
                    chatBox.appendChild(mb);
                }
            });
        }

        function installZeroBlinkWhatsAppPatch(chatBox) {
            if (!chatBox || chatBox.__nxV7ZeroBlink) return;
            chatBox.__nxV7ZeroBlink = true;

            const nativeDesc = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
            if (!nativeDesc || !nativeDesc.set) return;

            Object.defineProperty(chatBox, "innerHTML", {
                configurable: true,
                get: function () {
                    return nativeDesc.get.call(this);
                },
                set: function (newHtml) {
                    const rk = getSharedRoomKey() || "default";
                    const prevRk = this.dataset.nxRoom || "";

                    if (!newHtml || !newHtml.trim() || (prevRk && prevRk !== rk)) {
                        this.dataset.nxRoom = rk;
                        nativeDesc.set.call(this, newHtml);
                        if (roomMediaMap[rk]) {
                            roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
                        }
                        sortChatMessagesChronologically(this, rk);
                        this.scrollTop = this.scrollHeight;
                        return;
                    }

                    this.dataset.nxRoom = rk;
                    const temp = document.createElement("div");
                    nativeDesc.set.call(temp, newHtml);

                    const incNodes = Array.from(temp.children);
                    const curNodes = Array.from(this.children).filter(
                        (el) => !el.classList.contains("nx-ig-media-bubble")
                    );

                    const nearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 160;

                    incNodes.forEach((inc, i) => {
                        const cur = curNodes[i];
                        if (!cur) {
                            this.appendChild(inc);
                        } else if (cur.innerHTML !== inc.innerHTML) {
                            nativeDesc.set.call(cur, inc.innerHTML);
                            cur.className = inc.className;
                        }
                    });

                    if (curNodes.length > incNodes.length) {
                        for (let j = incNodes.length; j < curNodes.length; j++) {
                            curNodes[j].remove();
                        }
                    }

                    sortChatMessagesChronologically(this, rk);
                    if (nearBottom) {
                        this.scrollTop = this.scrollHeight;
                    }
                }
            });
        }

            const isMe = (msg.sender || "").toLowerCase() === getMyUsername();
            const displayUrl = localPreviewUrl || msg.mediaUrl || "";

        function compressImageToHD(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX = 820;
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > MAX) {
                            h = Math.round((h * MAX) / w);
                            w = MAX;
                        } else if (h > MAX) {
                            w = Math.round((w * MAX) / h);
                            h = MAX;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL("image/webp", 0.72);
                        if (!out || out.length < 50 || out.length > 150000) {
                            out = canvas.toDataURL("image/jpeg", 0.65);
                        }
                        resolve(out);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function uploadUpTo50MB(file, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const fd = new FormData();
                fd.append("reqtype", "fileupload");
                fd.append("time", "72h");
                fd.append("fileToUpload", file, file.name || "media.mp4");

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText && xhr.responseText.startsWith("http")) {
                        onProgress && onProgress(100);
                        resolve({ mode: "url", url: xhr.responseText.trim() });
                    } else {
                        chunkFallback(file, onProgress).then(resolve).catch(reject);
                    }
                };
                xhr.onerror = () => chunkFallback(file, onProgress).then(resolve).catch(reject);
                xhr.open("POST", "https://litterbox.catbox.moe/resources/internals/api.php", true);
                xhr.send(fd);
            });
        }

        window.__nxUploadVideoForPost = async function (file, callback) {
            if (file.size > MAX_VIDEO_BYTES) {
                alert("⚠️ Video 50MB se chhoti honi chahiye!");

            }
            if (window.Nexus && Nexus.toast) Nexus.toast("📤 Uploading Video 1%...");

            } catch (e) {

            }
        };

        function chunkFallback(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const b64 = e.target.result;
                        const total = Math.ceil(b64.length / CHUNK_CHAR_SIZE);
                        const sid = "str_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
                        if (total === 1) {
                            onProgress && onProgress(100);
                            resolve({ mode: "inline", url: b64 });
                            return;
                        }
                        for (let i = 0; i < total; i++) {
                            await Nexus.db
                                .collection("nexus_media_chunks")
                                .doc(`${sid}_${i}`)
                                .set({ streamId: sid, index: i, data: b64.slice(i * CHUNK_CHAR_SIZE, (i + 1) * CHUNK_CHAR_SIZE) });
                            onProgress && onProgress(Math.round(((i + 1) / total) * 100));
                        }
                        resolve({ mode: "chunked", streamId: sid, totalChunks: total });
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function loadChunkedMedia(msg) {
            if (msg.mediaUrl) return msg.mediaUrl;
            if (msg.mode !== "chunked" || !msg.streamId || !window.Nexus || !Nexus.db) return "";
            const parts = [];
            for (let i = 0; i < msg.totalChunks; i++) {
                const d = await Nexus.db.collection("nexus_media_chunks").doc(`${msg.streamId}_${i}`).get();
                if (d.exists) parts.push(d.data().data);
            }
            return parts.join("");
        }

        async function sendSingleOrMultipleFiles(fileList, forcedType, isViewOnce) {
            if (!fileList || !fileList.length) return;
            const files = Array.from(fileList);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.size > MAX_VIDEO_BYTES) {
                    alert(`⚠️ ${file.name} 50MB se badi hai!`);
                    continue;
                }

                const rk = getSharedRoomKey();
                if (!rk) return;

                const sender = getMyUsername() || "user";
                const msgId = "nxm_" + Date.now() + "_" + i + "_" + Math.random().toString(36).slice(2, 5);
                const mime = (file.type || "").toLowerCase();
                const mediaType =
                    forcedType ||
                    (mime.startsWith("video")
                        ? "video"
                        : mime.startsWith("audio")
                        ? "audio"
                        : mime.includes("pdf")
                        ? "pdf"
                        : "image");

                const nowTs = Date.now() + i;
                const localUrl = URL.createObjectURL(file);

                const tempDoc = {
                    id: msgId,
                    roomKey: rk,
                    sender,
                    mediaType,
                    viewOnce: Boolean(isViewOnce),
                    opened: false,
                    fileName: file.name || "file",
                    statusText: "📤 1%",
                    createdAt: nowTs
                };
                renderChatMediaBubble(tempDoc, localUrl);

                try {
                    const finalDoc = {
                        id: msgId,
                        roomKey: rk,
                        sender,
                        mediaType,
                        viewOnce: Boolean(isViewOnce),
                        opened: false,
                        fileName: file.name || "file",
                        createdAt: nowTs,
                        statusText: "✓✓"
                    };

                    if (mediaType === "image") {
                        finalDoc.mode = "inline";
                        finalDoc.mediaUrl = await compressImageToHD(file);
                    } else {
                        const res = await uploadUpTo50MB(file, (pct) => {
                            const el = document.getElementById(msgId);
                            const st = el && el.querySelector(".nx-media-status");
                            if (st) st.textContent = `📤 ${pct}%`;
                        });
                        if (res.mode === "chunked") {
                            finalDoc.mode = "chunked";
                            finalDoc.streamId = res.streamId;
                            finalDoc.totalChunks = res.totalChunks;
                        } else {
                            finalDoc.mode = res.mode;
                            finalDoc.mediaUrl = res.url;
                        }
                    }

                    if (!roomMediaMap[rk]) roomMediaMap[rk] = [];
                    roomMediaMap[rk].push(Object.assign({}, finalDoc, { localUrl }));

                    if (window.Nexus && Nexus.db) {
                        await Nexus.db.collection(MEDIA_COLLECTION).doc(msgId).set(finalDoc);
                    }

                    const el = document.getElementById(msgId);
                    if (el) {
                        el.dataset.rawUrl = finalDoc.mediaUrl || localUrl;
                        const vo = el.querySelector(".nx-open-viewonce");
                        if (vo) vo.dataset.url = finalDoc.mediaUrl || localUrl;
                        const st = el.querySelector(".nx-media-status");
                        if (st) st.textContent = "✓✓";
                    }
                } catch (err) {
                    const el = document.getElementById(msgId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "⚠️ Retry";
                }
            }
            if (window.Nexus && Nexus.toast) {
                Nexus.toast(isViewOnce ? "1️⃣ View Once Sent!" : files.length > 1 ? `✅ ${files.length} Photos Sent!` : "✅ Sent!");
            }
        }

        async function toggleVoiceNote() {
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) voiceChunks.push(e.data);
                    };
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: "audio/webm" });
                        const file = new File([blob], "voicenote.webm", { type: "audio/webm" });
                        sendSingleOrMultipleFiles([file], "audio", false);
                        stream.getTracks().forEach((t) => t.stop());
                    };
                    voiceRecorder.start();
                    isRecordingVoice = true;
                    if (window.Nexus && Nexus.toast) Nexus.toast("🎤 Recording HD Voice... Tap '+' Again to Send!");
                } catch (e) {
                    alert("Microphone permission Allow kijiye!");
                }
            } else {
                voiceRecorder.stop();
                isRecordingVoice = false;
            }
        }
