        <!-- 1. TAILWIND CSS ENGINE (With preflight:false so existing Nexus CSS stays 100% intact!) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                corePlugins: {
                    preflight: false
                },
                theme: {
                    extend: {
                        colors: {
                            nexusDark: '#090d16',
                            nexusCard: '#0f172a',
                            nexusGreen: '#10b981',
                            nexusCyan: '#38bdf8'
                        }
                    }
                }
            };
        }

        // 2. SILENT LIVE HOT-RELOAD & TYPING DRAFT PROTECTOR (Updates JS files without refreshing page!)
        (function() {
            let currentAppVersion = null;

            // Protect user's typed text so it is never lost
            document.addEventListener('input', function(e) {
                if (e.target && (e.target.id === 'nx-dm-input' || e.target.id === 'nx-chat-msg-in')) {
                    try { sessionStorage.setItem('nx_draft_' + e.target.id, e.target.value); } catch (err) {}
                }
            }, { passive: true });

            // Hot-swap updated JS files silently in background when Admin triggers an update
            window.hotReloadNexusModule = function(fileName) {
                const oldScript = document.querySelector(`script[src^="${fileName}"]`);
                const newScript = document.createElement('script');
                newScript.src = `${fileName}?v=${Date.now()}`;
                newScript.charset = 'UTF-8';
                document.body.appendChild(newScript);
                if (oldScript) setTimeout(() => oldScript.remove(), 1500);
            };

            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.Nexus || !Nexus.db) return;
                    Nexus.db.collection("nexus_config").doc("live_version").onSnapshot(function(doc) {
                        if (!doc.exists) return;
                        let data = doc.data();
                        if (!currentAppVersion) {
                            currentAppVersion = data.versionId;
                            return;
                        }
                        if (data.versionId && data.versionId !== currentAppVersion) {
                            currentAppVersion = data.versionId;
                            let targetFiles = Array.isArray(data.files) && data.files.length
                                ? data.files
                                : ['core.js', 'home.js', 'chat.js', 'dm.js'];
                            targetFiles.forEach(function(f) { window.hotReloadNexusModule(f); });
                        }
                    });
                }, 2500);
            });
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        function safeSetLocalCache(key, dataObj) {
            try {
                localStorage.setItem(key, JSON.stringify(dataObj));
            } catch (e) {
                let me = localStorage.getItem('nx_active_account');
                let sv = localStorage.getItem('nx_saved_posts');
                localStorage.clear();
                if (me) localStorage.setItem('nx_active_account', me);
                if (sv) localStorage.setItem('nx_saved_posts', sv);
            }
        }

        function cleanUniqueList(arr) {
            if (!Array.isArray(arr)) return [];
            let seen = new Set();
            let out = [];
            arr.forEach(item => {
                let s = String(item || '').trim().toLowerCase();
                if (s && !seen.has(s)) {
                    seen.add(s);
                    out.push(s);
                }
            });
            return out;
        }

        function loadInitialUsersCache() {
            try { return JSON.parse(localStorage.getItem('nx_master_users_v1') || '[]'); } catch(e) { return []; }
        }

        function loadInitialPostsCache() {
            try { return JSON.parse(localStorage.getItem('nx_light_posts_v1') || '[]'); } catch(e) { return []; }
        }

        let lastUsersProfileHash = '';

        window.Nexus = {
            config: {
                apiKey: "AIzaSyCKMUVSgImQ39LRuREmhqyd7NTyE-TNyrQ",
                authDomain: "nexus-community-bf99c.firebaseapp.com",
                projectId: "nexus-community-bf99c",
                storageBucket: "nexus-community-bf99c.firebasestorage.app",
                messagingSenderId: "605136574793",
                appId: "1:605136574793:web:c4c640af6b2f204eb0c296"
            },
            db: null,
            initialized: false,
            cloudReady: false,
            cloudAccounts: [],
            users: loadInitialUsersCache(),
            posts: loadInitialPostsCache(),
            rooms: {},
            pdfs: [],
            listeners: { onUsers: [], onPosts: [], onRooms: [] },

            rebuildAllUsersMasterList: function() {
                let map = {};

                (this.users || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let copy = Object.assign({}, u);
                        delete copy.pin;
                        copy.dp = copy.dp || '';
                        copy.followersList = cleanUniqueList(copy.followersList);
                        copy.followingList = cleanUniqueList(copy.followingList);
                        map[key] = copy;
                    }
                });

                let rawMe = localStorage.getItem('nx_active_account');
                let myActiveKey = '';
                let myLocalDp = '';
                if (rawMe) {
                    try {
                        let me = JSON.parse(rawMe);
                        if (me && me.username) {
                            myActiveKey = me.username.toLowerCase().trim();
                            myLocalDp = me.dp || '';
                            map[myActiveKey] = Object.assign({}, map[myActiveKey] || {}, me, {
                                isOnlineNow: true,
                                lastOnline: Date.now()
                            });
                        }
                    } catch(e) {}
                }

                (this.cloudAccounts || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let prevDp = (map[key] && map[key].dp) ? map[key].dp : '';
                        let copy = Object.assign({}, map[key] || {}, u);
                        delete copy.pin;
                        copy.dp = u.dp || prevDp || (key === myActiveKey ? myLocalDp : '');
                        copy.followersList = cleanUniqueList(u.followersList);
                        copy.followingList = cleanUniqueList(u.followingList);
                        map[key] = copy;

                        if (key === myActiveKey && rawMe) {
                            try {
                                let meParsed = JSON.parse(rawMe);
                                let syncedMe = Object.assign({}, meParsed, u, {
                                    dp: copy.dp,
                                    isOnlineNow: true,
                                    lastOnline: Date.now()
                                });
                                syncedMe.followersList = copy.followersList;
                                syncedMe.followingList = copy.followingList;
                                safeSetLocalCache('nx_active_account', syncedMe);
                            } catch (e) {}
                        }
                    }
                });

                let existingDisplayNames = new Set(
                    Object.values(map).map(acc => (acc.name || acc.username || '').toLowerCase().trim()).filter(Boolean)
                );

                (this.posts || []).forEach(p => {
                    if (!p || p.username === 'nexus_official') return;
                    let uname = (p.username || p.author || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
                    let authorDisplay = (p.author || p.username || '').toLowerCase().trim();
                    if (uname && !map[uname] && !existingDisplayNames.has(authorDisplay)) {
                        map[uname] = {
                            username: p.username || uname,
                            name: p.author || p.username || 'Member',
                            bio: p.bio || 'JEE Aspirant',
                            dp: p.dp || '',
                            followersList: [],
                            followingList: []
                        };
                        existingDisplayNames.add(authorDisplay);
                    } else if (uname && map[uname] && !map[uname].dp && p.dp) {
                        map[uname].dp = p.dp;
                    }
                });

                let byNameMap = {};
                let finalUsers = [];
                Object.values(map).forEach(u => {
                    if (!u || !u.username) return;
                    let nameKey = (u.name || u.username).toLowerCase().trim();
                    if (!byNameMap[nameKey]) {
                        byNameMap[nameKey] = u;
                        finalUsers.push(u);
                    } else {
                        let existing = byNameMap[nameKey];
                        let existingScore = (existing.dp ? 10 : 0) + ((existing.followersList || []).length * 2) + (existing.lastOnline ? 1 : 0);
                        let currentScore = (u.dp ? 10 : 0) + ((u.followersList || []).length * 2) + (u.lastOnline ? 1 : 0);

                        if (currentScore > existingScore) {
                            u.dp = u.dp || existing.dp || '';
                            u.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            u.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                            let idx = finalUsers.indexOf(existing);
                            if (idx !== -1) finalUsers[idx] = u;
                            byNameMap[nameKey] = u;
                        } else {
                            existing.dp = existing.dp || u.dp || '';
                            existing.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            existing.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                        }
                    }
                });

                this.users = finalUsers;
                let lightUsers = this.users.map(u => ({
                    username: u.username,
                    name: u.name,
                    bio: u.bio,
                    dp: (u.dp && u.dp.length < 180000) ? u.dp : '',
                    moodNote: u.moodNote || '',
                    isOnlineNow: u.isOnlineNow,
                    lastOnline: u.lastOnline,
                    verified: u.verified,
                    followersList: u.followersList || [],
                    followingList: u.followingList || []
                }));
                safeSetLocalCache('nx_master_users_v1', lightUsers);
            },

            init: function() {
                if (this.initialized) return;
                this.initialized = true;
                this.rebuildAllUsersMasterList();
                this.notifyAll();

                if (typeof firebase !== 'undefined') this.connectCloud();
                else window.addEventListener('load', () => this.connectCloud());
            },

            connectCloud: function() {
                if (this.db) return;
                try {
                    if (!firebase.apps.length) firebase.initializeApp(this.config);
                    this.db = firebase.firestore();
                    this.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
                } catch (e) {
                    return;
                }

                let rawMe = localStorage.getItem('nx_active_account');
                if (rawMe) {
                    try {
                        let meObj = JSON.parse(rawMe);
                        if (meObj && meObj.username) {
                            let updatePayload = {
                                isOnlineNow: true,
                                lastOnline: Date.now(),
                                lastSeenAt: Date.now()
                            };
                            if (meObj.dp) updatePayload.dp = meObj.dp;
                            this.db.collection("nexus_accounts").doc(meObj.username).set(updatePayload, { merge: true });
                        }
                    } catch(e) {}
                }

                this.db.collection("nexus_accounts").onSnapshot(snap => {
                    this.cloudAccounts = [];
                    snap.forEach(d => this.cloudAccounts.push(d.data()));
                    this.cloudReady = true;
                    this.rebuildAllUsersMasterList();

                    let currentHash = this.users.map(u =>
                        `${u.username}:${u.name}:${u.bio}:${(u.dp || '').length}:${u.isOnlineNow ? 1 : 0}:${u.moodNote || ''}:${u.verified ? 1 : 0}:${(u.followersList || []).length}:${(u.followingList || []).length}`
                    ).join('|');

                    if (currentHash !== lastUsersProfileHash) {
                        lastUsersProfileHash = currentHash;
                        this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                    }
                });

                this.db.collection("nexus_real_posts").orderBy("createdAt", "desc").limit(50).onSnapshot(snap => {
                    this.posts = [];
                    snap.forEach(d => { let p = d.data(); p.id = d.id; this.posts.push(p); });
                    let ultraLightPosts = this.posts.slice(0, 25).map(p => Object.assign({}, p, {
                        image: (p.image && p.image.length > 90000) ? '' : p.image
                    }));
                    safeSetLocalCache('nx_light_posts_v1', ultraLightPosts);
                    this.rebuildAllUsersMasterList();
                    this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });
                });
            },

            notifyAll: function() {
                this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });
            },

            getCurrentUser: function() {
                let raw = localStorage.getItem('nx_active_account');
                if (!raw) return null;
                try {
                    let acc = JSON.parse(raw);
                    if (!acc || !acc.username || !acc.name) return null;
                    let cloudMatch = this.cloudAccounts.find(u => u.username && u.username.toLowerCase() === acc.username.toLowerCase());
                    if (cloudMatch) {
                        let merged = Object.assign({}, acc, cloudMatch, {
                            dp: cloudMatch.dp || acc.dp || '',
                            isOnlineNow: true
                        });
                        merged.followersList = cleanUniqueList(cloudMatch.followersList);
                        merged.followingList = cleanUniqueList(cloudMatch.followingList);
                        return merged;
                    }
                    return acc;
                } catch(e) { return null; }
            },

            switchTab: function(tabId, btnEl) {
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';

                document.querySelectorAll('.nx-tab-screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(tabId);
                if (target) target.classList.add('active');

                document.querySelectorAll('.nx-nav-item').forEach(b => b.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
                else {
                    const navBtn = document.querySelector(`.nx-nav-item[data-tab="${tabId}"]`);
                    if (navBtn) navBtn.classList.add('active');
                }
                window.scrollTo(0, 0);
            },

            toast: function(msg) {
                const t = document.getElementById('nx-toast');
                if (!t) return;
                t.innerText = msg;
                t.style.display = 'block';
                setTimeout(() => { t.style.display = 'none'; }, 2200);
            },

            compressImage: function(file, maxW, quality, callback) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        callback(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        document.addEventListener('DOMContentLoaded', () => Nexus.init());
        setTimeout(() => Nexus.init(), 150);
    </script>

<script>
    
    /============================================================================
   NEXUS FIX PATCH: 
   1. Kills "This page doesn't exist (404_NOT_FOUND)" Duplicate Watch-Party Box
   2. Fixes Green (+) Button & Real Database Photo Sending (Group + 1v1 Chat)
   ============================================================================ */

(function () {
  if (window.__NEXUS_404_AND_PIC_FIXED__) return;
  window.__NEXUS_404_AND_PIC_FIXED__ = true;

  // ==========================================================================
  // PART 1: PERMANENTLY REMOVE 404_NOT_FOUND & DUPLICATE WATCH-PARTY BOX
  // ==========================================================================
  function cleanBrokenWatchPartyIframes() {
    // 1. Check all iframes on the screen
    document.querySelectorAll("iframe").forEach((frame) => {
      const src = (frame.getAttribute("src") || "").trim();

      // Agar iframe ka link khali hai, undefined hai, ya khud ke vercel domain ka 404 page khol raha hai
      const isInvalid =
        !src ||
        src === "about:blank" ||
        src.includes("undefined") ||
        src.includes("null") ||
        (src.includes(window.location.hostname) && !src.includes("vault.html"));

      if (isInvalid) {
        // Agar upar wala duplicate Group Watch-Party box hai to uske pure wrapper ko chhupa do
        const wpBox = frame.closest('[id*="watch"], [class*="watch"]');
        if (wpBox && !wpBox.innerText.includes("Playing in Sync")) {
          wpBox.style.display = "none";
        }
        frame.remove();
      }
    });

    // 2. Agar 2 Watch-Party boxes ek sath khule hain (jaise screenshot me hai),
    // to upar wale broken "Group Watch-Party" box ko hide rakho jab "Playing in Sync" active ho
    const allDivs = document.querySelectorAll("div");
    let hasWorkingSyncPlayer = false;
    allDivs.forEach((d) => {
      if (d.innerText && d.innerText.includes("Playing in Sync")) {
        hasWorkingSyncPlayer = true;
      }
    });

    if (hasWorkingSyncPlayer) {
      allDivs.forEach((d) => {
        if (
          d.children.length <= 4 &&
          d.innerText &&
          d.innerText.includes("Group Watch-Party") &&
          d.innerText.includes("Stop") &&
          !d.innerText.includes("Playing in Sync")
        ) {
          const parentCard = d.parentElement;
          if (parentCard && parentCard.querySelector("iframe")) {
            parentCard.style.display = "none";
          }
        }
      });
    }
  }

  // Har 300ms par auto-guard chalega taki 404 box kabhi ek pal ke liye bhi na dikhe
  setInterval(cleanBrokenWatchPartyIframes, 300);
  document.addEventListener("DOMContentLoaded", cleanBrokenWatchPartyIframes);

  // ==========================================================================
  // PART 2: REAL PHOTO COMPRESSION + STORAGE & DATABASE SENDER (GROUP + 1v1)
  // ==========================================================================

  // Create hidden file input for real gallery/camera photo selection
  let realPicInput = document.getElementById("nx-real-photo-input");
  if (!realPicInput) {
    realPicInput = document.createElement("input");
    realPicInput.type = "file";
    realPicInput.id = "nx-real-photo-input";
    realPicInput.accept = "image/*";
    realPicInput.style.display = "none";
    document.body.appendChild(realPicInput);
  }

  // Step A: Compress 5MB Camera Photo into ~55KB Crystal Clear WebP/JPEG Real Data
  function compressPhotoToRealData(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX_SIZE = 850; // Clear HD on mobile screen
          let w = img.width;
          let h = img.height;

          if (w > h && w > MAX_SIZE) {
            h = Math.round((h * MAX_SIZE) / w);
            w = MAX_SIZE;
          } else if (h > MAX_SIZE) {
            w = Math.round((w * MAX_SIZE) / h);
            h = MAX_SIZE;
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);

          // Try WebP first (smallest & clearest), fallback to JPEG
          let dataUrl = canvas.toDataURL("image/webp", 0.72);
          if (!dataUrl || dataUrl.length < 50 || dataUrl.length > 180000) {
            dataUrl = canvas.toDataURL("image/jpeg", 0.65);
          }
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Step B: Upload to Cloud Storage (if configured) OR Return Real Compressed Data URL
  async function uploadOrGetRealImageUrl(file) {
    const compressedDataUrl = await compressPhotoToRealData(file);

    // 1. Agar Firebase Storage active hai to koshish karo (2.5 second fast timeout ke sath)
    if (window.firebase && typeof firebase.storage === "function") {
      try {
        const uploadTask = new Promise(async (resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("Storage timeout")), 2500);
          try {
            const ref = firebase
              .storage()
              .ref("chat_photos/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, ""));
            await ref.putString(compressedDataUrl, "data_url");
            const url = await ref.getDownloadURL();
            clearTimeout(timer);
            resolve(url);
          } catch (err) {
            clearTimeout(timer);
            reject(err);
          }
        });
        return await uploadTask;
      } catch (e) {
        // Agar Firebase Storage par rules band hain, to compressed real data URL use hoga (100% Guaranteed!)
      }
    }

    return compressedDataUrl;
  }

  // Step C: Send Photo into Active Chat (Works with Firebase, Supabase & Existing dm.js!)
  async function sendRealPhotoToActiveChat(file) {
    if (!file) return;

    // 1. Show Instant Toast
    showQuickToast("⚡ Sending Photo...");

    try {
      const finalImageUrl = await uploadOrGetRealImageUrl(file);

      // Current User & Active Room Pata Karo
      const senderName =
        window.currentUser?.username ||
        window.currentUser?.name ||
        window.currentUserName ||
        localStorage.getItem("nexus_username") ||
        localStorage.getItem("currentUser") ||
        "mohiy";

      const activeRoom =
        window.currentRoomId ||
        window.currentChatUser ||
        window.activeChatId ||
        document.querySelector("h1, h2, h3, .room-title")?.innerText?.trim() ||
        "casual_student_chat";

      const msgPayload = {
        id: "pic_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        sender: senderName,
        username: senderName,
        user: senderName,
        room: activeRoom,
        roomId: activeRoom,
        type: "image",
        image: finalImageUrl,
        imageUrl: finalImageUrl,
        mediaUrl: finalImageUrl,
        url: finalImageUrl,
        text: "📷 Photo",
        timestamp: Date.now(),
        created_at: new Date().toISOString()
      };

      // 2. INSTANT 0.01s SCREEN RENDER (Bina Refresh Kiye Chat Me Dikhao)
      renderPhotoInChatScreenInstant(msgPayload);

      // 3. SAVE IN REAL DATABASE (Firebase Realtime DB / Firestore / Supabase)
      let savedInCloud = false;

      // A. Agar aapke dm.js mein pahle se sendMessage / sendChatMessage function hai
      if (typeof window.sendDirectImageMessage === "function") {
        window.sendDirectImageMessage(finalImageUrl);
        savedInCloud = true;
      }

      // B. Firebase Realtime Database Save (Saves in both messages & group_messages paths)
      if (window.firebase && typeof firebase.database === "function") {
        const db = firebase.database();
        const cleanRoomKey = String(activeRoom).replace(/[.#$[\]/\s]+/g, "_").toLowerCase();
        await Promise.allSettled([
          db.ref("messages/" + cleanRoomKey + "/" + msgPayload.id).set(msgPayload),
          db.ref("group_messages/" + cleanRoomKey + "/" + msgPayload.id).set(msgPayload),
          db.ref("chats/" + cleanRoomKey + "/" + msgPayload.id).set(msgPayload)
        ]);
        savedInCloud = true;
      }

      // C. Supabase Database Save (Agar Supabase client connected hai)
      if (window.supabase && typeof window.supabase.from === "function") {
        try {
          await window.supabase.from("messages").insert([
            {
              sender: senderName,
              room_id: activeRoom,
              text: "📷 Photo",
              image_url: finalImageUrl,
              created_at: new Date().toISOString()
            }
          ]);
          savedInCloud = true;
        } catch (e) {}
      }

      showQuickToast("✅ Photo Sent!");
    } catch (err) {
      console.error("Photo send error:", err);
      showQuickToast("⚠️ Photo fir se select karein");
    }
  }

  // Instant UI Bubble Renderer for the Current Chat Area
  function renderPhotoInChatScreenInstant(msg) {
    // Chat messages container ko automatically dhoondo
    const chatBox =
      document.getElementById("chat-messages") ||
      document.getElementById("dm-messages") ||
      document.getElementById("messages-container") ||
      document.getElementById("nx-messages-container") ||
      document.querySelector(".chat-messages, .messages-area, .overflow-y-auto");

    if (!chatBox) return;

    const wrapper = document.createElement("div");
    wrapper.id = msg.id;
    wrapper.style.cssText =
      "display:flex; justify-content:flex-end; margin:8px 0; padding:0 10px; animation: fadeIn 0.15s ease;";

    wrapper.innerHTML = `
      <div style="background:#056162; color:#fff; padding:6px; border-radius:14px 14px 2px 14px; max-width:75%; box-shadow:0 2px 8px rgba(0,0,0,0.35);">
        <div style="font-size:10px; color:#34d399; font-weight:700; margin-bottom:4px;">@${msg.sender}</div>
        <img src="${msg.imageUrl}" style="max-width:220px; max-height:260px; width:100%; border-radius:10px; display:block; object-fit:cover; cursor:pointer;" onclick="window.open(this.src)" />
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:10px; opacity:0.8;">
          <span>📷 HD Photo</span>
          <span>✓✓ Just now</span>
        </div>
      </div>
    `;

    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showQuickToast(text) {
    let t = document.getElementById("nx-pic-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "nx-pic-toast";
      t.style.cssText =
        "position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:#10b981; color:#042f2e; font-weight:800; font-size:12px; padding:6px 14px; border-radius:999px; z-index:99999; box-shadow:0 4px 15px rgba(0,0,0,0.5); transition:opacity 0.2s;";
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.style.opacity = "1";
    clearTimeout(window.__nxToastTimer);
    window.__nxToastTimer = setTimeout(() => {
      t.style.opacity = "0";
    }, 2200);
  }

  // Jab user photo chune, turant bhej do
  realPicInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) {
      sendRealPhotoToActiveChat(file);
    }
    e.target.value = "";
  });

  // ==========================================================================
  // PART 3: FIX GREEN (+) BUTTON OVERLAPPING & ATTACH CLEAN MENU
  // ==========================================================================
  function createCleanPlusMenu() {
    let menu = document.getElementById("nx-fixed-plus-popup");
    if (menu) return menu;

    menu = document.createElement("div");
    menu.id = "nx-fixed-plus-popup";
    menu.style.cssText =
      "display:none; position:fixed; bottom:72px; right:64px; width:195px; background:#0f172a; border:1px solid #10b981; border-radius:16px; padding:6px; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.75); color:#fff; font-family:sans-serif;";

    menu.innerHTML = `
      <button type="button" id="nx-trigger-gallery-btn" style="width:100%; text-align:left; padding:10px 12px; border:none; background:transparent; color:#fff; font-size:13px; font-weight:700; border-radius:10px; display:flex; align-items:center; gap:10px; cursor:pointer;">
        🖼️ <span>Send Photo (Gallery)</span>
      </button>
      <button type="button" id="nx-trigger-camera-btn" style="width:100%; text-align:left; padding:10px 12px; border:none; background:transparent; color:#fff; font-size:13px; font-weight:700; border-radius:10px; display:flex; align-items:center; gap:10px; cursor:pointer;">
        📸 <span>Take Camera Pic</span>
      </button>
    `;

    document.body.appendChild(menu);

    menu.querySelector("#nx-trigger-gallery-btn").onclick = (ev) => {
      ev.stopPropagation();
      menu.style.display = "none";
      realPicInput.removeAttribute("capture");
      realPicInput.click();
    };

    menu.querySelector("#nx-trigger-camera-btn").onclick = (ev) => {
      ev.stopPropagation();
      menu.style.display = "none";
      realPicInput.setAttribute("capture", "environment");
      realPicInput.click();
    };

    document.addEventListener("click", () => {
      menu.style.display = "none";
    });

    return menu;
  }

  // Intercept any click on the green (+) button or existing photo input buttons
  document.addEventListener(
    "click",
    (e) => {
      const btn = e.target.closest("button, label, span, div");
      if (!btn) return;

      const txt = (btn.innerText || "").trim();
      const idOrClass = ((btn.id || "") + " " + (btn.className || "")).toLowerCase();

      // Detect the green "+" button inside the bottom message input bar
      const isPlusButton =
        txt === "+" ||
        txt === "＋" ||
        idOrClass.includes("plus-btn") ||
        idOrClass.includes("attach-btn") ||
        btn.querySelector(".fa-plus");

      if (isPlusButton && btn.getBoundingClientRect().top > window.innerHeight - 140) {
        e.stopPropagation();
        const menu = createCleanPlusMenu();
        menu.style.display = menu.style.display === "none" ? "block" : "none";
      }
    },
    true // Capture phase so duplicate broken listeners never block it!
  );
})();
