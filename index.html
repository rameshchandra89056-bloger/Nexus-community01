    <script>
        if (window.tailwind) {
            tailwind.config = {
                corePlugins: {
                    preflight: false
                },
                theme: {
                    extend: {
                        colors: {
                            nexusDark: '#090d16',
                            nexusCard: '#0f172a',
                            nexusGreen: '#10b981',
                            nexusCyan: '#38bdf8'
                        }
                    }
                }
            };
        }

        // 2. SILENT LIVE HOT-RELOAD & TYPING DRAFT PROTECTOR
        (function() {
            let currentAppVersion = null;

            document.addEventListener('input', function(e) {
                if (e.target && (e.target.id === 'nx-dm-input' || e.target.id === 'nx-chat-msg-in')) {
                    try { sessionStorage.setItem('nx_draft_' + e.target.id, e.target.value); } catch (err) {}
                }
            }, { passive: true });

            window.hotReloadNexusModule = function(fileName) {
                const oldScript = document.querySelector(`script[src^="${fileName}"]`);
                const newScript = document.createElement('script');
                newScript.src = `${fileName}?v=${Date.now()}`;
                newScript.charset = 'UTF-8';
                document.body.appendChild(newScript);
                if (oldScript) setTimeout(() => oldScript.remove(), 1500);
            };

            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.Nexus || !Nexus.db) return;
                    Nexus.db.collection("nexus_config").doc("live_version").onSnapshot(function(doc) {
                        if (!doc.exists) return;
                        let data = doc.data();
                        if (!currentAppVersion) {
                            currentAppVersion = data.versionId;
                            return;
                        }
                        if (data.versionId && data.versionId !== currentAppVersion) {
                            currentAppVersion = data.versionId;
                            let targetFiles = Array.isArray(data.files) && data.files.length
                                ? data.files
                                : ['core.js', 'home.js', 'chat.js', 'dm.js'];
                            targetFiles.forEach(function(f) { window.hotReloadNexusModule(f); });
                        }
                    });
                }, 2500);
            });
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
            });
        }

        function safeSetLocalCache(key, dataObj) {
            try {
                localStorage.setItem(key, JSON.stringify(dataObj));
            } catch (e) {
                let me = localStorage.getItem('nx_active_account');
                let sv = localStorage.getItem('nx_saved_posts');
                localStorage.clear();
                if (me) localStorage.setItem('nx_active_account', me);
                if (sv) localStorage.setItem('nx_saved_posts', sv);
            }
        }

        function cleanUniqueList(arr) {
            if (!Array.isArray(arr)) return [];
            let seen = new Set();
            let out = [];
            arr.forEach(item => {
                let s = String(item || '').trim().toLowerCase();
                if (s && !seen.has(s)) {
                    seen.add(s);
                    out.push(s);
                }
            });
            return out;
        }

        function loadInitialUsersCache() {
            try { return JSON.parse(localStorage.getItem('nx_master_users_v1') || '[]'); } catch(e) { return []; }
        }

        function loadInitialPostsCache() {
            try { return JSON.parse(localStorage.getItem('nx_light_posts_v1') || '[]'); } catch(e) { return []; }
        }

        let lastUsersProfileHash = '';

        // 100% COMPLETE NEXUS CORE ENGINE (SO NEW USERS SEE REAL DATABASE INSTANTLY WITHOUT REFRESH!)

                projectId: "nexus-community-bf99c",

            cloudAccounts: [],
            users: loadInitialUsersCache(),
            posts: loadInitialPostsCache(),

            pdfs: [],

            rebuildAllUsersMasterList: function() {
                let map = {};

                (this.users || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let copy = Object.assign({}, u);
                        delete copy.pin;
                        copy.dp = copy.dp || '';
                        copy.followersList = cleanUniqueList(copy.followersList);
                        copy.followingList = cleanUniqueList(copy.followingList);
                        map[key] = copy;
                    }
                });

                let rawMe = localStorage.getItem('nx_active_account');
                let myActiveKey = '';
                let myLocalDp = '';
                if (rawMe) {
                    try {
                        let me = JSON.parse(rawMe);
                        if (me && me.username) {
                            myActiveKey = me.username.toLowerCase().trim();
                            myLocalDp = me.dp || '';

                                isOnlineNow: true,

                            });

                    } catch(e) {}
                }

                (this.cloudAccounts || []).forEach(u => {
                    if (u && u.username) {
                        let key = u.username.toLowerCase().trim();
                        let prevDp = (map[key] && map[key].dp) ? map[key].dp : '';
                        let copy = Object.assign({}, map[key] || {}, u);
                        delete copy.pin;
                        copy.dp = u.dp || prevDp || (key === myActiveKey ? myLocalDp : '');
                        copy.followersList = cleanUniqueList(u.followersList);
                        copy.followingList = cleanUniqueList(u.followingList);
                        map[key] = copy;

                        if (key === myActiveKey && rawMe) {

                                syncedMe.followingList = copy.followingList;
                                safeSetLocalCache('nx_active_account', syncedMe);
                            } catch (e) {}
                        }
                    }
                });

                let existingDisplayNames = new Set(
                    Object.values(map).map(acc => (acc.name || acc.username || '').toLowerCase().trim()).filter(Boolean)
                );

                (this.posts || []).forEach(p => {
                    if (!p || p.username === 'nexus_official') return;
                    let uname = (p.username || p.author || '').toLowerCase().replace(/[^a-z0-9_]/g, '');

                    if (uname && !map[uname] && !existingDisplayNames.has(authorDisplay)) {
                        map[uname] = {
                            username: p.username || uname,
                            name: p.author || p.username || 'Member',
                            bio: p.bio || 'JEE Aspirant',
                            dp: p.dp || '',
                            followersList: [],
                            followingList: []
                        };
                        existingDisplayNames.add(authorDisplay);
                    } else if (uname && map[uname] && !map[uname].dp && p.dp) {
                        map[uname].dp = p.dp;
                    }
                });

                let byNameMap = {};
                let finalUsers = [];
                Object.values(map).forEach(u => {
                    if (!u || !u.username) return;
                    let nameKey = (u.name || u.username).toLowerCase().trim();
                    if (!byNameMap[nameKey]) {
                        byNameMap[nameKey] = u;
                        finalUsers.push(u);
                    } else {
                        let existing = byNameMap[nameKey];
                        let existingScore = (existing.dp ? 10 : 0) + ((existing.followersList || []).length * 2) + (existing.lastOnline ? 1 : 0);
                        let currentScore = (u.dp ? 10 : 0) + ((u.followersList || []).length * 2) + (u.lastOnline ? 1 : 0);

                        if (currentScore > existingScore) {
                            u.dp = u.dp || existing.dp || '';
                            u.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            u.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                            let idx = finalUsers.indexOf(existing);
                            if (idx !== -1) finalUsers[idx] = u;
                            byNameMap[nameKey] = u;
                        } else {
                            existing.dp = existing.dp || u.dp || '';
                            existing.followersList = cleanUniqueList([...(existing.followersList || []), ...(u.followersList || [])]);
                            existing.followingList = cleanUniqueList([...(existing.followingList || []), ...(u.followingList || [])]);
                        }
                    }
                });

                this.users = finalUsers;
                let lightUsers = this.users.map(u => ({
                    username: u.username,
                    name: u.name,
                    bio: u.bio,
                    dp: (u.dp && u.dp.length < 180000) ? u.dp : '',
                    moodNote: u.moodNote || '',
                    isOnlineNow: u.isOnlineNow,
                    lastOnline: u.lastOnline,
                    verified: u.verified,
                    followersList: u.followersList || [],
                    followingList: u.followingList || []
                }));
                safeSetLocalCache('nx_master_users_v1', lightUsers);

            init: function() {
                if (this.initialized) return;
                this.initialized = true;
                this.rebuildAllUsersMasterList();
                this.notifyAll();

                if (typeof firebase !== 'undefined') this.connectCloud();
                else window.addEventListener('load', () => this.connectCloud());

            connectCloud: function() {
                if (this.db) return;
                try {
                    if (!firebase.apps.length) firebase.initializeApp(this.config);
                    this.db = firebase.firestore();
                } catch (e) {
                    return;
                }

                let rawMe = localStorage.getItem('nx_active_account');
                if (rawMe) {
                    try {
                        let meObj = JSON.parse(rawMe);
                        if (meObj && meObj.username) {
                            let updatePayload = {
                                isOnlineNow: true,
                                lastOnline: Date.now(),
                                lastSeenAt: Date.now()
                            };
                            if (meObj.dp) updatePayload.dp = meObj.dp;
                            this.db.collection("nexus_accounts").doc(meObj.username).set(updatePayload, { merge: true });
                        }
                    } catch(e) {}
                }

                // Live Accounts Stream
                this.db.collection("nexus_accounts").onSnapshot(snap => {
                    this.cloudAccounts = [];
                    snap.forEach(d => this.cloudAccounts.push(d.data()));
                    this.cloudReady = true;
                    this.rebuildAllUsersMasterList();

                    let currentHash = this.users.map(u =>
                        `${u.username}:${u.name}:${u.bio}:${(u.dp || '').length}:${u.isOnlineNow ? 1 : 0}:${u.moodNote || ''}:${u.verified ? 1 : 0}:${(u.followersList || []).length}:${(u.followingList || []).length}`

                    if (currentHash !== lastUsersProfileHash) {
                        lastUsersProfileHash = currentHash;
                        this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                    }
                });

                // Live Real Posts Stream (Filters out old "refresh kar lain" dummy announcement automatically)
                this.db.collection("nexus_real_posts").orderBy("createdAt", "desc").limit(50).onSnapshot(snap => {
                    this.posts = [];
                    snap.forEach(d => {
                        let p = d.data();
                        p.id = d.id;

                        image: (p.image && p.image.length > 90000) ? '' : p.image
                    }));

                    this.rebuildAllUsersMasterList();
                    this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });
                });
            },

            notifyAll: function() {
                this.listeners.onUsers.forEach(fn => { try { fn(this.users); } catch(e) {} });
                this.listeners.onPosts.forEach(fn => { try { fn(this.posts); } catch(e) {} });

            getCurrentUser: function() {
                let raw = localStorage.getItem('nx_active_account');
                if (!raw) return null;
                try {
                    let acc = JSON.parse(raw);
                    if (!acc || !acc.username || !acc.name) return null;
                    let cloudMatch = this.cloudAccounts.find(u => u.username && u.username.toLowerCase() === acc.username.toLowerCase());
                    if (cloudMatch) {
                        let merged = Object.assign({}, acc, cloudMatch, {
                            dp: cloudMatch.dp || acc.dp || '',

                        });
                        merged.followersList = cleanUniqueList(cloudMatch.followersList);
                        merged.followingList = cleanUniqueList(cloudMatch.followingList);

            switchTab: function(tabId, btnEl) {
                document.documentElement.style.overflow = '';

                document.querySelectorAll('.nx-tab-screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(tabId);

                document.querySelectorAll('.nx-nav-item').forEach(b => b.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
                else {
                    const navBtn = document.querySelector(`.nx-nav-item[data-tab="${tabId}"]`);
                    if (navBtn) navBtn.classList.add('active');
                }
                window.scrollTo(0, 0);
            },

                const t = document.getElementById('nx-toast');
                if (!t) return;

                t.style.display = 'block';
                setTimeout(() => { t.style.display = 'none'; }, 2200);

            // UPGRADED: Supports BOTH Photos AND up to 50MB Videos natively in Post Modal & Chat!
            compressImage: function(file, maxW, quality, callback) {
                if (!file) return;
                if (file.type && file.type.startsWith('video/') && typeof window.__nxUploadVideoForPost === 'function') {
                    window.__nxUploadVideoForPost(file, callback);
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = Math.min(maxW || 780, 780);
                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL('image/webp', quality || 0.7);
                        if (!out || out.length < 50 || out.length > 150000) {
                            out = canvas.toDataURL('image/jpeg', 0.64);
                        }
                        callback(out);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        document.addEventListener('DOMContentLoaded', () => Nexus.init());
        setTimeout(() => Nexus.init(), 100);
        // Re-notify modules once all 30 scripts finish parsing so new users NEVER need to refresh!
        window.addEventListener('load', () => {
            setTimeout(() => Nexus.notifyAll(), 250);
            setTimeout(() => Nexus.notifyAll(), 900);
            setTimeout(() => Nexus.notifyAll(), 2000);
        });

        // ========================================================================
        // 1. STRICT OPEN CHAT CONTAINER & ZERO-BLINK WHATSAPP DOM DIFFING PATCH
        // ========================================================================
        function getStrictOpenChatMessagesBox() {
            const msgInput =
                document.getElementById("nx-dm-input") ||
                document.getElementById("nx-chat-msg-in") ||
                document.querySelector('input[placeholder*="Message"]');

            if (!msgInput || msgInput.offsetParent === null) return null;

            const exactIds = ["nx-dm-messages", "nx-chat-messages", "chat-messages", "dm-messages"];
            for (const id of exactIds) {
                const el = document.getElementById(id);
                if (el && el.offsetParent !== null && !el.innerText.includes("Chat →")) {
                    installZeroBlinkWhatsAppPatch(el);
                    return el;
                }
            }

            let parent = msgInput.parentElement;
            while (parent && parent !== document.body) {
                for (let i = 0; i < parent.children.length; i++) {
                    const child = parent.children[i];
                    if (child.contains(msgInput)) continue;
                    const st = window.getComputedStyle(child);
                    if (
                        (st.overflowY === "auto" || st.overflowY === "scroll") &&
                        child.clientHeight > 120 &&
                        !child.innerText.includes("Chat →") &&
                        !child.innerText.includes("Save private notes")
                    ) {
                        installZeroBlinkWhatsAppPatch(child);
                        return child;
                    }
                }
                parent = parent.parentElement;
            }
            return null;
        }

        // Intercepts innerHTML on the chat box so dm.js/chat.js NEVER blinks or wipes the screen!
        function installZeroBlinkWhatsAppPatch(chatBox) {
            if (!chatBox || chatBox.__nxZeroBlinkInstalled) return;
            chatBox.__nxZeroBlinkInstalled = true;

            const nativeDesc = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
            if (!nativeDesc || !nativeDesc.set) return;

            Object.defineProperty(chatBox, "innerHTML", {
                configurable: true,
                get: function () {
                    return nativeDesc.get.call(this);
                },
                set: function (newHtml) {
                    const rk = getSharedRoomKey() || "default";
                    const prevRk = this.dataset.nxRoom || "";

                    if (!newHtml || !newHtml.trim() || (prevRk && prevRk !== rk)) {
                        this.dataset.nxRoom = rk;
                        nativeDesc.set.call(this, newHtml);
                        if (roomMediaMap[rk]) {
                            roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
                        }
                        this.scrollTop = this.scrollHeight;
                        return;
                    }

                    this.dataset.nxRoom = rk;
                    const temp = document.createElement("div");
                    nativeDesc.set.call(temp, newHtml);

                    const incNodes = Array.from(temp.children);
                    const curNodes = Array.from(this.children).filter(
                        (el) => !el.classList.contains("nx-ig-media-bubble")
                    );

                    if (curNodes.length === 0) {
                        nativeDesc.set.call(this, newHtml);
                        Array.from(this.children).forEach((c, idx) => {
                            if (!c.dataset.msgTs) {
                                c.dataset.msgTs = String(Date.now() - (incNodes.length - idx) * 1000);
                            }
                        });
                        if (roomMediaMap[rk]) {
                            roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
                        }
                        this.scrollTop = this.scrollHeight;
                        return;
                    }

                    const nearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 140;

                    incNodes.forEach((inc, i) => {
                        const cur = curNodes[i];
                        if (!cur) {
                            inc.dataset.msgTs = String(Date.now());
                            this.appendChild(inc);
                        } else if (cur.innerHTML !== inc.innerHTML) {
                            nativeDesc.set.call(cur, inc.innerHTML);
                            cur.className = inc.className;
                        }
                    });

                    if (curNodes.length > incNodes.length) {
                        for (let j = incNodes.length; j < curNodes.length; j++) {
                            curNodes[j].remove();
                        }
                    }

                    if (nearBottom) {
                        this.scrollTop = this.scrollHeight;
                    }
                }
            });
        }

        // ========================================================================
        // 2. RESOLVE SHARED ROOM KEY (1v1 COUPLE DM & GROUP CHAT)
        // ========================================================================
        function getSharedRoomKey() {
            const msgInput =
                document.getElementById("nx-dm-input") ||
                document.getElementById("nx-chat-msg-in") ||
                document.querySelector('input[placeholder*="Message"]');

            if (!msgInput || msgInput.offsetParent === null) return null;

            let headerTitle = "";
            const els = document.querySelectorAll("h1, h2, h3, h4, strong, b, span, div");
            for (const el of els) {
                if (el.children.length > 1) continue;
                const r = el.getBoundingClientRect();
                if (r.top >= 4 && r.top <= 90 && r.left >= 40 && r.width > 30) {
                    const t = (el.innerText || "").trim();
                    if (
                        t.length > 1 &&
                        t.length < 42 &&
                        !t.includes("Nexus") &&
                        !t.includes("Online") &&
                        !t.includes("Live Room") &&
                        !t.includes("Swipe") &&
                        !t.includes("PDF") &&
                        !t.includes("Chat →")

                        headerTitle = t;
                        break;
                    }
                }

            const raw = (headerTitle || window.currentChatUser || window.currentRoomId || "global_chat").trim();
            const lower = raw.toLowerCase();

            if (lower.includes("saved messages")) return "dm_saved_" + myUname;

            if (
                lower.includes("chat") ||
                lower.includes("room") ||
                lower.includes("group") ||
                lower.includes("club") ||
                lower.includes("arena") ||
                lower.includes("doubt")
            ) {
                return "grp_" + lower.replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
            }

            let partner = lower.replace(/^@/, "").replace(/\([^)]*\)/g, "").trim();
            if (window.Nexus && Array.isArray(Nexus.users)) {
                const found = Nexus.users.find(
                    (u) =>
                        u &&
                        ((u.username && u.username.toLowerCase().trim() === partner) ||
                            (u.name && u.name.toLowerCase().trim() === partner) ||
                            (u.name && lower.includes(u.name.toLowerCase().trim())))
                );
                if (found && found.username) partner = found.username.toLowerCase().trim();
            }
            partner = partner.replace(/[^a-z0-9_]/g, "");

            if (partner && partner !== myUname) {
                return "dm_pair_" + [myUname, partner].sort().join("__");
            }
            return "room_" + (partner || myUname);

        // ========================================================================

        const multiPicker = document.createElement("input");

        function compressImageToHD(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX = 820;
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > MAX) {
                            h = Math.round((h * MAX) / w);
                            w = MAX;
                        } else if (h > MAX) {
                            w = Math.round((w * MAX) / h);

                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL("image/webp", 0.72);
                        if (!out || out.length < 50 || out.length > 150000) {

                        resolve(out);

                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);

        }

        function uploadUpTo50MB(file, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const fd = new FormData();
                fd.append("reqtype", "fileupload");
                fd.append("time", "72h");
                fd.append("fileToUpload", file, file.name || "media.mp4");

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText && xhr.responseText.startsWith("http")) {
                        onProgress && onProgress(100);
                        resolve({ mode: "url", url: xhr.responseText.trim() });
                    } else {
                        chunkFallback(file, onProgress).then(resolve).catch(reject);
                    }
                };
                xhr.onerror = () => chunkFallback(file, onProgress).then(resolve).catch(reject);

        function chunkFallback(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const b64 = e.target.result;
                        const total = Math.ceil(b64.length / CHUNK_CHAR_SIZE);
                        const sid = "str_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
                        if (total === 1) {
                            onProgress && onProgress(100);
                            resolve({ mode: "inline", url: b64 });
                            return;
                        }
                        for (let i = 0; i < total; i++) {
                            await Nexus.db
                                .collection("nexus_media_chunks")
                                .doc(`${sid}_${i}`)
                                .set({ streamId: sid, index: i, data: b64.slice(i * CHUNK_CHAR_SIZE, (i + 1) * CHUNK_CHAR_SIZE) });
                            onProgress && onProgress(Math.round(((i + 1) / total) * 100));
                        }
                        resolve({ mode: "chunked", streamId: sid, totalChunks: total });
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function loadChunkedMedia(msg) {
            if (msg.mediaUrl) return msg.mediaUrl;
            if (msg.mode !== "chunked" || !msg.streamId || !Nexus.db) return "";
            const parts = [];
            for (let i = 0; i < msg.totalChunks; i++) {
                const d = await Nexus.db.collection("nexus_media_chunks").doc(`${msg.streamId}_${i}`).get();
                if (d.exists) parts.push(d.data().data);
            }
            return parts.join("");
        }

        // Send 1 or Multiple Files (Photos / 50MB Videos / View-Once / Voice Notes)
        async function sendSingleOrMultipleFiles(fileList, forcedType, isViewOnce) {
            if (!fileList || !fileList.length) return;
            const files = Array.from(fileList);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.size > MAX_VIDEO_BYTES) {
                    alert(`⚠️ ${file.name} 50MB se badi hai!`);
                    continue;
                }

                const rk = getSharedRoomKey();
                if (!rk) return;

                const sender = getMyUsername();
                const msgId = "nxm_" + Date.now() + "_" + i + "_" + Math.random().toString(36).slice(2, 5);
                const mime = (file.type || "").toLowerCase();
                const mediaType =
                    forcedType ||
                    (mime.startsWith("video")
                        ? "video"
                        : mime.startsWith("audio")
                        ? "audio"
                        : mime.includes("pdf")
                        ? "pdf"
                        : "image");

                const nowTs = Date.now() + i;
                const localUrl = URL.createObjectURL(file);

                const tempDoc = {
                    id: msgId,
                    roomKey: rk,
                    sender,
                    mediaType,
                    viewOnce: Boolean(isViewOnce),
                    opened: false,
                    fileName: file.name || "file",
                    statusText: "📤 1%",
                    createdAt: nowTs
                };
                renderChatMediaBubble(tempDoc, localUrl);

                try {
                    const finalDoc = {
                        id: msgId,
                        roomKey: rk,
                        sender,
                        mediaType,
                        viewOnce: Boolean(isViewOnce),
                        opened: false,
                        fileName: file.name || "file",
                        createdAt: nowTs,
                        statusText: "✓✓"
                    };

                    if (mediaType === "image") {
                        finalDoc.mode = "inline";
                        finalDoc.mediaUrl = await compressImageToHD(file);
                    } else {
                        const res = await uploadUpTo50MB(file, (pct) => {
                            const el = document.getElementById(msgId);
                            const st = el && el.querySelector(".nx-media-status");
                            if (st) st.textContent = `📤 ${pct}%`;
                        });
                        if (res.mode === "chunked") {
                            finalDoc.mode = "chunked";
                            finalDoc.streamId = res.streamId;
                            finalDoc.totalChunks = res.totalChunks;
                        } else {
                            finalDoc.mode = res.mode;
                            finalDoc.mediaUrl = res.url;
                        }
                    }

                    if (!roomMediaMap[rk]) roomMediaMap[rk] = [];
                    roomMediaMap[rk].push(Object.assign({}, finalDoc, { localUrl }));

                    if (Nexus.db) {
                        await Nexus.db.collection("nexus_live_media").doc(msgId).set(finalDoc);
                    }

                    const el = document.getElementById(msgId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "✓✓";
                } catch (err) {
                    const el = document.getElementById(msgId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "⚠️ Retry";
                }
            }
            Nexus.toast(files.length > 1 ? `✅ ${files.length} Photos Sent!` : "✅ Sent!");
        }

        async function toggleVoiceNote() {
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) voiceChunks.push(e.data);
                    };
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: "audio/webm" });
                        const file = new File([blob], "voicenote.webm", { type: "audio/webm" });
                        sendSingleOrMultipleFiles([file], "audio", false);
                        stream.getTracks().forEach((t) => t.stop());
                    };
                    voiceRecorder.start();
                    isRecordingVoice = true;
                    Nexus.toast("🎤 Recording HD Voice... Tap '+' Again to Send!");
                } catch (e) {
                    alert("Microphone permission Allow kijiye!");
                }
            } else {
                voiceRecorder.stop();
                isRecordingVoice = false;
            }
        }

                        multiPicker.multiple = false;
                        multiPicker.setAttribute("capture", "environment");
                        multiPicker.click();
                    } else if (act === "voice") {
                        toggleVoiceNote();
                    } else if (act === "audio-call") {
                        startCleanAudioCall(false);
                    } else if (act === "video-call") {
                        startCleanAudioCall(true);
                    } else if (act === "pdf") {
                        pendingViewOnceFlag = false;
                        multiPicker.accept = "application/pdf";
                        multiPicker.multiple = false;
                        multiPicker.removeAttribute("capture");
                        multiPicker.click();
                    }
                };

                document.addEventListener("click", () => {
                    menu.style.display = "none";
                });
            }

            menu.style.display = menu.style.display === "none" ? "block" : "none";
        }

        document.addEventListener(
            "click",
            (e) => {
                const btn = e.target.closest("button, span, div, label");
                if (!btn) return;
                const r = btn.getBoundingClientRect();
                if (r.top <= window.innerHeight - 140 || btn.classList.contains("nx-fab-post")) return;

                const t = (btn.innerText || "").trim();
                if ((t === "+" || t === "＋") && getStrictOpenChatMessagesBox()) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleCompletePlusMenu();
                }
            },
            true
        );

        // ========================================================================
        // 7. UPGRADE POST MODAL FOR 50MB VIDEO & RENDER VIDEOS IN HOME FEED
        // ========================================================================
        function upgradePostModalAndFeedVideos() {
            const postModal = document.getElementById("tab-post-modal");
            if (postModal && postModal.offsetParent !== null) {
                // Allow native file input inside Post Modal to pick both Photos AND Videos!
                postModal.querySelectorAll('input[type="file"]').forEach((inp) => {
                    if (!inp.accept.includes("video")) {
                        inp.setAttribute("accept", "image/*,video/mp4,video/webm,video/*");
                    }
                });
                const lbl = Array.from(postModal.querySelectorAll("div, span, p")).find(
                    (el) => el.children.length === 0 && el.innerText && el.innerText.includes("Tap to Upload Photo")
                );
                if (lbl) lbl.innerText = "📸🎬 Tap to Upload Photo or Video (<50MB)";
            }

            // Turn any video URLs inside Home Feed into sleek playable video tags
            document.querySelectorAll("#tab-home img").forEach((img) => {
                const src = img.getAttribute("src") || "";
                if (src.match(/\.(mp4|webm|mov)(\?|$)/i) || src.startsWith("data:video/")) {
                    const v = document.createElement("video");
                    v.src = src;
                    v.controls = true;
                    v.playsInline = true;
                    v.className = "w-full max-h-[420px] rounded-2xl border border-slate-800 bg-black mt-2 shadow-lg";
                    img.replaceWith(v);
                }
            });
        }
        setInterval(upgradePostModalAndFeedVideos, 500);

        // ========================================================================
        // 8. LIVE FIRESTORE MEDIA & WATCH-PARTY SYNC LISTENERS
        // ========================================================================
        function syncActiveRoomStreams() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox || !window.Nexus || !Nexus.db) return;

            const rk = getSharedRoomKey();
            if (!rk) return;

            if (roomMediaMap[rk]) {
                roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
            }

            if (rk === activeRoomKey) return;
            activeRoomKey = rk;

            if (unsubMedia) unsubMedia();
            if (unsubSync) unsubSync();

            unsubMedia = Nexus.db
                .collection("nexus_live_media")
                .where("roomKey", "==", rk)
                .onSnapshot((snap) => {
                    const currentIds = new Set();
                    const list = [];
                    snap.forEach((d) => {
                        currentIds.add(d.id);
                        list.push(d.data());
                    });

                    // Remove deleted media bubbles immediately on both phones
                    if (roomMediaMap[rk]) {
                        roomMediaMap[rk].forEach((oldItem) => {
                            if (!currentIds.has(oldItem.id)) {
                                document.getElementById(oldItem.id)?.remove();
                            }
                        });
                    }

                    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    roomMediaMap[rk] = list.slice(-35);
                    roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m));
                });

            unsubSync = Nexus.db
                .collection("nexus_watch_sync")
                .doc(rk)
                .onSnapshot((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    if (!data || !data.updatedAt || Date.now() - data.updatedAt > 10000) return;
                    if ((data.sender || "").toLowerCase() === getMyUsername() && Date.now() - lastBroadcastTime < 1200) {
                        return;
                    }
                    isPartnerSyncing = true;
                    const target = Number(data.currentTime) || 0;
                    currentMovieTime = target;
                    sendYtCmd("seekTo", [target, true]);
                    sendYtCmd(data.action === "pause" ? "pauseVideo" : "playVideo", []);
                    setTimeout(() => {
                        isPartnerSyncing = false;
                    }, 900);
                });
        }
        setInterval(syncActiveRoomStreams, 650);

        function sendYtCmd(func, args = []) {
            document.querySelectorAll('iframe[src*="youtube"]').forEach((f) => {
                const src = f.getAttribute("src") || "";
                if (!src.includes("enablejsapi=1")) {
                    f.setAttribute("src", src + (src.includes("?") ? "&" : "?") + "enablejsapi=1&playsinline=1");
                }
                try {
                    f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args }), "*");
                } catch (e) {}
            });
        }
    })();
    </script>
