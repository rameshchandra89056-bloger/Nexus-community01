                callClockTimer = setInterval(() => {
                    sec++;
                    const m = String(Math.floor(sec / 60)).padStart(2, "0");
                    const s = String(sec % 60).padStart(2, "0");
                    const lbl = document.getElementById("nx-call-state-txt");
                    if (lbl) lbl.textContent = `🟢 Connected ${m}:${s} • ${sessionId}`;
                }, 1000);
            };

            if (!isAnswering) {
                const offer = await peerConn.createOffer();
                await peerConn.setLocalDescription(offer);

                await callRef.set({
                    callDocId,
                    sessionId,
                    caller: myUname,
                    callerName: getMyUser(),
                    receiver: partner,
                    mode,
                    offer: { type: offer.type, sdp: offer.sdp },
                    answer: null,
                    status: "ringing",
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });

                callDocUnsub = callRef.onSnapshot(async (snap) => {
                    if (!snap.exists) return;
                    const data = snap.data();
                    if (!data) return;

                    if (data.status === "ended" || data.status === "declined") {
                        await window.cleanupAndEndNexusCall(null, false);
                        if (window.Nexus && Nexus.toast) Nexus.toast("☎️ Call Ended");
                        return;
                    }

                    if (data.answer && peerConn && !peerConn.currentRemoteDescription) {
                        await peerConn.setRemoteDescription(new RTCSessionDescription(data.answer));
                        startConnectedClock();
                    }
                });
            } else {
                await peerConn.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
                const answer = await peerConn.createAnswer();
                await peerConn.setLocalDescription(answer);

                await callRef.set({
                    answer: { type: answer.type, sdp: answer.sdp },
                    status: "connected",
                    updatedAt: Date.now()
                }, { merge: true });

                startConnectedClock();

                callDocUnsub = callRef.onSnapshot(async (snap) => {
                    if (!snap.exists) return;
                    const d = snap.data();
                    if (d && (d.status === "ended" || d.status === "declined")) {
                        await window.cleanupAndEndNexusCall(null, false);
                        if (window.Nexus && Nexus.toast) Nexus.toast("☎️ Call Ended");
                    }
                });
            }

            iceUnsub = candidatesCol.onSnapshot((snap) => {
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const cData = change.doc.data();
                        if (cData && cData.sender !== myUname && cData.candidate && peerConn) {
                            peerConn.addIceCandidate(new RTCIceCandidate(cData.candidate)).catch(() => {});
                        }
                    }
                });
            });
        };

        async function parseYouTubeHtmlViaProxy(query) {
            const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}&hl=en`;
            const proxyUrls = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(ytSearchUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(ytSearchUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(ytSearchUrl)}`
            ];

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetch(pUrl);
                    if (!res.ok) continue;
                    const html = await res.text();
                    if (!html || !html.includes("videoRenderer")) continue;

                    const results = [];
                    const regex = /"videoRenderer":\{"videoId":"([a-zA-Z0-9_-]{11})".*?"title":\{"runs":\[\{"text":"([^"]+)"\}\]/g;
                    let match;
                    const seen = new Set();
                    while ((match = regex.exec(html)) !== null && results.length < 12) {
                        const vid = match[1];
                        const rawTitle = match[2].replace(/\\u0026/g, "&").replace(/\\"/g, '"');
                        if (!seen.has(vid)) {
                            seen.add(vid);
                            results.push({
                                videoId: vid,
                                title: rawTitle,
                                channel: "YouTube Official",
                                thumb: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`
                            });
                        }
                    }
                    if (results.length > 0) return results;
                } catch (e) {}
            }
            return [];
        }

        // =========================================================================
        // 5. FIXED NEXUS OFFICIAL STORY VIEWER (ZERO BLACK SCREEN!)
        // =========================================================================
        const storyBlobCache = {};

        function isStoryActive(s) {
            const now = Date.now();
            return s && s.isOfficial === true && !s.archived && (Number(s.scheduledAt || 0) <= now) && (Number(s.expiresAt || 0) > now || s.isHighlight === true);
        }

        async function loadStoryMediaAsPlayableUrl(item, prefix) {
            const cacheKey = `${item.id}_${prefix}`;
            if (storyBlobCache[cacheKey]) return storyBlobCache[cacheKey];

            let rawData = item[prefix + "Inline"] || item[prefix + "Url"] || "";
            const sid = item[prefix + "StreamId"];
            const total = Number(item[prefix + "TotalChunks"] || 0);

            if (!rawData && sid && total > 0) {
                const db = dbRef();
                if (!db) return "";
                const parts = [];
                for (let i = 0; i < total; i++) {
                    const d = await db.collection("nexus_media_chunks").doc(`${sid}_${i}`).get();
                    if (d.exists && d.data() && d.data().data) parts.push(d.data().data);
                }
                rawData = parts.join("");
            }

            if (rawData && rawData.startsWith("data:")) {
                try {
                    const res = await fetch(rawData);
                    const blob = await res.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    storyBlobCache[cacheKey] = blobUrl;
                    return blobUrl;
                } catch (e) {
                    return rawData;
                }
            }
            return rawData;
        }

            }

            modal.querySelector("#nxsv-stage").onclick = (e) => {
                if (e.clientX < window.innerWidth / 3) showSlide(index - 1);
                else showSlide(index + 1);
            };

            showSlide(index);
        };

        window.addEventListener("load", () => {
            setTimeout(initOfficialStoryListener, 800);
            setTimeout(startGlobalIncomingCallListener, 1200);
        });
    })();
    </script>
</body>
</html>
