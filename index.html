    <!-- ================= 0.01s COLD-START REST PRE-FETCHER FOR BRAND NEW VISITORS ================= -->
    <script>
    (function () {
        const PROJECT_ID = "nexus-community-bf99c";
        const BASE_REST_URL = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";

        function parseFirestoreFields(fields) {
            if (!fields) return {};
            const out = {};
            for (const k in fields) {
                const v = fields[k];
                if ("stringValue" in v) out[k] = v.stringValue;
                else if ("integerValue" in v) out[k] = Number(v.integerValue);
                else if ("doubleValue" in v) out[k] = Number(v.doubleValue);
                else if ("booleanValue" in v) out[k] = Boolean(v.booleanValue);
                else if ("arrayValue" in v) {
                    out[k] = (v.arrayValue.values || []).map((item) => item.stringValue || item.integerValue || "");
                }
            }
            return out;
        }

        async function preloadRealDatabaseForNewVisitor() {
            try {
                const [pRes, uRes] = await Promise.all([
                    fetch(BASE_REST_URL + "/nexus_real_posts?pageSize=25"),
                    fetch(BASE_REST_URL + "/nexus_accounts?pageSize=60")
                ]);

                if (pRes.ok) {
                    const pJson = await pRes.json();
                    if (pJson.documents && pJson.documents.length) {
                        const posts = pJson.documents
                            .map((d) => {
                                const obj = parseFirestoreFields(d.fields);
                                obj.id = d.name.split("/").pop();
                                return obj;
                            })
                            .filter((p) => {
                                const t = String(p.content || p.text || "").toLowerCase();
                                return !t.includes("website ko refresh kar lain") && !t.includes("ek baar refresh");
                            })
                            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                        if (posts.length) {
                            try { localStorage.setItem("nx_light_posts_v1", JSON.stringify(posts.slice(0, 25))); } catch (e) {}
                            if (window.Nexus) {
                                Nexus.posts = posts;
                                Nexus.listeners.onPosts.forEach((fn) => { try { fn(Nexus.posts); } catch (e) {} });
                            }
                        }
                    }
                }

                if (uRes.ok) {
                    const uJson = await uRes.json();
                    if (uJson.documents && uJson.documents.length) {
                        const users = uJson.documents
                            .map((d) => parseFirestoreFields(d.fields))
                            .filter((u) => u && u.username);

                        if (users.length) {
                            try { localStorage.setItem("nx_master_users_v1", JSON.stringify(users)); } catch (e) {}
                            if (window.Nexus) {
                                Nexus.cloudAccounts = users;
                                if (typeof Nexus.rebuildAllUsersMasterList === "function") Nexus.rebuildAllUsersMasterList();
                                Nexus.listeners.onUsers.forEach((fn) => { try { fn(Nexus.users); } catch (e) {} });
                            }
                        }
                    }
                }
            } catch (e) {}
        }
        preloadRealDatabaseForNewVisitor();
    })();
    </script>

    <!-- 1. TAILWIND CSS ENGINE (With preflight:false so existing Nexus CSS stays 100% intact!) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                corePlugins: {
                    preflight: false
                },
                theme: {
                    extend: {
                        colors: {
                            nexusDark: '#090d16',
                            nexusCard: '#0f172a',
                            nexusGreen: '#10b981',
                            nexusCyan: '#38bdf8'
                        }
                    }
                }
            };
        }

        // 2. SILENT LIVE HOT-RELOAD & TYPING DRAFT PROTECTOR
        (function() {
            let currentAppVersion = null;

            document.addEventListener('input', function(e) {
                if (e.target && (e.target.id === 'nx-dm-input' || e.target.id === 'nx-chat-msg-in')) {
                    try { sessionStorage.setItem('nx_draft_' + e.target.id, e.target.value); } catch (err) {}
                }
            }, { passive: true });

            window.hotReloadNexusModule = function(fileName) {
                const oldScript = document.querySelector(`script[src^="${fileName}"]`);
                const newScript = document.createElement('script');
                newScript.src = `${fileName}?v=${Date.now()}`;
                newScript.charset = 'UTF-8';
                document.body.appendChild(newScript);
                if (oldScript) setTimeout(() => oldScript.remove(), 1500);
            };

            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!window.Nexus || !Nexus.db) return;
                    Nexus.db.collection("nexus_config").doc("live_version").onSnapshot(function(doc) {
                        if (!doc.exists) return;
                        let data = doc.data();
                        if (!currentAppVersion) {
                            currentAppVersion = data.versionId;
                            return;
                        }
                        if (data.versionId && data.versionId !== currentAppVersion) {
                            currentAppVersion = data.versionId;
                            let targetFiles = Array.isArray(data.files) && data.files.length
                                ? data.files
                                : ['core.js', 'home.js', 'chat.js', 'dm.js'];
                            targetFiles.forEach(function(f) { window.hotReloadNexusModule(f); });
                        }
                    });
                }, 2500);
            });
        })();
    </script>

        function safeSetLocalCache(key, dataObj) {
            try {
                localStorage.setItem(key, JSON.stringify(dataObj));
            } catch (e) {
                let me = localStorage.getItem('nx_active_account');
                let sv = localStorage.getItem('nx_saved_posts');

        function cleanUniqueList(arr) {
            if (!Array.isArray(arr)) return [];
            let seen = new Set();
            let out = [];
            arr.forEach(item => {

                if (s && !seen.has(s)) {

                    out.push(s);

            compressImage: function(file, maxW, quality, callback) {
                if (!file) return;
                if (file.type && file.type.startsWith('video/') && typeof window.__nxUploadVideoForPost === 'function') {
                    window.__nxUploadVideoForPost(file, callback);
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = Math.min(maxW || 780, 780);
                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL('image/webp', quality || 0.7);
                        if (!out || out.length < 50 || out.length > 150000) {
                            out = canvas.toDataURL('image/jpeg', 0.64);
                        }
                        callback(out);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

    <script>
    (function () {

        function getMyUsername() {

        // ========================================================================

        document.addEventListener(

        // ========================================================================
        // 2. STRICT UNICODE-SAFE PARTNER ROOM KEY (PHOTOS NEVER LEAK BETWEEN USERS!)
        // ========================================================================
        function getStrictOpenChatMessagesBox() {
            const msgInput =
                document.getElementById("nx-dm-input") ||
                document.getElementById("nx-chat-msg-in") ||
                document.querySelector('input[placeholder*="Message"]');

            if (!msgInput || msgInput.offsetParent === null) return null;

            const exactIds = ["nx-dm-messages", "nx-chat-messages", "chat-messages", "dm-messages"];
            for (const id of exactIds) {
                const el = document.getElementById(id);
                if (el && el.offsetParent !== null && !el.innerText.includes("Chat →")) {
                    installZeroBlinkWhatsAppPatch(el);
                    return el;
                }

            let parent = msgInput.parentElement;
            while (parent && parent !== document.body) {
                for (let i = 0; i < parent.children.length; i++) {
                    const child = parent.children[i];
                    if (child.contains(msgInput)) continue;
                    const st = window.getComputedStyle(child);
                    if (
                        (st.overflowY === "auto" || st.overflowY === "scroll") &&
                        child.clientHeight > 120 &&
                        !child.innerText.includes("Chat →") &&
                        !child.innerText.includes("Save private notes")
                    ) {
                        installZeroBlinkWhatsAppPatch(child);
                        return child;
                    }
                }
                parent = parent.parentElement;
            }
            return null;
        }

        // Unicode-safe hash so fancy names like ꧁ঔৣ☬CHANCHAL☬ঔৣ꧂ get a 100% unique key!
        function unicodeSafeSlug(str) {
            const s = String(str || "").trim().toLowerCase();
            const ascii = s.replace(/[^a-z0-9]/g, "");
            let hash = 0;
            for (let i = 0; i < s.length; i++) {
                hash = (hash << 5) - hash + s.charCodeAt(i);
                hash |= 0;
            }
            return (ascii ? ascii + "_" : "u_") + Math.abs(hash).toString(36);
        }

        function getSharedRoomKey() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox) return null;

            const myUname = getMyUsername() || "guest";

            // Find the active chat header title right above "Last seen" / "Online Now" / "Live Room"
            let headerTitle = "";
            const chatRoot = chatBox.parentElement || document.body;
            const els = chatRoot.querySelectorAll("h1, h2, h3, h4, strong, b, span, div");
            for (const el of els) {
                if (el.children.length > 1) continue;
                const r = el.getBoundingClientRect();
                if (r.top >= 2 && r.top <= 95 && r.left >= 36 && r.width > 25) {
                    const t = (el.innerText || "").trim();
                    if (
                        t.length > 1 &&
                        t.length < 48 &&
                        !t.includes("Nexus") &&
                        !t.includes("Online Now") &&
                        !t.includes("Last seen") &&
                        !t.includes("Live Room") &&
                        !t.includes("Swipe") &&
                        !t.includes("PDF") &&
                        !t.includes("Chat →")

                        headerTitle = t;
                        break;
                    }

            const raw = (headerTitle || window.currentChatUser || window.currentRoomId || "").trim();
            if (!raw) return null;
            const lower = raw.toLowerCase();

            if (lower.includes("saved messages")) {
                return "dm_saved_" + myUname;
            }

            if (
                lower.includes("student chat") ||
                lower.includes("live room") ||
                lower.includes("group") ||
                lower.includes("club") ||
                lower.includes("arena") ||
                lower.includes("doubt")
            ) {
                return "grp_" + unicodeSafeSlug(lower);
            }

            // 1v1 DM: Match exact user in Nexus.users by username or fancy display name
            let partnerKey = "";
            const cleanLookup = lower.replace(/^@/, "").replace(/\.\.\.$/, "").trim();
            if (window.Nexus && Array.isArray(Nexus.users)) {
                const matched = Nexus.users.find((u) => {
                    if (!u) return false;
                    const uName = (u.username || "").toLowerCase().trim();
                    const dName = (u.name || "").toLowerCase().trim();
                    return (
                        uName === cleanLookup ||
                        dName === cleanLookup ||
                        (cleanLookup.length >= 4 && (dName.startsWith(cleanLookup) || cleanLookup.startsWith(dName)))
                    );
                });
                if (matched && matched.username) {
                    partnerKey = matched.username.toLowerCase().trim();
                }
            }

            if (!partnerKey) {
                partnerKey = unicodeSafeSlug(cleanLookup);
            }

            const sortedPair = [myUname, partnerKey].sort().join("__");
            return "dm_pair_" + sortedPair;
        }

        // ========================================================================
        // 3. TRUE CHRONOLOGICAL MESSAGE ORDERING ('Hello 11:20' ALWAYS BELOW '11:19'!)
        // ========================================================================
        function extractMessageTimestamp(el) {
            if (el.dataset && el.dataset.msgTs) {
                return Number(el.dataset.msgTs);
            }
            // Parse HH:MM (e.g., "11:20") from inside native message bubble text
            const txt = el.innerText || "";
            const match = txt.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
            if (match) {
                const now = new Date();
                const msgDate = new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate(),
                     parseInt(match[1], 10),
                    parseInt(match[2], 10),
                    30
                );
                const ts = msgDate.getTime();
                el.dataset.msgTs = String(ts);
                return ts;
            }
            const fallbackTs = Date.now();
            el.dataset.msgTs = String(fallbackTs);
            return fallbackTs;
        }

        function sortChatMessagesChronologically(chatBox, currentRoomKey) {
            if (!chatBox) return;
            // First, remove any media bubble that belongs to a DIFFERENT room!
            chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                if (b.dataset.roomKey && b.dataset.roomKey !== currentRoomKey) {
                    b.remove();
                }
            });

            // Stamp all native message nodes with their accurate time
            const allKids = Array.from(chatBox.children);
            allKids.forEach((k) => extractMessageTimestamp(k));

            // Ensure every media bubble is positioned BEFORE any message that has a strictly newer timestamp
            const mediaBubbles = Array.from(chatBox.querySelectorAll(".nx-ig-media-bubble"));
            mediaBubbles.forEach((mb) => {
                const mTs = Number(mb.dataset.msgTs || 0);
                const siblings = Array.from(chatBox.children);
                for (let i = 0; i < siblings.length; i++) {
                    const sib = siblings[i];
                    if (sib === mb) continue;
                    const sTs = extractMessageTimestamp(sib);
                    // If a native text message has a newer timestamp (e.g. 11:20 > 11:19), place media bubble BEFORE it
                    if (sTs > mTs + 15000) {
                        chatBox.insertBefore(mb, sib);
                        break;
                    }
                }
            });
        }

        // Zero-Blink WhatsApp DOM Diffing on Chat Container
        function installZeroBlinkWhatsAppPatch(chatBox) {
            if (!chatBox || chatBox.__nxV5ZeroBlink) return;
            chatBox.__nxV5ZeroBlink = true;

            const nativeDesc = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
            if (!nativeDesc || !nativeDesc.set) return;

            Object.defineProperty(chatBox, "innerHTML", {
                configurable: true,
                get: function () {
                    return nativeDesc.get.call(this);
                },
                set: function (newHtml) {
                    const rk = getSharedRoomKey() || "default";
                    const prevRk = this.dataset.nxRoom || "";

                    // If switching to a different user's chat, wipe old DOM cleanly first!
                    if (!newHtml || !newHtml.trim() || (prevRk && prevRk !== rk)) {
                        this.dataset.nxRoom = rk;
                        nativeDesc.set.call(this, newHtml);
                        if (roomMediaMap[rk]) {
                            roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
                        }
                        sortChatMessagesChronologically(this, rk);
                        this.scrollTop = this.scrollHeight;
                        return;
                    }

                    this.dataset.nxRoom = rk;
                    const temp = document.createElement("div");
                    nativeDesc.set.call(temp, newHtml);

                    const incNodes = Array.from(temp.children);
                    const curNodes = Array.from(this.children).filter(
                        (el) => !el.classList.contains("nx-ig-media-bubble")
                    );

                    const nearBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 150;

                    incNodes.forEach((inc, i) => {
                        const cur = curNodes[i];
                        if (!cur) {
                            inc.dataset.msgTs = String(Date.now());
                            this.appendChild(inc);

        // ========================================================================
        // 6. UPLOAD ENGINE (MULTI-PHOTO, 50MB VIDEO, VIEW ONCE, VOICE NOTE)
        // ========================================================================
        const multiPicker = document.createElement("input");
        multiPicker.type = "file";
        multiPicker.style.display = "none";
        document.body.appendChild(multiPicker);

        let pendingViewOnceFlag = false;

        function compressImageToHD(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX = 820;
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > MAX) {
                            h = Math.round((h * MAX) / w);
                            w = MAX;
                        } else if (h > MAX) {
                            w = Math.round((w * MAX) / h);
                            h = MAX;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        let out = canvas.toDataURL("image/webp", 0.72);
                        if (!out || out.length < 50 || out.length > 150000) {
                            out = canvas.toDataURL("image/jpeg", 0.65);
                        }
                        resolve(out);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function uploadUpTo50MB(file, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const fd = new FormData();
                fd.append("reqtype", "fileupload");
                fd.append("time", "72h");
                fd.append("fileToUpload", file, file.name || "media.mp4");

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText && xhr.responseText.startsWith("http")) {
                        onProgress && onProgress(100);
                        resolve({ mode: "url", url: xhr.responseText.trim() });
                    } else {
                        chunkFallback(file, onProgress).then(resolve).catch(reject);
                    }
                };
                xhr.onerror = () => chunkFallback(file, onProgress).then(resolve).catch(reject);
                xhr.open("POST", "https://litterbox.catbox.moe/resources/internals/api.php", true);
                xhr.send(fd);
            });
        }

        window.__nxUploadVideoForPost = async function (file, callback) {
            if (file.size > MAX_VIDEO_BYTES) {
                alert("⚠️ Video 50MB se chhoti honi chahiye!");
                return;
            }
            if (window.Nexus && Nexus.toast) Nexus.toast("📤 Uploading Video 1%...");
            try {
                const res = await uploadUpTo50MB(file, (pct) => {
                    const t = document.getElementById("nx-toast");
                    if (t) {
                        t.innerText = `📤 Uploading Video ${pct}%...`;
                        t.style.display = "block";
                    }
                });
                if (window.Nexus && Nexus.toast) Nexus.toast("✅ Video Ready! Tap Post to Publish");
                if (callback && res.url) callback(res.url);
            } catch (e) {
                if (window.Nexus && Nexus.toast) Nexus.toast("⚠️ Network slow, try smaller video");
            }
        };

        function chunkFallback(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const b64 = e.target.result;
                        const total = Math.ceil(b64.length / CHUNK_CHAR_SIZE);
                        const sid = "str_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
                        if (total === 1) {
                            onProgress && onProgress(100);
                            resolve({ mode: "inline", url: b64 });
                            return;
                        }
                        for (let i = 0; i < total; i++) {
                            await Nexus.db
                                .collection("nexus_media_chunks")
                                .doc(`${sid}_${i}`)
                                .set({ streamId: sid, index: i, data: b64.slice(i * CHUNK_CHAR_SIZE, (i + 1) * CHUNK_CHAR_SIZE) });
                            onProgress && onProgress(Math.round(((i + 1) / total) * 100));
                        }
                        resolve({ mode: "chunked", streamId: sid, totalChunks: total });
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function loadChunkedMedia(msg) {
            if (msg.mediaUrl) return msg.mediaUrl;
            if (msg.mode !== "chunked" || !msg.streamId || !window.Nexus || !Nexus.db) return "";
            const parts = [];
            for (let i = 0; i < msg.totalChunks; i++) {
                const d = await Nexus.db.collection("nexus_media_chunks").doc(`${msg.streamId}_${i}`).get();
                if (d.exists) parts.push(d.data().data);
            }
            return parts.join("");
        }

        async function sendSingleOrMultipleFiles(fileList, forcedType, isViewOnce) {
            if (!fileList || !fileList.length) return;
            const files = Array.from(fileList);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.size > MAX_VIDEO_BYTES) {
                    alert(`⚠️ ${file.name} 50MB se badi hai!`);
                    continue;
                }

                const rk = getSharedRoomKey();
                if (!rk) return;

                const sender = getMyUsername() || "user";
                const msgId = "nxm_" + Date.now() + "_" + i + "_" + Math.random().toString(36).slice(2, 5);
                const mime = (file.type || "").toLowerCase();
                const mediaType =
                    forcedType ||
                    (mime.startsWith("video")
                        ? "video"
                        : mime.startsWith("audio")
                        ? "audio"
                        : mime.includes("pdf")
                        ? "pdf"
                        : "image");

                const nowTs = Date.now() + i;
                const localUrl = URL.createObjectURL(file);

                const tempDoc = {
                    id: msgId,
                    roomKey: rk,
                    sender,
                    mediaType,
                    viewOnce: Boolean(isViewOnce),
                    opened: false,
                    fileName: file.name || "file",
                    statusText: "📤 1%",
                    createdAt: nowTs
                };
                renderChatMediaBubble(tempDoc, localUrl);

                try {
                    const finalDoc = {
                        id: msgId,
                        roomKey: rk,
                        sender,
                        mediaType,
                        viewOnce: Boolean(isViewOnce),
                        opened: false,
                        fileName: file.name || "file",
                        createdAt: nowTs,
                        statusText: "✓✓"
                    };

                    if (mediaType === "image") {
                        finalDoc.mode = "inline";
                        finalDoc.mediaUrl = await compressImageToHD(file);
                    } else {
                        const res = await uploadUpTo50MB(file, (pct) => {
                            const el = document.getElementById(msgId);
                            const st = el && el.querySelector(".nx-media-status");
                            if (st) st.textContent = `📤 ${pct}%`;
                        });
                        if (res.mode === "chunked") {
                            finalDoc.mode = "chunked";
                            finalDoc.streamId = res.streamId;
                            finalDoc.totalChunks = res.totalChunks;
                        } else {
                            finalDoc.mode = res.mode;
                            finalDoc.mediaUrl = res.url;
                        }
                    }

                    if (!roomMediaMap[rk]) roomMediaMap[rk] = [];
                    roomMediaMap[rk].push(Object.assign({}, finalDoc, { localUrl }));

                    if (window.Nexus && Nexus.db) {
                        await Nexus.db.collection("nexus_live_media").doc(msgId).set(finalDoc);
                    }

                    const el = document.getElementById(msgId);
                    if (el) {
                        el.dataset.rawUrl = finalDoc.mediaUrl || localUrl;
                        const vo = el.querySelector(".nx-open-viewonce");
                        if (vo) vo.dataset.url = finalDoc.mediaUrl || localUrl;
                        const st = el.querySelector(".nx-media-status");
                        if (st) st.textContent = "✓✓";
                    }
                } catch (err) {
                    const el = document.getElementById(msgId);
                    const st = el && el.querySelector(".nx-media-status");
                    if (st) st.textContent = "⚠️ Retry";
                }
            }
            if (window.Nexus && Nexus.toast) {
                Nexus.toast(isViewOnce ? "1️⃣ View Once Sent!" : files.length > 1 ? `✅ ${files.length} Photos Sent!` : "✅ Sent!");
            }
        }

        multiPicker.onchange = (e) => {
            if (e.target.files && e.target.files.length) {
                sendSingleOrMultipleFiles(e.target.files, null, pendingViewOnceFlag);
            }
            pendingViewOnceFlag = false;
            e.target.value = "";
        };

        // ========================================================================
        // 7. SINGLE '+' POWER MENU & CLEAN CALL / VOICE NOTE / SETTINGS
        // ========================================================================
        async function startCleanAudioCall(withVideo) {
            const rk = getSharedRoomKey() || "nexus_room";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: Boolean(withVideo)
                });
                stream.getTracks().forEach((t) => t.stop());
            } catch (e) {}

            const roomName = "NexusCleanCall_" + rk.replace(/[^a-zA-Z0-9]/g, "");
            const videoFlag = withVideo ? "false" : "true";
            const url = `https://meet.jit.si/${roomName}#config.startWithVideoMuted=${videoFlag}&config.startWithAudioMuted=false&config.prejoinPageEnabled=false`;

            const callModal = document.createElement("div");
            callModal.style.cssText = "position:fixed; inset:0; background:#020617; z-index:200005; display:flex; flex-direction:column;";
            callModal.innerHTML = `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#0f172a; border-bottom:1px solid #1e293b; color:#fff;">
                    <span style="font-weight:800; font-size:14px; color:#34d399;">${withVideo ? "📹 HD Video Call" : "📞 HD Crystal Voice Call"}</span>
                    <button type="button" id="nx-close-call-modal" style="padding:6px 16px; border-radius:999px; background:#e11d48; color:#fff; font-weight:800; font-size:12px; border:none; cursor:pointer;">End Call ☎️</button>
                </div>
                <iframe src="${url}" allow="camera; microphone; fullscreen; autoplay" style="flex:1; width:100%; border:0;"></iframe>
            `;
            document.body.appendChild(callModal);
            callModal.querySelector("#nx-close-call-modal").onclick = () => callModal.remove();
        }

        async function toggleVoiceNote() {
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    voiceRecorder = new MediaRecorder(stream);
                    voiceChunks = [];
                    voiceRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) voiceChunks.push(e.data);
                    };
                    voiceRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: "audio/webm" });
                        const file = new File([blob], "voicenote.webm", { type: "audio/webm" });
                        sendSingleOrMultipleFiles([file], "audio", false);
                        stream.getTracks().forEach((t) => t.stop());
                    };
                    voiceRecorder.start();
                    isRecordingVoice = true;
                    if (window.Nexus && Nexus.toast) Nexus.toast("🎤 Recording HD Voice... Tap '+' Again to Send!");
                } catch (e) {
                    alert("Microphone permission Allow kijiye!");
                }
            } else {
                voiceRecorder.stop();
                isRecordingVoice = false;
            }
        }

        function toggleCompletePlusMenu() {
            if (isRecordingVoice) {
                toggleVoiceNote();
                return;
            }

            let menu = document.getElementById("nx-whatsapp-plus-sheet");
            if (!menu) {
                menu = document.createElement("div");
                menu.id = "nx-whatsapp-plus-sheet";
                menu.style.cssText =
                    "display:none; position:fixed; bottom:70px; right:16px; width:265px; background:#0f172a; border:1.5px solid #10b981; border-radius:20px; padding:10px; z-index:100020; box-shadow:0 18px 45px rgba(0,0,0,0.92); color:#fff;";

                menu.innerHTML = `
                    <div style="font-size:10px; font-weight:900; color:#34d399; padding:2px 6px 6px; text-transform:uppercase; letter-spacing:0.6px;">⚡ Nexus Official Chat Tools</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px;">
                        <button type="button" data-act="multi-photo" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fff; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>🖼️</span> <span>Photos (Multi)</span>
                        </button>
                        <button type="button" data-act="view-once" style="padding:10px; border-radius:12px; background:linear-gradient(135deg,#0c4a6e,#1e3a8a); border:1px solid #38bdf8; color:#e0f2fe; font-weight:800; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span style="width:16px; height:16px; border-radius:50%; background:#38bdf8; color:#020617; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:900;">1</span>
                            <span>View Once</span>
                        </button>
                        <button type="button" data-act="video" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#38bdf8; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>🎬</span> <span>Video (50MB)</span>
                        </button>
                        <button type="button" data-act="camera" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fff; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>📸</span> <span>Camera Pic</span>
                        </button>
                        <button type="button" data-act="voice" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fb7185; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>🎤</span> <span>Voice Note</span>
                        </button>
                        <button type="button" data-act="audio-call" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#34d399; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>📞</span> <span>Voice Call</span>
                        </button>
                        <button type="button" data-act="video-call" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#818cf8; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>📹</span> <span>Video Call</span>
                        </button>
                        <button type="button" data-act="pdf" style="padding:10px; border-radius:12px; background:#1e293b; border:1px solid #334155; color:#fbbf24; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer;">
                            <span>📄</span> <span>Send PDF</span>
                        </button>
                    </div>
                `;

                document.body.appendChild(menu);

                menu.onclick = (ev) => {
                    const b = ev.target.closest("button[data-act]");
                    if (!b) return;
                    ev.stopPropagation();
                    menu.style.display = "none";
                    const act = b.getAttribute("data-act");

                    if (act === "multi-photo") {
                        pendingViewOnceFlag = false;
                        multiPicker.accept = "image/*";
                        multiPicker.multiple = true;
                        multiPicker.removeAttribute("capture");
                        multiPicker.click();
                    } else if (act === "view-once") {
                        pendingViewOnceFlag = true;
                        multiPicker.accept = "image/*,video/*";
                        multiPicker.multiple = false;
                        multiPicker.removeAttribute("capture");
                        multiPicker.click();
                    } else if (act === "video") {
                        pendingViewOnceFlag = false;
                        multiPicker.accept = "video/mp4,video/webm,video/*";
                        multiPicker.multiple = false;
                        multiPicker.removeAttribute("capture");
                        multiPicker.click();
                    } else if (act === "camera") {
                        pendingViewOnceFlag = false;
                        multiPicker.accept = "image/*";
                        multiPicker.multiple = false;
                        multiPicker.setAttribute("capture", "environment");
                        multiPicker.click();
                    } else if (act === "voice") {
                        toggleVoiceNote();
                    } else if (act === "audio-call") {
                        startCleanAudioCall(false);
                    } else if (act === "video-call") {
                        startCleanAudioCall(true);
                    } else if (act === "pdf") {
                        pendingViewOnceFlag = false;
                        multiPicker.accept = "application/pdf";
                        multiPicker.multiple = false;
                        multiPicker.removeAttribute("capture");
                        multiPicker.click();
                    }
                };

                document.addEventListener("click", () => {
                    menu.style.display = "none";
                });
            }

            menu.style.display = menu.style.display === "none" ? "block" : "none";
        }

        document.addEventListener(
            "click",
            (e) => {
                const btn = e.target.closest("button, span, div, label");
                if (!btn) return;
                const r = btn.getBoundingClientRect();
                if (r.top <= window.innerHeight - 140 || btn.classList.contains("nx-fab-post")) return;

                const t = (btn.innerText || "").trim();
                if ((t === "+" || t === "＋") && getStrictOpenChatMessagesBox()) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleCompletePlusMenu();
                }
            },
            true
        );

        // ========================================================================
        // 8. UI CLEANER, POST 50MB VIDEO & LIVE ROOM STREAM SYNC
        // ========================================================================
        function periodicMaintain() {
            // A. Hide dummy "refresh kar lain" announcement card
            document.querySelectorAll("#tab-home div").forEach((card) => {
                if (
                    card.children.length >= 2 &&
                    card.children.length <= 6 &&
                    card.innerText &&
                    card.innerText.includes("website ko refresh kar lain")
                ) {
                    card.style.display = "none";
                }
            });

            // B. Remove duplicate Watch-Party iframes
            const ytFrames = Array.from(document.querySelectorAll('iframe[src*="youtube"]'));
            if (ytFrames.length > 1) {
                for (let i = 0; i < ytFrames.length - 1; i++) {
                    const dupBox = ytFrames[i].closest("div");
                    if (dupBox) dupBox.style.display = "none";
                    ytFrames[i].remove();
                }
            }

            // C. Upgrade Post Modal for 50MB Video & convert video URLs in Home Feed
            const postModal = document.getElementById("tab-post-modal");
            if (postModal && postModal.offsetParent !== null) {
                postModal.querySelectorAll('input[type="file"]').forEach((inp) => {
                    if (!inp.accept.includes("video")) {
                        inp.setAttribute("accept", "image/*,video/mp4,video/webm,video/*");
                    }
                });
                const lbl = Array.from(postModal.querySelectorAll("div, span, p")).find(
                    (el) => el.children.length === 0 && el.innerText && el.innerText.includes("Tap to Upload Photo")
                );
                if (lbl) lbl.innerText = "📸🎬 Tap to Upload Photo or Video (<50MB)";
            }

            document.querySelectorAll("#tab-home img").forEach((img) => {
                const src = img.getAttribute("src") || "";
                if (src.match(/\.(mp4|webm|mov)(\?|$)/i) || src.startsWith("data:video/")) {
                    const v = document.createElement("video");
                    v.src = src;
                    v.controls = true;
                    v.playsInline = true;
                    v.style.cssText = "width:100%; max-height:420px; border-radius:16px; border:1px solid #1e293b; background:#000; margin-top:8px;";
                    img.replaceWith(v);
                }
            });

            // D. Restore "🚀 Share Nexus" in Settings Tab
            const settingsTab = document.getElementById("tab-settings");
            if (settingsTab && settingsTab.classList.contains("active") && !document.getElementById("nx-share-nexus-card")) {
                const shareCard = document.createElement("div");
                shareCard.id = "nx-share-nexus-card";
                shareCard.style.cssText =
                    "margin:12px 16px; padding:16px; border-radius:18px; background:linear-gradient(90deg,#064e3b,#0f172a); border:1px solid rgba(16,185,129,0.45); display:flex; align-items:center; justify-content:space-between; color:#fff;";
                shareCard.innerHTML = `
                    <div>
                        <div style="font-size:14px; font-weight:800; color:#34d399;">🚀 Share Nexus App</div>
                        <div style="font-size:11.5px; color:#cbd5e1; margin-top:2px;">Invite friends & study partners to Nexus</div>
                    </div>
                    <button type="button" id="nx-share-now-btn" style="padding:8px 16px; border-radius:12px; background:#10b981; color:#020617; font-weight:900; font-size:12px; border:none; cursor:pointer;">Share 🔗</button>
                `;
                settingsTab.prepend(shareCard);
                shareCard.querySelector("#nx-share-now-btn").onclick = async () => {
                    const shareData = {
                        title: "Nexus Community",
                        text: "🔥 Join me on Nexus Community (Live Chat, Watch-Party & Study Vault): ",
                        url: "https://nexus-community01.vercel.app/"
                    };
                    if (navigator.share) {
                        try { await navigator.share(shareData); return; } catch (e) {}
                    }
                    try {
                        await navigator.clipboard.writeText(shareData.text + shareData.url);
                        if (window.Nexus && Nexus.toast) Nexus.toast("✅ Nexus Link Copied!");
                    } catch (e) {}
                };
            }
        }
        setInterval(periodicMaintain, 450);

        // Live Room Listener with Strict Room Isolation
        function syncActiveRoomStreams() {
            const chatBox = getStrictOpenChatMessagesBox();
            if (!chatBox || !window.Nexus || !Nexus.db) return;

            const rk = getSharedRoomKey();
            if (!rk) return;

            // If user switched to a different person's chat, immediately clear previous user's media bubbles!
            if (rk !== activeRoomKey) {
                activeRoomKey = rk;
                chatBox.querySelectorAll(".nx-ig-media-bubble").forEach((b) => {
                    if (b.dataset.roomKey !== rk) b.remove();
                });

                if (unsubMedia) unsubMedia();
                if (unsubSync) unsubSync();

                unsubMedia = Nexus.db
                    .collection("nexus_live_media")
                    .where("roomKey", "==", rk)
                    .onSnapshot((snap) => {
                        const currentIds = new Set();
                        const list = [];
                        snap.forEach((d) => {
                            currentIds.add(d.id);
                            list.push(d.data());
                        });

                        if (roomMediaMap[rk]) {
                            roomMediaMap[rk].forEach((oldItem) => {
                                if (!currentIds.has(oldItem.id)) {
                                    document.getElementById(oldItem.id)?.remove();
                                }
                            });
                        }

                        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        roomMediaMap[rk] = list.slice(-35);
                        roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m));
                        sortChatMessagesChronologically(chatBox, rk);
                    });

                unsubSync = Nexus.db
                    .collection("nexus_watch_sync")
                    .doc(rk)
                    .onSnapshot((doc) => {
                        if (!doc.exists) return;
                        const data = doc.data();
                        if (!data || !data.updatedAt || Date.now() - data.updatedAt > 10000) return;
                        if ((data.sender || "").toLowerCase() === getMyUsername() && Date.now() - lastBroadcastTime < 1200) {
                            return;
                        }
                        isPartnerSyncing = true;
                        const target = Number(data.currentTime) || 0;
                        currentMovieTime = target;
                        sendYtCmd("seekTo", [target, true]);
                        sendYtCmd(data.action === "pause" ? "pauseVideo" : "playVideo", []);
                        setTimeout(() => {
                            isPartnerSyncing = false;
                        }, 900);
                    });
            } else {
                if (roomMediaMap[rk]) {
                    roomMediaMap[rk].forEach((m) => renderChatMediaBubble(m, m.localUrl));
                }
                sortChatMessagesChronologically(chatBox, rk);
            }
        }
        setInterval(syncActiveRoomStreams, 500);

        function sendYtCmd(func, args = []) {
            document.querySelectorAll('iframe[src*="youtube"]').forEach((f) => {
                const src = f.getAttribute("src") || "";
                if (!src.includes("enablejsapi=1")) {
                    f.setAttribute("src", src + (src.includes("?") ? "&" : "?") + "enablejsapi=1&playsinline=1");
                }
                try {
                    f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args }), "*");
                } catch (e) {}
            });
        }
    })();
    </script>
