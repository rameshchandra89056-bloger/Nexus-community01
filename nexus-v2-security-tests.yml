name: Nexus V2 Firestore Rules Tests

on:
  push:
    paths:
      - 'nexus-v2-foundation/**'
      - '.github/workflows/nexus-v2-security-tests.yml'
  pull_request:
    paths:
      - 'nexus-v2-foundation/**'
      - '.github/workflows/nexus-v2-security-tests.yml'

permissions:
  contents: read

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install isolated test dependencies
        working-directory: nexus-v2-foundation
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules tests in the local emulator
        working-directory: nexus-v2-foundation
        run: npm run test:rules
